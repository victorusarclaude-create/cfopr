/* ---------- operações: frações, potências, raízes ---------- */
M.ops=[
 ()=>{ const d=rP([2,3,4,5,8,10]), n=rI(1,d-1), tot=d*rI(2,12), a=tot*n/d; return arNum('Quanto é '+n+'/'+d+' de '+tot+'?',a,{d:0,c:[tot/d,tot*n,a+tot/d],steps:[tot+' ÷ '+d+' = '+(tot/d),(tot/d)+' × '+n+' = '+a]}); },
 ()=>{ const d=rI(3,12), a=rI(1,d-1), b=rI(1,d-1); return arCh('Calcule '+a+'/'+d+' + '+b+'/'+d+'.',fFr(a+b,d),[fFr(a+b,2*d),fFr(a*b,d),a+b+'/'+(2*d),fFr(a+b+1,d)],{x:'Mesmo denominador: some os numeradores e conserve o denominador.'}); },
 ()=>{ const b=rP([2,3,5,10]), x=rI(1,4), y=rI(1,3); return arNum('Calcule '+b+sq(x)+' × '+b+sq(y)+'.',Math.pow(b,x+y),{d:0,c:[Math.pow(b,x*y),b*(x+y),Math.pow(b,x)+Math.pow(b,y)],steps:['Mesma base: some os expoentes → '+b+sq(x+y),'= '+Math.pow(b,x+y)]}); }];
M.ops2=[
 ()=>{ const [d1,d2]=rN([2,3,4,5,6,8,10,12],2), a=rI(1,d1-1)||1, b=rI(1,d2-1)||1, D=lcm(d1,d2), N=a*D/d1+b*D/d2; return arCh('Calcule '+a+'/'+d1+' + '+b+'/'+d2+'.',fFr(N,D),[fFr(a+b,d1+d2),fFr(a*b,d1*d2),fFr(N+1,D),fFr(a*d2+b*d1+d1,d1*d2)],{x:'MMC('+d1+', '+d2+') = '+D+'. '+a+'/'+d1+' = '+(a*D/d1)+'/'+D+' e '+b+'/'+d2+' = '+(b*D/d2)+'/'+D+'. Soma: '+N+'/'+D+(gcd(N,D)>1?' = '+fFr(N,D):'')+'.'}); },
 ()=>{ const [a,b]=[rI(2,9)*rP([2,3,4,6]),rI(2,9)*rP([2,3,5])]; return arNum('Qual é o MMC de '+a+' e '+b+'?',lcm(a,b),{d:0,c:[a*b,gcd(a,b),lcm(a,b)*2],steps:['Fatore os dois números e multiplique os fatores com os maiores expoentes.','MMC = '+lcm(a,b)]}); },
 ()=>{ const g=rP([2,3,4,5,6,8,12]), a=g*rI(2,9), b=g*rI(2,9); if(gcd(a,b)!==g&&rC(.5)) return M.ops2[1](); return arNum('Qual é o MDC de '+a+' e '+b+'?',gcd(a,b),{d:0,c:[lcm(a,b),Math.min(a,b),g*2],steps:['Maior divisor comum aos dois números.','MDC = '+gcd(a,b)]}); },
 ()=>{ const a=rI(2,9), b=rI(2,9), c=rI(2,9); return arCh('Calcule '+a+'/'+b+' ÷ '+c+'/'+b+'.',fFr(a,c),[fFr(a*c,b*b),fFr(a*b,c),fFr(c,a)],{x:'Divisão de frações: conserve a primeira e multiplique pelo inverso da segunda: '+a+'/'+b+' × '+b+'/'+c+' = '+fFr(a,c)+'.'}); }];
M.ops3=[

mg('ar-mat-comb','mat-comb','Contagem e sorte','n!','Princípio multiplicativo, permutações, arranjos, combinações e probabilidade.',[
 {d:'Princípio fundamental da contagem.',g:[()=>{ const a=rI(2,6), b=rI(2,6), c=rI(2,5); return arNum('Um cadete tem '+a+' calças, '+b+' camisas e '+c+' pares de botas. De quantas formas pode se vestir?',a*b*c,{d:0,c:[a+b+c,a*b+c,a*b]}); }]},
 {d:'Permutações e anagramas.',g:[()=>{ const n=rI(4,7), f=rI(1,2); return arNum('Quantos anagramas de uma palavra com '+n+' letras distintas começam por uma letra fixa'+(f===2?' e terminam em outra letra fixa':'')+'?',fat(n-f),{d:0,c:[fat(n),fat(n-1)*2,n*(n-f)]}); },()=>{ const n=rI(3,6); return arNum('De quantas formas '+n+' bombeiros podem se organizar em fila?',fat(n),{d:0,c:[n*n,fat(n-1),n*2]}); },()=>{ const w=rP([['ARARA',5,[3,2]],['BANANA',6,[3,2]],['PARANÁ',6,[3]],['CASA',4,[2]],['OSSO',4,[2,2]]]); const v=fat(w[1])/w[2].reduce((p,k)=>p*fat(k),1); return arNum('Quantos anagramas tem a palavra '+w[0]+'?',v,{d:0,c:[fat(w[1]),v*2,fat(w[1]-1)]}); }]},
 {d:'Arranjo × combinação.',g:[()=>{ const n=rI(5,10), k=rI(2,3); return arNum('De quantas formas podemos escolher uma comissão de '+k+' pessoas entre '+n+'?',Cnk(n,k),{d:0,c:[Ank(n,k),n*k,Cnk(n,k)*2]}); },()=>{ const n=rI(5,10); return arNum(n+' candidatos disputam ouro, prata e bronze. Quantos pódios diferentes são possíveis?',Ank(n,3),{d:0,c:[Cnk(n,3),n*3,Math.pow(n,3)]}); },()=>arSort('A ordem importa?',['Arranjo (ordem importa)','Combinação (ordem não importa)'],rN([['Escolher presidente e vice',0],['Formar uma comissão de 3',1],['Senha de 4 dígitos distintos',0],['Escolher 2 sabores de sorvete',1],['Pódio de uma corrida',0],['Sortear 6 números da loteria',1]],4),{x:'Se trocar a ordem gera um resultado diferente, é arranjo.'})]},
 {d:'Probabilidade simples e complementar.',g:[()=>{ const ev=rP([['sair número par','1/2'],['sair número maior que 4','1/3'],['sair múltiplo de 3','1/3'],['sair o número 6','1/6'],['sair número menor que 6','5/6'],['sair número primo','1/2']]); return arCh('Num dado comum, qual a probabilidade de '+ev[0]+'?',ev[1],['1/2','1/3','1/6','2/3','5/6','1/4'].filter(x=>x!==ev[1]),{x:'Casos favoráveis ÷ casos possíveis (6).'}); },()=>{ const v=rI(2,6), a=rI(2,6), p=rI(1,4); const t=v+a+p; return arCh('Uma urna tem '+v+' bolas vermelhas, '+a+' azuis e '+p+' pretas. Qual a probabilidade de NÃO sair vermelha?',fFr(a+p,t),[fFr(v,t),fFr(a,t),fFr(p,t),fFr(1,t)],{x:'Não vermelha: ('+(a+p)+')/'+t+'.'}); }]},
 {d:'Eventos independentes, "pelo menos um", condicional.',g:[()=>{ const r=rI(2,6), a=rI(2,6), t=r+a; return arCh('Uma urna tem '+r+' bolas vermelhas e '+a+' azuis. Retirando duas, sem reposição, qual a probabilidade de as duas serem vermelhas?',fFr(r*(r-1),t*(t-1)),[fFr(r*r,t*t),fFr(r,t),fFr(r*(r-1),t*t),fFr(2*r,t*(t-1))],{x:'('+r+'/'+t+') × ('+(r-1)+'/'+(t-1)+') = '+fFr(r*(r-1),t*(t-1))+'.'}); },()=>{ const s=rI(3,11); const cases=[]; for(let i=1;i<=6;i++) for(let j=1;j<=6;j++) if(i+j===s) cases.push([i,j]); const k=rI(1,6); const fav=cases.filter(c=>c[0]===k||c[1]===k).length; if(!fav) return arCh('Dois dados: qual a probabilidade de a soma ser '+s+'?',fFr(cases.length,36),[fFr(1,6),fFr(cases.length+1,36),fFr(1,36)],{x:cases.length+' casos em 36.'}); return arCh('Dois dados são lançados. Sabendo que a soma foi '+s+', qual a probabilidade de aparecer pelo menos um '+k+'?',fFr(fav,cases.length),[fFr(fav,36),fFr(1,6),fFr(cases.length,36),fFr(fav+1,cases.length+1)],{x:'Soma '+s+': '+cases.length+' casos; com '+k+': '+fav+'.'}); },()=>{ const n=rP([2,3]); return arCh('Lançando uma moeda '+n+' vezes, qual a probabilidade de sair cara em todas?','1/'+Math.pow(2,n),['1/'+(2*n),n+'/'+Math.pow(2,n),'1/2','1/'+Math.pow(2,n+1)],{x:'Eventos independentes: multiplique (1/2)'+sq(n)+'.'}); },()=>{ const n=rP([2,3]); return arCh('Lançando uma moeda '+n+' vezes, qual a probabilidade de sair pelo menos uma cara?',(Math.pow(2,n)-1)+'/'+Math.pow(2,n),['1/'+Math.pow(2,n),'1/2',n+'/'+Math.pow(2,n),'1/'+n],{x:'Complementar: 1 − P(nenhuma cara) = 1 − 1/'+Math.pow(2,n)+'.'}); },()=>{ return arCh('Dois dados são lançados. Sabendo que a soma foi 8, qual a probabilidade de um dos dados ser 6?','2/5',['1/6','1/3','5/36','1/5'],{x:'Soma 8: (2,6),(3,5),(4,4),(5,3),(6,2) = 5 casos; com 6: 2 casos → 2/5.'}); }]}]);

 {d:'Gráficos e efeito de transformações.',g:[()=>{ const L=['Seg','Ter','Qua','Qui','Sex'], V=L.map(()=>rI(1,12)); const s=V.reduce((a,b)=>a+b); return arNum('O gráfico mostra ocorrências por dia. Qual a média diária?',s/5,{d:1,fig:fgBars(L,V,{yl:'ocorrências'}),c:[Math.max.apply(null,V),s,s/4]}); },()=>{ const k=rI(2,5), m=rI(5,10), dp=rI(1,4); return arCh('Um conjunto tem média '+m+' e desvio padrão '+dp+'. Somando '+k+' a todos os valores, média e desvio passam a ser:',(m+k)+' e '+dp,[(m+k)+' e '+(dp+k),m+' e '+dp,(m*k)+' e '+(dp*k)],{x:'Somar uma constante desloca a média, mas não muda a dispersão.'}); },()=>{ const k=rI(2,4), m=rI(3,8), dp=rI(1,3); return arCh('Multiplicando todos os valores por '+k+', média '+m+' e desvio '+dp+' passam a ser:',(m*k)+' e '+(dp*k),[(m*k)+' e '+dp,(m+k)+' e '+(dp*k),(m*k)+' e '+(dp*k*k)],{x:'Multiplicar por constante multiplica média e desvio padrão (a variância, pelo quadrado).'}); }]}]);

 {d:'Área por determinante e interseção.',g:[()=>{ const x1=rI(0,4), y1=rI(0,4), b=rI(2,6), h=rI(2,6); return arNum('Área do triângulo de vértices ('+x1+', '+y1+'), ('+(x1+b)+', '+y1+') e ('+x1+', '+(y1+h)+')?',b*h/2,{d:1,c:[b*h,b+h,b*h/4]}); },()=>{ const x=rI(-3,4), y=rI(-3,4), a=rNZ(-2,3), c=rNZ(-2,3); if(a===c) return arNum('Interseção de y = 2x e y = x + 3: qual o x?',3,{d:0,c:[6,1,-3]}); return arCh('Ponto de interseção de y = '+fPoly([a,y-a*x],'x')+' e y = '+fPoly([c,y-c*x],'x')+'?','('+fI(x)+', '+fI(y)+')',['('+fI(y)+', '+fI(x)+')','('+fI(-x)+', '+fI(y)+')','('+fI(x)+', '+fI(-y)+')'],{x:'Iguale as expressões e resolva.'}); }]}]);

 {d:'Limite 0/0 por fatoração.',g:[()=>{ const b=rNZ(-7,7); return arNum('Calcule o limite de (x² '+(b<0?'− '+(-b):'+ '+b)+'x)/x quando x → 0.',b,{d:0,neg:true,c:[0,1,-b],steps:['Coloque x em evidência: x(x '+(b<0?'− '+(-b):'+ '+b)+')/x','Cancele e substitua x = 0: '+fI(b)]}); },()=>{ const a=rNZ(-4,5), c=rNZ(-4,5); if(a===c) return arNum('Limite de (x² − 9)/(x − 3) quando x → 3?',6,{d:0,c:[3,0,9]}); return arNum('Calcule o limite de ('+fPoly([1,-(a+c),a*c],'x')+')/(x '+(a<0?'+ '+(-a):'− '+a)+') quando x → '+fI(a)+'.',a-c,{d:0,neg:true,c:[a+c,a,-c],steps:['Fatore: (x '+(a<0?'+ '+(-a):'− '+a)+')(x '+(c<0?'+ '+(-c):'− '+c)+')','Cancele e substitua: '+fI(a)+' '+(c<0?'+ '+(-c):'− '+c)+' = '+fI(a-c)]}); },()=>{ const a=rNZ(-5,5); return arNum('Calcule o limite de (x² − '+(a*a)+')/(x '+(a<0?'+ '+(-a):'− '+a)+') quando x → '+fI(a)+'.',2*a,{d:0,neg:true,c:[a,0,a*a],steps:['x² − '+(a*a)+' = (x − '+fI(a)+')(x + '+fI(a)+')','Cancele: x + '+fI(a)+' → '+fI(2*a)]}); }]},
 {d:'Derivada de polinômio.',g:[()=>{ const a=rI(2,6), n=rI(2,4), k=rI(1,3); return arNum('Se f(x) = '+a+'x'+sq(n)+', quanto vale f′('+k+')?',n*a*Math.pow(k,n-1),{d:0,c:[a*Math.pow(k,n),n*a,n*a*Math.pow(k,n)],steps:['f′(x) = '+(n*a)+'x'+(n-1>1?sq(n-1):''),'f′('+k+') = '+(n*a*Math.pow(k,n-1))]}); },()=>{ const a=rI(1,4), b=rI(-5,5), c=rI(-5,5); return arCh('Derivada de f(x) = '+fPoly([a,b,c],'x')+'?','f′(x) = '+fPoly([2*a,b],'x'),['f′(x) = '+fPoly([a,b],'x'),'f′(x) = '+fPoly([2*a,b,c],'x'),'f′(x) = '+fPoly([2*a,0],'x')],{x:'Regra da potência termo a termo; a constante some.'}); }]},

fg('ar-fis-unid','fis-unid','Unidades e ordens de grandeza','SI','Unidades do SI, conversões, prefixos, notação científica e análise dimensional.',[
 {d:'Grandeza e unidade no SI.',g:[cq([['Força','newton (N)'],['Energia','joule (J)'],['Potência','watt (W)'],['Pressão','pascal (Pa)'],['Carga elétrica','coulomb (C)'],['Corrente elétrica','ampère (A)'],['Resistência elétrica','ohm (Ω)'],['Tensão elétrica','volt (V)'],['Frequência','hertz (Hz)'],['Temperatura','kelvin (K)'],['Massa','quilograma (kg)'],['Quantidade de matéria','mol (mol)']],'Qual a unidade no SI de:')]},
 {d:'Conversões: km/h e m/s, cm, g, min.',g:[()=>{ const ms=rP([5,10,15,20,25,30]); return rC(.5)?arNum('Quanto é '+fN(ms*3.6,0)+' km/h em m/s?',ms,{d:0,u:'m/s',c:[ms*3.6*3.6,ms*36,ms*2]}):arNum('Quanto é '+ms+' m/s em km/h?',ms*3.6,{d:0,u:'km/h',c:[ms/3.6,ms*10,ms*36]}); },()=>{ const v=rI(2,90); const k=rI(0,2); return k===0?arNum(v+' cm equivalem a quantos metros?',v/100,{d:2,u:'m',c:[v/10,v/1000,v*100]}):k===1?arNum(v+' g equivalem a quantos kg?',v/1000,{d:3,u:'kg',c:[v/100,v/10,v*1000]}):arNum(v+' minutos equivalem a quantos segundos?',v*60,{d:0,u:'s',c:[v*100,v/60,v*3600]}); }]},

 {d:'Prefixos: mili, micro, nano, quilo, mega, giga.',g:[()=>{ const P=rP([['k','10³','quilo'],['M','10⁶','mega'],['G','10⁹','giga'],['m','10⁻³','mili'],['μ','10⁻⁶','micro'],['n','10⁻⁹','nano']]); return arCh('O prefixo '+P[2]+' ('+P[0]+') equivale a:',P[1],['10³','10⁶','10⁹','10⁻³','10⁻⁶','10⁻⁹','10²','10⁻²'].filter(x=>x!==P[1]),{x:P[2]+' = '+P[1]+'.'}); },()=>{ const v=rI(2,90); const k=rI(0,2); return k===0?arNum(v+' mA equivalem a quantos A?',v/1000,{d:3,u:'A',c:[v/100,v*1000,v/10]}):k===1?arNum(v+' km equivalem a quantos metros?',v*1000,{d:0,u:'m',c:[v*100,v/1000,v*10000]}):arNum(v+' MW equivalem a quantos kW?',v*1000,{d:0,u:'kW',c:[v*1e6,v/1000,v*100]}); }]},
 {d:'Análise dimensional e ordem de grandeza.',g:[cq([['Unidade de energia (J) em unidades de base:','kg·m²/s²','kg·m/s²|kg·m²/s|kg·m/s'],['Unidade de força (N) em unidades de base:','kg·m/s²','kg·m²/s²|kg/s²|kg·m/s'],['Unidade de pressão (Pa) em unidades de base:','kg/(m·s²)','kg·m/s²|kg·m²/s²|N·m'],['Unidade de potência (W) em unidades de base:','kg·m²/s³','kg·m²/s²|kg·m/s|J·s'],['1 kWh equivale a:','3,6 × 10⁶ J','1.000 J|3.600 J|3,6 × 10³ J'],['Ordem de grandeza de segundos em um dia (86.400 s):','10⁵','10⁴|10³|10⁶'],['Unidade de carga elétrica (C) em unidades de base:','A·s','A/s|V·A|J/V·s'],['Unidade de trabalho equivalente ao joule:','N·m','N/m|W/s|kg·m/s'],['1 cal equivale a aproximadamente:','4,2 J','1 J|42 J|0,42 J'],['1 atm equivale a aproximadamente:','10⁵ Pa','10³ Pa|10⁷ Pa|760 Pa'],['1 cavalo-vapor (cv) equivale a cerca de:','735 W','100 W|1.000 J|7.350 W']]),()=>{ const e=rI(-6,9), m=rP([1.2,2,3.5,4.1,6,8.7]); const og=m<3.16?e:e+1; return arNum('Qual a ordem de grandeza (expoente de 10) de '+fN(m,1)+' × 10'+sq(e)+'?',og,{d:0,neg:true,c:[e,og+1,og-1],steps:['Compare a mantissa com √10 ≈ 3,16: '+(m<3.16?'menor → mantém '+e:'maior → sobe para '+(e+1))]}); }]}]);

fg('ar-fis-din','fis-din','Leis de Newton','F=ma','As três leis, força resultante, atrito, plano inclinado, elevador e força centrípeta.',[
 {d:'Qual lei de Newton explica?',g:[cq([['O passageiro é lançado para a frente quando o ônibus freia.','1ª lei (inércia)'],['O bombeiro sente a mangueira empurrá-lo para trás ao lançar água.','3ª lei (ação e reação)'],['Quanto maior a força sobre o carrinho, maior a aceleração.','2ª lei (F = m·a)'],['Um foguete sobe expelindo gases para baixo.','3ª lei (ação e reação)'],['Um livro sobre a mesa permanece parado.','1ª lei (inércia)'],['Um caminhão carregado demora mais para acelerar que um vazio.','2ª lei (F = m·a)'],['O cinto de segurança segura o motorista numa freada brusca.','1ª lei (inércia)'],['Ao remar, o barco vai para a frente porque o remo empurra a água para trás.','3ª lei (ação e reação)'],['Um chute mais forte faz a bola sair mais rápido.','2ª lei (F = m·a)'],['Ao pular do barco para o cais, o barco se afasta.','3ª lei (ação e reação)'],['Puxar a toalha rapidamente sem derrubar os pratos.','1ª lei (inércia)'],['A arma recua quando dispara.','3ª lei (ação e reação)'],['Empurrar um carro vazio é mais fácil do que um cheio.','2ª lei (F = m·a)']],'Qual lei de Newton explica a situação?')]},
 {d:'F = m·a e peso.',g:[()=>{ const m=rI(2,50), a=rI(1,6); return arNum('Força resultante para acelerar '+m+' kg a '+a+' m/s²?',m*a,{d:0,u:'N',c:[m+a,m/a,m*a*10]}); },()=>{ const m=rI(2,120); return arNum('Peso de um corpo de '+m+' kg (g = 10)?',m*10,{d:0,u:'N',c:[m,m/10,m*100]}); }]},

   Nomenclatura gerada a partir de tabelas de íons e de cadeias carbônicas, tabela periódica
   interativa, balanceamento com coeficientes, cálculos com números novos a cada rodada. */

const AR_EL=('H,Hidrogênio,1,1,1,1.0|He,Hélio,2,1,18,4|Li,Lítio,3,2,1,7|Be,Berílio,4,2,2,9|B,Boro,5,2,13,11|C,Carbono,6,2,14,12|N,Nitrogênio,7,2,15,14|O,Oxigênio,8,2,16,16|F,Flúor,9,2,17,19|Ne,Neônio,10,2,18,20|'+
 'Na,Sódio,11,3,1,23|Mg,Magnésio,12,3,2,24|Al,Alumínio,13,3,13,27|Si,Silício,14,3,14,28|P,Fósforo,15,3,15,31|S,Enxofre,16,3,16,32|Cl,Cloro,17,3,17,35.5|Ar,Argônio,18,3,18,40|'+
 'K,Potássio,19,4,1,39|Ca,Cálcio,20,4,2,40|Sc,Escândio,21,4,3,45|Ti,Titânio,22,4,4,48|V,Vanádio,23,4,5,51|Cr,Cromo,24,4,6,52|Mn,Manganês,25,4,7,55|Fe,Ferro,26,4,8,56|Co,Cobalto,27,4,9,59|Ni,Níquel,28,4,10,59|Cu,Cobre,29,4,11,63.5|Zn,Zinco,30,4,12,65|'+

const EL=Object.fromEntries(AR_EL.map(e=>[e.s,e]));
const FAM={1:'Metais alcalinos',2:'Metais alcalino-terrosos',13:'Família do boro',14:'Família do carbono',15:'Família do nitrogênio',16:'Calcogênios',17:'Halogênios',18:'Gases nobres'};
const famOf=e=>e.s==='H'?'Hidrogênio (não pertence a família)':e.g>=3&&e.g<=12?'Metais de transição':FAM[e.g];
const METAL=e=>(e.g<=2&&e.s!=='H')||(e.g>=3&&e.g<=12)||['Al','Ga'].indexOf(e.s)>=0;
/* distribuição de Linus Pauling (sem as exceções Cr e Cu) */
const SUBN=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6]];
function pauling(z){ const out=[]; let r=z; for(const [n,c] of SUBN){ if(r<=0) break; const k=Math.min(c,r); out.push([n,k]); r-=k; } return out; }
const fPaul=d=>d.map(([n,k])=>n+sq(k)).join(' ');
function valence(z){ const d=pauling(z); const maxN=Math.max.apply(null,d.map(x=>+x[0][0])); return {n:maxN,e:d.filter(x=>+x[0][0]===maxN).reduce((a,x)=>a+x[1],0),last:d[d.length-1]}; }

/* ---------- íons para nomenclatura inorgânica ---------- */
const CAT=[['Na','sódio',1,1],['K','potássio',1,1],['Li','lítio',1,1],['Ag','prata',1,0],['NH₄','amônio',1,0],['Ca','cálcio',2,1],['Mg','magnésio',2,0],['Ba','bário',2,1],['Zn','zinco',2,0],['Fe','ferro II',2,0],['Cu','cobre II',2,0],['Al','alumínio',3,0],['Fe','ferro III',3,0]];
const ANI=[['Cl','cloreto',1,'clorídrico',1],['Br','brometo',1,'bromídrico',1],['I','iodeto',1,'iodídrico',1],['F','fluoreto',1,'fluorídrico',0],['S','sulfeto',2,'sulfídrico',0],['NO₃','nitrato',1,'nítrico',1],['NO₂','nitrito',1,'nitroso',0],['SO₄','sulfato',2,'sulfúrico',1],['SO₃','sulfito',2,'sulfuroso',0],['CO₃','carbonato',2,'carbônico',0],['PO₄','fosfato',3,'fosfórico',0],['ClO','hipoclorito',1,'hipocloroso',0],['ClO₄','perclorato',1,'perclórico',1]];
const poly=s=>/[A-Z].*[A-Z]|₄|₃|₂/.test(s)&&s.length>2;
function grp(s,n){ if(n===1) return s; return (poly(s)||s==='NH₄'?'('+s+')':s)+sb(n); }
function saltF(c,a){ const g=gcd(c[2],a[2]); return grp(c[0],a[2]/g)+grp(a[0],c[2]/g); }
const saltN=(c,a)=>a[1]+' de '+c[1];
const acidF=a=>'H'+(a[2]>1?sb(a[2]):'')+a[0];

const LECH=[['N₂(g) + 3H₂(g) ⇌ 2NH₃(g), ΔH < 0',4,2,-1],['2SO₂(g) + O₂(g) ⇌ 2SO₃(g), ΔH < 0',3,2,-1],['N₂O₄(g) ⇌ 2NO₂(g), ΔH > 0',1,2,1],['CO(g) + 2H₂(g) ⇌ CH₃OH(g), ΔH < 0',3,1,-1],['CaCO₃(s) ⇌ CaO(s) + CO₂(g), ΔH > 0',0,1,1]];
function lech(){ const r=rP(LECH), p=rP(['adicionar reagente','retirar produto','adicionar produto','aumentar a pressão','diminuir a pressão','aumentar a temperatura','diminuir a temperatura','adicionar catalisador']);
  let d; if(p==='adicionar reagente'||p==='retirar produto') d=1; else if(p==='adicionar produto') d=-1; else if(p==='adicionar catalisador') d=0;
  else if(p.indexOf('pressão')>=0){ const up=p.startsWith('aumentar'); d=r[1]===r[2]?0:((r[2]<r[1])===up?1:-1); } else { const up=p.startsWith('aumentar'); d=(r[3]>0)===up?1:-1; }
  const L={1:'Para os produtos (direita)',[-1]:'Para os reagentes (esquerda)',0:'Não se desloca'}[d];
  return arCh(r[0]+'\nAo '+p+', o equilíbrio se desloca:',L,['Para os produtos (direita)','Para os reagentes (esquerda)','Não se desloca'].filter(x=>x!==L),{x:'Le Chatelier: o sistema reage contra a perturbação. Pressão favorece o lado com menos mols de gás; aquecimento favorece o sentido endotérmico; catalisador não desloca.'}); }

const PREF=['met','et','prop','but','pent','hex','hept','oct'];
function chain(n,end){ const parts=[]; for(let i=0;i<n;i++) parts.push(i===0?(n===1?'CH₄':'CH₃'):'CH₂'); if(n>1) parts[n-1]='CH₃'; return parts; }
function orgGen(fn){ let n, name, f, C, H, O=0, N=0;
  if(fn==='alcano'){ n=rI(1,8); C=n; H=2*n+2; name=PREF[n-1]+'ano'; f=n===1?'CH₄':chain(n).join('–'); }
  else if(fn==='alceno'){ n=rI(2,6); C=n; H=2*n; name=n===2?'eteno':n===3?'propeno':PREF[n-1]+'-1-eno'; f='CH₂='+(n===2?'CH₂':'CH'+(n>3?'–'+Array(n-3).fill('CH₂').join('–'):'')+'–CH₃'); if(n>3) name=PREF[n-1]+'-1-eno'; }
  else if(fn==='alcino'){ n=rI(2,6); C=n; H=2*n-2; name=n===2?'etino':n===3?'propino':PREF[n-1]+'-1-ino'; f='CH≡'+(n===2?'CH':'C'+(n>3?'–'+Array(n-3).fill('CH₂').join('–'):'')+'–CH₃'); }
  else if(fn==='álcool'){ n=rI(1,6); C=n; H=2*n+2; O=1; name=n<=2?PREF[n-1]+'anol':PREF[n-1]+'an-1-ol'; f=n===1?'CH₃–OH':'CH₃–'+Array(n-2).fill('CH₂').concat(['CH₂–OH']).join('–'); }
  else if(fn==='aldeído'){ n=rI(1,6); C=n; H=2*n; O=1; name=PREF[n-1]+'anal'; f=n===1?'H–CHO':'CH₃–'+Array(n-2).fill('CH₂').concat(['CHO']).join('–'); }
  else if(fn==='cetona'){ n=rI(3,6); C=n; H=2*n; O=1; name=n<=4?PREF[n-1]+'anona':PREF[n-1]+'an-2-ona'; f='CH₃–CO–'+(n===3?'CH₃':Array(n-3).fill('CH₂').join('–')+'–CH₃'); }
  else if(fn==='ácido carboxílico'){ n=rI(1,6); C=n; H=2*n; O=2; name='ácido '+PREF[n-1]+'anoico'; f=n===1?'H–COOH':'CH₃–'+Array(n-2).fill('CH₂').concat(['COOH']).join('–'); }
  else if(fn==='amina'){ n=rI(1,4); C=n; H=2*n+3; N=1; name=['metil','etil','propil','butil'][n-1]+'amina'; f=(n===1?'CH₃':'CH₃–'+Array(n-2).fill('CH₂').concat(['CH₂']).join('–'))+'–NH₂'; }
  else if(fn==='éster'){ const a=rI(1,3), b=rI(1,2); C=a+b; H=2*(a+b); O=2; name=PREF[a-1]+'anoato de '+['metila','etila'][b-1]; f=(a===1?'H':'CH₃'+(a>2?'–CH₂':''))+'–COO–'+(b===1?'CH₃':'CH₂–CH₃'); }
  else if(fn==='amida'){ n=rI(1,4); C=n; H=2*n+1; O=1; N=1; name=PREF[n-1]+'anamida'; f=n===1?'H–CONH₂':'CH₃–'+Array(n-2).fill('CH₂').concat(['CONH₂']).join('–'); }
  else { const a=rI(1,2), b=rI(1,2); C=a+b; H=2*(a+b)+2; O=1; name=['metoxi','etoxi'][Math.min(a,b)-1]+['metano','etano'][Math.max(a,b)-1]; f=(a===1?'CH₃':'CH₃–CH₂')+'–O–'+(b===1?'CH₃':'CH₂–CH₃'); fn='éter'; }
  const mf='C'+(C>1?sb(C):'')+'H'+sb(H)+(N?'N':'')+(O?'O'+(O>1?sb(O):''):'');
  return {fn,name,f,mf,C,H,O,N}; }
const FUNCS=['alcano','alceno','alcino','álcool','aldeído','cetona','ácido carboxílico','amina','éster','éter','amida'];

/* ===================== ARENA: MOTOR E TELAS =====================
   Partida: 10 rodadas no nível escolhido (duas de revisão do nível anterior, a última vale
   em dobro). 8 de 10 liberam o próximo nível; 10 de 10 dá 3 estrelas. Também há Contra o
   relógio (60 s), Nivelamento (8 rodadas adaptativas) e Rodada inédita com IA. */
const AR_LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const AR_N=10, AR_SUBJ=['port','mat','fis','qui','hist'];
const AR_KIND={choice:'Múltipla escolha',tf:'Certo ou errado',num:'Digite o resultado',spot:'Toque no erro',pick:'Toque no termo',order:'Ponha em ordem',sort:'Classifique',match:'Ligue os pares',commas:'Pontue a frase',map:'Mapa',ptable:'Tabela periódica',balance:'Balanceie'};
function arRec(gid){ S.arena=S.arena||{}; return S.arena[gid]||(S.arena[gid]={lv:1,st:[0,0,0,0,0],p:0,rel:0,r:[]}); }
function arPeek(gid){ return (S.arena||{})[gid]||{lv:1,st:[0,0,0,0,0],p:0,rel:0,r:[]}; }
function arUnl(gid){ const g=AR_BY[gid]; return clamp(Math.max(arPeek(gid).lv||1,[1,2,3,4][T(g.t).rung||0]||1),1,5); }
const arStarsOf=gid=>(arPeek(gid).st||[]).reduce((a,b)=>a+(b||0),0);
function arDoneLv(gid){ const st=arPeek(gid).st||[]; return st.filter(x=>x>=2).length; }
function arKey(r){ return hashStr((r.q||'')+'|'+(r.opts?r.opts[r.right]:'')+'|'+JSON.stringify(r.parts||r.items||r.pairs||r.ch||r.L||'')+'|'+(r.zone||r.sym||'')).slice(0,8); }
function arValid(r){
  if(!r||!r.k||!r.q||/undefined|NaN|Infinity/.test(r.q)) return false;
  if(r.k==='choice'||r.k==='tf'||r.k==='num'){ if(!Array.isArray(r.opts)||r.opts.length<2||!(r.right>=0&&r.right<r.opts.length)) return false; if(r.opts.some(o=>o==null||o===''||/undefined|NaN|Infinity/.test(String(o)))) return false; if(new Set(r.opts.map(arNorm)).size!==r.opts.length) return false; }
  if(r.k==='num'&&!isFinite(r.ans)) return false;
  if((r.k==='spot'||r.k==='pick')&&(!r.parts||!r.parts.length)) return false;
  if(r.k==='sort'&&(!r.items||r.items.length<2||new Set(r.items.map(it=>it[1])).size<2)) return false;
  if(r.k==='match'&&(!r.pairs||r.pairs.length<3)) return false;
  if(r.k==='order'&&(!r.items||r.items.length<3)) return false;
  return true;
}
function arMake(g,L,seen,quick){
  const lv=g.lv[L-1]; let r=null;
  for(let i=0;i<30;i++){ let c=null; try{ c=rP(lv.g)(L); }catch(e){ c=null; }
    if(quick&&c&&['choice','tf','num'].indexOf(c.k)<0) c=arAsChoice(c);
    if(quick&&c&&c.fig) continue;
    if(!arValid(c)) continue; c.key=arKey(c); r=c; if(!seen.has(c.key)) break; }
  if(!r) return null;
  r.t=r.t||g.t; r.lvl=L; seen.add(r.key);
  if(L<=2&&(r.k==='choice'||r.k==='num')&&r.opts.length>4){ const ws=r.opts.map((o,i)=>i).filter(i=>i!==r.right); const drop=rP(ws); const R=r.opts[r.right]; r.opts=r.opts.filter((o,i)=>i!==drop); r.right=r.opts.indexOf(R); }
  if(r.k==='order') r.shuf=(function(){ let s; do{ s=rS(r.items.map((_,i)=>i)); }while(s.every((v,i)=>v===i)&&r.items.length>1); return s; })();
  if(r.k==='match') r.rs=rS(r.pairs.map((_,i)=>i));
  if(r.k==='sort') r.items=rS(r.items);
  return r;
}
function arStart(gid,L,mode,rounds){
  const g=AR_BY[gid]; if(!g) return; L=clamp(L||arUnl(gid),1,5);
  const seen=new Set(arPeek(gid).r||[]);
  clearModes(); gSeq++;
  const G={gid,L,mode:mode||'run',seq:gSeq,rounds:[],pos:0,ok:0,sc:0,tot:0,xp:0,combo:0,maxCombo:0,start:Date.now(),done:false,wrong:[],m0:topicMastery(g.t),seen};
  if(rounds){ G.rounds=rounds.map(r=>Object.assign({},r)); }
  else if(G.mode==='run'){ for(let i=0;i<AR_N;i++){ const r=arMake(g,(L>1&&(i===1||i===5))?L-1:L,seen); if(r) G.rounds.push(r); } }
  else if(G.mode==='rel'){ G.end=Date.now()+60000; G.score=0; G.rounds.push(arMake(g,L,seen,true)); }
  else if(G.mode==='niv'){ G.nl=3; G.max=8; G.hist=[]; G.rounds.push(arMake(g,3,seen)); }
  if(!G.rounds.length||!G.rounds[0]){ toast('Não deu para montar a partida. Tente de novo.'); return; }
  if(G.mode==='run'||G.mode==='retry'||G.mode==='ia') G.rounds[G.rounds.length-1].fin=true;
  G.rounds.forEach(r=>arPrep(G,r));
  tutor.arena={view:'run',sid:g.s,gid,G}; SND.start(); goTreino();
}
function arPrep(G,r){ if(!r||r.prep) return; r.prep=true; r.inp=r.k==='num'&&(G.mode==='run'||G.mode==='retry')&&(r.lvl>=4||(r.lvl===3&&rC(.5))); }

function arResolve(G,r,ok,frac){
  if(G.ans) return; G.ans=true; G.res={ok,frac:frac==null?(ok?1:0):frac}; G.tot++;

  if(ok){ G.ok++; G.sc+=1; G.combo++; let xp=G.mode==='rel'?5+L+Math.min(G.combo,6):6+2*L+2*Math.min(G.combo-1,5); if(r.fin) xp*=2; G.xp+=xp; gainXP(xp);

}

function arKeydown(e,k,num){
  const G=arCur(); if(!G||G.done||UI.tab!=='tutor') return false; const r=G.rounds[G.pos]; if(!r) return false;
  if(G.ans){ if(k==='enter'&&G.mode!=='rel'){ arNext(); return true; } return false; }

/* ===================== UTILIDADES ===================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function keyOf(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function today(){ return keyOf(new Date()); }
function dateOf(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,12); }
function addDays(k,n){ const d=dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function diffDays(a,b){ return Math.round((dateOf(b)-dateOf(a))/86400000); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function fmtMin(m){ m=Math.round(m); const h=Math.floor(m/60), r=m%60; return h?(h+'h'+(r?String(r).padStart(2,'0'):'')):(r+' min'); }
function fmtSec(s){ s=Math.max(0,Math.round(s||0)); const m=Math.floor(s/60), r=s%60; return m?(m+':'+String(r).padStart(2,'0')):(r+'s'); }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), r=sec%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0'); }
function pct(a,f){ return f?Math.round(100*a/f)+'%':'—'; }
function fmtDay(k){ const t=today(); if(k<=t) return 'hoje'; if(k===addDays(t,1)) return 'amanhã'; return k.split('-').reverse().slice(0,2).join('/'); }
function fmtText(t){
  return esc(t).split('\n').map(l=>{ let m;
    if((m=l.match(/^\s*#{1,4}\s+(.*)$/))) return '<strong>'+m[1]+'</strong>';
    if((m=l.match(/^\s*[-*]\s+(.*)$/))) return '• '+m[1];
    return l; }).join('<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function stripQ(t){ return String(t==null?'':t).replace(/\*\*/g,''); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const tmp=a[i]; a[i]=a[j]; a[j]=tmp; } return a; }

function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function hashStr(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36)+'.'+str.length.toString(36); }

const HALF=45;

const CEIL=[0.55,0.75,0.9,1];

function addEv(t,src,n,ok,lv){
  if(!t||!n||!topicInfo(t)) return;
  const now=dayNum(today()), T0=S.mst[t]||(S.mst[t]={}), e=T0[src]||(T0[src]={n:0,ok:0,d:now});
  const f=Math.pow(0.5,(now-e.d)/HALF), w=src==='q'?SRCW.q[clamp(lv||0,0,3)]:(src==='game'&&lv!=null?SRCW.gl[clamp(lv,0,4)]:(SRCW[src]||0.5));
  e.n=+(e.n*f+n*w).toFixed(3); e.ok=+(e.ok*f+ok*w).toFixed(3); e.d=now;
  const d=Dm(today());
  if(src==='game') d.g=(d.g||0)+n; else if(src==='card') d.c=(d.c||0)+n;
  else { const inf=topicInfo(t); d.bs=d.bs||{}; const b=d.bs[inf.s.id]||(d.bs[inf.s.id]={q:0,a:0}); b.q+=n; b.a+=ok; }
}
function topicEvidence(t){
  const T0=S.mst[t]||{}, now=dayNum(today()); let N=0,OK=0; const by={};
  for(const k in T0){ const e=T0[k], f=Math.pow(0.5,(now-e.d)/HALF); N+=e.n*f; OK+=e.ok*f; by[k]=e.n*f; }

function topicMastery(t){ const {N,OK}=topicEvidence(t); if(N<=0) return 0; const acc=(OK+1)/(N+2), conf=N/(N+12); return Math.min(acc*conf,CEIL[T(t).rung||0]); }

function subjMastery(sid){ const L=S.topicList[sid]||[]; if(!L.length) return 0; return L.reduce((a,t)=>a+topicMastery(t.id),0)/L.length; }

function score(s,t){

  if(t.base&&st.rung===0) v*=1.6;
  if(st.rung>0&&st.rung<3&&st.last&&diffDays(st.last,today())>21) v*=1.3;

}

/* ===================== SINCRONIZAÇÃO NA CONTA =====================
   Cada aparelho guarda tudo localmente. Na nuvem, o estado é dividido em seções
   (cada documento tem limite de 256 KiB) e um manifesto aponta a versão atual.
   Ninguém sobrescreve às cegas: antes de gravar, o app confere se a nuvem mudou
   e, se mudou, mescla as duas versões. Assim um aparelho novo nunca apaga o antigo. */
const SECTIONS={days:['days','visits'],erros:['erros'],cards:['flashcards','cardDel'],mst:['mst','gm'],bank:['qbank','notes']};

  const out={}, used=new Set();
  Object.keys(SECTIONS).forEach(k=>{ const o={}; SECTIONS[k].forEach(f=>{ o[f]=st[f]; used.add(f); }); out[k]=JSON.stringify(o); });
  const core={}; Object.keys(st).forEach(f=>{ if(!used.has(f)&&f!=='updatedAt') core[f]=st[f]; }); out.core=JSON.stringify(core);
  return out;
}

    }
  }
};

function mergeState(A,B,only){

        const x=a[f], y=b[f];

        else if(typeof x==='boolean'||typeof y==='boolean') o[f]=!!(x||y);

        else if(f==='bs'){ o[f]={}; new Set(Object.keys(x||{}).concat(Object.keys(y||{}))).forEach(s=>{ const u=(x||{})[s]||{}, w=(y||{})[s]||{}; o[f][s]={q:maxN(u.q,w.q),a:maxN(u.a,w.a)}; }); }
        else o[f]=x!=null?x:y;

  if(has('visits')) O.visits=Object.assign({},B.visits||{},A.visits||{});
  if(has('erros')){ const map=new Map(); const key=e=>e.q?('q:'+e.t+':'+e.q):('id:'+e.id);
    (B.erros||[]).concat(A.erros||[]).forEach(e=>{ if(!e) return; const k=key(e), p=map.get(k); if(!p){ map.set(k,e); return; }
      const score=x=>(x.last||x.criado||'')+'|'+String(x.n||1).padStart(4,'0')+'|'+String(x.etapa||0);
      map.set(k,score(e)>=score(p)?Object.assign({},e,{n:Math.max(e.n||1,p.n||1)}):Object.assign({},p,{n:Math.max(e.n||1,p.n||1)})); });
    O.erros=[...map.values()]; }
  if(has('flashcards')){ const out={}; new Set(Object.keys(A.flashcards||{}).concat(Object.keys(B.flashcards||{}))).forEach(t=>{
      const map=new Map(); (B.flashcards&&B.flashcards[t]||[]).concat(A.flashcards&&A.flashcards[t]||[]).forEach(c=>{ if(!c) return; const p=map.get(c.f); if(!p){ map.set(c.f,c); return; }
        const sc=x=>(x.lr||0)*1e3+(x.reps||0)+(x.seen?0.5:0); map.set(c.f,sc(c)>=sc(p)?c:p); });
      const del=new Set([].concat((A.cardDel||{})[t]||[],(B.cardDel||{})[t]||[]));

  if(has('cardDel')){ O.cardDel={}; new Set(Object.keys(A.cardDel||{}).concat(Object.keys(B.cardDel||{}))).forEach(t=>{ O.cardDel[t]=[...new Set([].concat((A.cardDel||{})[t]||[],(B.cardDel||{})[t]||[]))]; }); }
  if(has('mst')){ O.mst={}; new Set(Object.keys(A.mst||{}).concat(Object.keys(B.mst||{}))).forEach(t=>{ const a=(A.mst||{})[t]||{}, b=(B.mst||{})[t]||{}; O.mst[t]={};
      new Set(Object.keys(a).concat(Object.keys(b))).forEach(s=>{ const x=a[s], y=b[s]; O.mst[t][s]=!x?y:!y?x:((x.d>y.d||(x.d===y.d&&x.n>=y.n))?x:y); }); }); }
  if(has('gm')) O.gm=Object.assign({},B.gm||{},A.gm||{});
  if(has('qbank')){ O.qbank={}; new Set(Object.keys(A.qbank||{}).concat(Object.keys(B.qbank||{}))).forEach(t=>{ const seen=new Set(), arr=[]; [].concat((B.qbank||{})[t]||[],(A.qbank||{})[t]||[]).forEach(q=>{ if(q&&!seen.has(q.q)){ seen.add(q.q); arr.push(q); } }); O.qbank[t]=arr.slice(-15); }); }

  if(has('modes')){ O.modes={}; new Set(Object.keys(A.modes||{}).concat(Object.keys(B.modes||{}))).forEach(s=>{ const x=(A.modes||{})[s]||{}, y=(B.modes||{})[s]||{}; O.modes[s]={wins:maxN(x.wins,y.wins),best:maxN(x.best,y.best),rel:maxN(x.rel,y.rel)}; }); }
  if(has('arena')){ O.arena={}; new Set(Object.keys(A.arena||{}).concat(Object.keys(B.arena||{}))).forEach(g=>{ const x=(A.arena||{})[g]||{}, y=(B.arena||{})[g]||{}; O.arena[g]={lv:Math.max(x.lv||1,y.lv||1),st:[0,1,2,3,4].map(i=>Math.max((x.st||[])[i]||0,(y.st||[])[i]||0)),p:maxN(x.p,y.p),rel:maxN(x.rel,y.rel),r:[...new Set([].concat(y.r||[],x.r||[]))].slice(-40)}; }); }

}

/* ===================== SOM =====================
   Um único AudioContext, criado e aquecido no primeiro toque (latência "interactive"),
   com volume mestre, compressor e uma sala curta que dá brilho aos sinos.
   Tudo é agendado no relógio do áudio no instante da ação, antes de redesenhar a tela.
   Acerto soa brilhante (duas notas de vidro + brilho); erro é um "tum" grave e suave (erro não é castigo).
   Sequências de acerto sobem uma escala pentatônica: cada combo soa mais alto que o anterior. */
const SND=(function(){

    nbuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

  }
  function ac(){
    if(!ctx){ try{ build(); }catch(e){ ctx=null; return null; } }
    if(ctx.state!=='running') try{ ctx.resume(); }catch(e){}
    return ctx;
  }
  function on(){ return SET.vol>0; }
  function tone(f,t0,dur,o){ o=o||{}; const c=ac(); if(!c) return; try{
    const t=c.currentTime+t0, osc=c.createOscillator(), g=c.createGain();

    osc.connect(g); g.connect(master); if(o.wet) { const s=c.createGain(); s.gain.value=o.wet; g.connect(s); s.connect(wet); }
    osc.start(t); osc.stop(t+dur+0.05); }catch(e){} }
  function noise(t0,dur,o){ o=o||{}; const c=ac(); if(!c) return; try{
    const t=c.currentTime+t0, n=c.createBufferSource(); n.buffer=nbuf;
    const f=c.createBiquadFilter(); f.type=o.ftype||'lowpass'; f.frequency.setValueAtTime(o.f||1000,t); if(o.fto) f.frequency.exponentialRampToValueAtTime(o.fto,t+dur); f.Q.value=o.q||0.7;

    n.connect(f); f.connect(g); g.connect(master); n.start(t,Math.random()*Math.max(0,0.95-dur)); n.stop(t+dur+0.02); }catch(e){} }
  /* timbres: vidro (acertos), sino (conquistas), brilho (purpurina aguda) */
  function glass(f,t0,g,dur){ g=g||0.06; dur=dur||0.32; tone(f,t0,dur,{gain:g,wet:0.5}); tone(f*2,t0,dur*0.45,{type:'triangle',gain:g*0.22}); tone(f*3.01,t0,dur*0.2,{gain:g*0.1}); }

  function sparkle(t0,g,n){ const F=[2637,3136,3520,4186,4699]; for(let i=0;i<(n||3);i++) tone(F[(Math.random()*F.length)|0],t0+i*0.028,0.09,{gain:g||0.012,wet:0.9}); }
  function whoosh(t0,dur,g,f1,f2){ noise(t0,dur,{ftype:'bandpass',f:f1||500,fto:f2||2600,q:1.1,gain:g||0.03,attack:dur*0.35}); }
  const PENTA=[523,587,659,784,880,1047,1175,1319,1568,1760,2093];
  return {

      else if(kind==='opt'){ noise(0,0.016,{ftype:'highpass',f:4200,gain:0.03}); tone(1900,0,0.025,{gain:0.01}); }
      else noise(0,0.014,{ftype:'highpass',f:3800,gain:0.022}); },
    tap(){ if(!on()||performance.now()-lastPress<320) return; noise(0,0.016,{ftype:'highpass',f:4200,gain:0.028}); tone(1900,0,0.025,{gain:0.009}); },
    ok(){ if(!on()) return; glass(1047,0,0.07); glass(1568,0.065,0.06); sparkle(0.11,0.011,3); },

    flip(){ if(on()) whoosh(0,0.16,0.03,700,2800); },

/* ===================== TOQUE: SOM E ONDULAÇÃO =====================
   Mouse e caneta respondem no pointerdown. No toque, a resposta sai no pointerup (se o dedo não
   arrastou), para rolar a tela não fazer barulho. A ondulação fica numa camada fixa por cima do botão:
   sobrevive ao redesenho da tela que o próprio toque dispara. */
let lastPt=null, pdn=null;
function pressTarget(el){ const b=el&&el.closest?el.closest('button,[data-a],summary,label.filebtn'):null; return !b||b.disabled||b.getAttribute('aria-disabled')==='true'?null:b; }
function pressKind(b){ if(b.closest('#tabs')) return 'nav'; if(b.matches('.btn.primary,.btn.go,.nextstep,.errcta,.arrec,#fab,.kp-ok')) return 'pri'; if(b.matches('.alt,.mtile,.sitem,.spotw,.kp,.cgap,.ptcell,.bin,.bstep button,.zone,.simchip,.chip,.seg button,.grade,.lvpath button')) return 'opt'; return ''; }
function ripple(b,x,y){
  if(REDUCED||!(b instanceof HTMLElement)||b.closest('#tabs')||b.matches('.linkbtn,summary')) return;
  const r=b.getBoundingClientRect(); if(!r.width||r.width>760||r.height>420) return;
  const cs=getComputedStyle(b), w=document.createElement('span'), c=document.createElement('i'), d=2*Math.hypot(Math.max(x-r.left,r.right-x),Math.max(y-r.top,r.bottom-y));
  w.className='rip-w'; w.style.cssText='left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;border-radius:'+cs.borderRadius+';color:'+cs.color;
  c.style.cssText='left:'+(x-r.left-d/2)+'px;top:'+(y-r.top-d/2)+'px;width:'+d+'px;height:'+d+'px';
  w.appendChild(c); document.body.appendChild(w); setTimeout(()=>w.remove(),650);
}
function pressFx(b,x,y){ SND.press(pressKind(b)); ripple(b,x,y); }
document.addEventListener('pointerdown',e=>{ lastPt={x:e.clientX,y:e.clientY}; if(e.pointerType!=='touch') SND.warm(); if(e.button>0) return;
  const b=pressTarget(e.target); if(!b) return;
  if(e.pointerType==='touch'){ pdn={id:e.pointerId,b,x:e.clientX,y:e.clientY,t:performance.now()}; return; }
  pressFx(b,e.clientX,e.clientY); },{capture:true,passive:true});
document.addEventListener('pointerup',e=>{ SND.warm(); const p=pdn; pdn=null; if(!p||p.id!==e.pointerId) return;
  if(Math.hypot(e.clientX-p.x,e.clientY-p.y)>12||performance.now()-p.t>700||!document.contains(p.b)) return;
  lastPt={x:e.clientX,y:e.clientY}; pressFx(p.b,e.clientX,e.clientY); },{capture:true,passive:true});
document.addEventListener('pointercancel',()=>{ pdn=null; },{capture:true,passive:true});
document.addEventListener('keydown',()=>SND.warm(),{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) SND.resume(); });

/* ===================== EFEITOS VISUAIS E CELEBRAÇÕES ===================== */
const FX=(function(){
  const queue=[]; let showing=false, holdUntil=0;
  function confetti(power){
    if(REDUCED) return;
    let cv=$('#fxcanvas'); if(!cv) return;
    const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio; const g=cv.getContext('2d');
    const cols=['#7C3AED','#A78BFA','#F0612A','#FBBF24','#10B981','#EBE8D8','#ffffff'], P=[], n=Math.round(90*(power||1));
    for(let i=0;i<n;i++) P.push({x:W*(0.2+Math.random()*0.6),y:H*0.35,vx:(Math.random()-0.5)*16*devicePixelRatio,vy:(-8-Math.random()*12)*devicePixelRatio,s:(5+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-0.5)*0.3,c:cols[i%cols.length],sh:Math.random()<0.5});
    const t0=performance.now(); cv.hidden=false;
    (function step(t){ const el=t-t0; g.clearRect(0,0,W,H);
      P.forEach(p=>{ p.vy+=0.45*devicePixelRatio; p.vx*=0.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.globalAlpha=Math.max(0,1-el/2200); g.fillStyle=p.c; if(p.sh) g.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else { g.beginPath(); g.arc(0,0,p.s/3,0,7); g.fill(); } g.restore(); });
      if(el<2200) requestAnimationFrame(step); else { g.clearRect(0,0,W,H); cv.hidden=true; } })(t0);
  }
  function xp(n,at){
    const p=at||lastPt; if(!p) return;
    const el=document.createElement('div'); el.className='xpfloat'+(n>=40?' big':''); el.textContent='+'+n+' XP';
    el.style.left=clamp(p.x,40,innerWidth-40)+'px'; el.style.top=clamp(p.y-18,60,innerHeight-80)+'px';
    document.body.appendChild(el); setTimeout(()=>el.remove(),1100);
    const g=$('#goalRing'); if(g) paintGoal();
  }
  function banner(icon,title,sub,cls){
    const b=document.createElement('div'); b.className='banner '+(cls||''); b.setAttribute('role','status');
    b.innerHTML='<span class="bn-ic">'+icon+'</span><span class="bn-t"><b>'+esc(title)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</span>';
    $('#banners').appendChild(b); requestAnimationFrame(()=>b.classList.add('in'));
    setTimeout(()=>{ b.classList.remove('in'); setTimeout(()=>b.remove(),400); },3200);
  }
  function modal(html,after){
    const m=$('#celebrate'); m.innerHTML='<div class="cel-card" role="dialog" aria-modal="true" aria-labelledby="celTitle">'+html+'<button class="btn primary block" data-a="celClose" id="celOk">Continuar</button></div>';
    m.hidden=false; showing=true; setTimeout(()=>{ try{ $('#celOk').focus(); }catch(e){} },60);
    FX._after=after;
  }
  function close(){ const m=$('#celebrate'); m.hidden=true; m.innerHTML=''; showing=false; if(FX._after){ const f=FX._after; FX._after=null; f(); } next(); }
  const MODAL=['level','patente','allMissions','bossWin'];
  function next(){
    if(showing||!queue.length) return;
    const w=holdUntil-Date.now(); if(w>0){ clearTimeout(FX._w); FX._w=setTimeout(next,w); return; }
    const i=queue.findIndex(([t])=>!(MODAL.includes(t)&&inRun()&&t!=='level'));
    if(i<0){ clearTimeout(FX._w); FX._w=setTimeout(next,1500); return; }
    const [type,o]=queue.splice(i,1)[0];
    if(type==='level'&&inRun()){ SND.level(); buzz([30,40,60]); confetti(0.5); banner(ICO.up,'Nível '+o.L+'!','Seu esforço virou nível. Continue.','gold'); setTimeout(next,700); return; }
    show(type,o);
  }
  function show(type,o){
    switch(type){
      case 'level': SND.level(); buzz([30,40,60]); confetti(1.2);
        modal('<div class="cel-kicker">Subiu de nível</div><div class="cel-big" id="celTitle">'+o.L+'</div><p class="cel-sub">Cada questão, cartão e erro refeito virou XP. Continue no ritmo.</p>'); return;
      case 'patente': SND.boss(); buzz([40,60,80]); confetti(1.6);
        modal('<div class="cel-kicker">Promoção</div><div class="insig big">'+insigniaSVG(o.idx)+'</div><div class="cel-name" id="celTitle">'+esc(PATENTES[o.idx])+'</div><p class="cel-sub">Seu domínio geral chegou a '+Math.round(o.m*100)+'%. A patente acompanha o que você realmente sabe.</p>'); return;
      case 'allMissions': SND.goal(); buzz([30,50,30]); confetti(1);
        modal('<div class="cel-kicker">Missões do dia</div><div class="cel-name" id="celTitle">Todas cumpridas</div><p class="cel-sub">+'+MIS_BONUS+' XP de bônus. Amanhã tem missão nova.</p>'); return;
      case 'bossWin': SND.boss(); buzz([40,60,80]); confetti(1.5);
        modal('<div class="cel-kicker">Chefão derrotado</div><div class="cel-name" id="celTitle">'+esc(o.nome)+'</div><p class="cel-sub">'+o.hits+' acertos, '+o.lives+' vida(s) sobrando. +'+o.xp+' XP.</p>'); return;
      case 'goal': SND.goal(); buzz([20,40,20]); confetti(0.6); banner(ICO.target,'Meta do dia batida','Descansar agora também conta. A sequência está garantida.','gold'); break;
      case 'mission': SND.mission(); buzz(25); banner(ICO.check,'Missão cumprida','+'+MIS_XP+' XP · '+o.label,'green'); break;
      case 'ach': SND.ach(); buzz([20,30]); banner(ICO.medal,o.names.length>1?'Novas conquistas':'Nova conquista',o.names.join(', '),'gold'); break;
      case 'rung': SND.rung(); { const i=topicInfo(o.t); banner(ICO.up,o.r>=3?'Tópico dominado':'Subiu para o degrau '+RUNGS[o.r],i?i.t.nome:'','green'); } break;
      case 'streak': SND.fire(); banner(flameMini(),o.n+' dias de sequência','Constância é o que aprova.','fire'); break;
    }
    setTimeout(next,700);
  }
  return {
    confetti, xp, banner, close,
    celebrate(type,o){ queue.push([type,o||{}]); if(!showing) setTimeout(next,type==='goal'||type==='mission'||type==='ach'?250:500); },
    busy(){ return showing; },
    /* segura modais e faixas por um instante (ex.: enquanto as estrelas do fim de partida entram) */
    hold(ms){ holdUntil=Math.max(holdUntil,Date.now()+ms); },
    kick(){ next(); }
  };
})();

/* ===================== CLAUDE DENTRO DO APP =====================
   Tudo que usa IA passa por aqui. Quando o Claude não está disponível na página,

let sampleFn=null, sampleOff=false, samplePromise=null, sampleImages=false;
function getSample(){
  if(sampleOff) return Promise.resolve(null);
  if(!samplePromise){
    const c=window.claude;
    samplePromise=(c&&typeof c.use==='function')?Promise.resolve().then(()=>c.use('sample')).catch(()=>null):Promise.resolve(null);
    samplePromise.then(s=>{ if(!s){ sampleOff=true; return; } sampleFn=s; try{ Promise.resolve(s.limits()).then(l=>{ sampleImages=!!(l&&l.images); }).catch(()=>{}); }catch(e){} });
  }
  return samplePromise;
}
const AI_OFF_CODES=['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'];
function sampleMsg(e){
  const c=e&&e.code;
  if(AI_OFF_CODES.includes(c)){ sampleOff=true; return 'O Claude não está liberado nesta página. Use "Copiar pedido" e cole no chat do Claude.'; }
  if(c==='cancelled') return '';
  if(c==='rate_limited') return 'Muitos pedidos agora. Espere alguns minutos e tente de novo.';
  if(c==='session_expired') return 'Sua sessão expirou. Entre de novo no Claude e recarregue a página.';
  if(c==='refused') return 'O Claude não respondeu esse pedido. Reformule e tente de novo.';
  if(c==='invalid_json') return 'A resposta veio fora do formato. Toque em "Tentar de novo".';
  if(c==='prompt_too_large') return 'Texto grande demais. Envie um trecho menor.';
  if(c==='empty_completion') return 'A resposta veio vazia. Tente pedir de outro jeito.';
  if(c==='image_rejected') return 'Não consegui ler essa imagem. Tente outra foto (JPG ou PNG).';
  return 'A conexão com o Claude falhou. Tente de novo.';
}

function promptRedacao(tema,texto){
  return ['Você corrige redações de concurso com o rigor da banca Instituto AOCP. Corrija a redação abaixo pelos 4 critérios do edital de Cadete do CBMPR, cada um valendo de 0 a 5 (use meio ponto se precisar):',

async function gerarQuiz(tid,nivel,opts){
  const info=topicInfo(tid); if(!info) return;
  if(tutor.quizGen&&tutor.quizGen.busy) return;
  opts=opts||{};
  const prompt=promptGerar(info.s,info.t,nivel,opts);
  clearModes(); UI.tab='tutor'; saveUI(); closeSheetSilently();
  const G={tid,n:nivel,busy:true,got:0,err:'',ctl:new AbortController(),opts};
  tutor.quizGen=G; render(); window.scrollTo(0,0);
  const s=await getSample();
  if(tutor.quizGen!==G) return;
  if(!s){ tutor.quizGen=null; const local=localQuiz(tid,nivel); if(local){ startQuiz(tid,nivel,local,'banco'); toast('Claude indisponível: montei o treino com o banco do app.'); } else { render(); sheetCopy('Copiar pedido de questões',prompt.replace('Responda somente com JSON neste formato:','Mostre as questões numeradas e deixe o gabarito comentado no final. Formato de referência:')); } return; }
  try{
    const data=await s.json(prompt,{cache:false,signal:G.ctl.signal,onText:({text})=>{ const n=(text.match(/"enunciado"/g)||[]).length; if(n!==G.got&&tutor.quizGen===G){ G.got=n; const el=$('#genProg'); if(el){ el.style.width=Math.min(100,n*20)+'%'; } const lb=$('#genLbl'); if(lb) lb.textContent=Math.min(n,5)+' de 5 questões escritas'; } }});
    const qs=(data&&Array.isArray(data.questoes)?data.questoes:[]).filter(validQ).slice(0,5);
    if(!qs.length) throw {code:'invalid_json'};
    if(tutor.quizGen!==G) return;
    tutor.quizGen=null;
    const clean=qs.map(q=>({enunciado:String(q.enunciado),alternativas:q.alternativas.map(String),correta:q.correta,explicacao:String(q.explicacao||'')}));
    const bank=S.qbank[tid]||(S.qbank[tid]=[]); clean.forEach(q=>bank.push({q:q.enunciado,o:q.alternativas,r:q.correta,x:q.explicacao,lv:nivel,at:Date.now()})); if(bank.length>15) S.qbank[tid]=bank.slice(-15);
    commit(); SND.start();
    startQuiz(tid,nivel,clean,'ia');
  }catch(e){
    if(tutor.quizGen!==G) return;
    G.busy=false; G.err=sampleMsg(e); if(!G.err){ tutor.quizGen=null; }
    render();
  }
}
function validQ(q){ return q&&typeof q.enunciado==='string'&&q.enunciado.trim()&&Array.isArray(q.alternativas)&&q.alternativas.length===5&&q.alternativas.every(a=>String(a).trim())&&Number.isInteger(q.correta)&&q.correta>=0&&q.correta<5; }
function localQuiz(tid,nivel){
  const out=[], seen=new Set(), add=q=>{ if(out.length<5&&q&&!seen.has(q.enunciado)){ seen.add(q.enunciado); out.push(q); } };
  (S.qbank[tid]||[]).slice().reverse().forEach(q=>add({enunciado:q.q,alternativas:q.o,correta:q.r,explicacao:q.x||''}));
  if(TESTE80[tid]) shuffle(TESTE80[tid].qs).forEach(q=>add({enunciado:q.q,alternativas:q.o,correta:q.r,explicacao:q.x||''}));
  ARENA.filter(g=>g.t===tid).forEach(g=>{ const seen2=new Set(); for(let i=0;i<12&&out.length<5;i++){ const r=arMake(g,clamp((nivel||0)+2+rI(0,1),1,5),seen2,true); if(r&&!r.fig&&r.opts.length>=4) add({enunciado:stripQ(r.q),alternativas:r.opts.slice(0,5),correta:r.right,explicacao:r.x||(r.steps?r.steps.join(' '):'')}); } });
  const defs=GAMES.filter(g=>g.t===tid&&['classify','choice','pick','tf','calc'].includes(g.type));
  let guard=0; while(out.length<5&&defs.length&&guard<40){ guard++; const def=one(defs); const r=def.type==='calc'?calcRound(def):buildRound(def,one(def.items.map((_,i)=>i))); if(r&&r.opts&&r.opts.length<=5) add({enunciado:(def.type==='calc'?'':def.title+': ')+stripQ(r.q),alternativas:r.opts,correta:r.right,explicacao:r.x||(r.steps?r.steps.join(' '):'')}); }
  return out.length>=3?out:null;
}
function startQuiz(tid,nivel,qs,src){
  clearModes();
  tutor.quiz={t:tid,n:nivel,src,qs,ans:qs.map(()=>null),time:qs.map(()=>0),running:null,logged:false,start:Date.now()};

async function runAISim(mode,sid,n){
  const list=simTopics(mode,sid,n); const s=await getSample();
  if(!s){ sheetCopy('Copiar pedido de simulado',promptSim(list)); return; }
  closeSheetSilently(); clearModes(); const G={done:0,total:n,err:'',ctl:new AbortController()}; tutor.simGen=G; UI.tab='tutor'; saveUI(); render();
  const qs=[];
  for(let i=0;i<list.length;i+=5){
    const part=list.slice(i,i+5);
    try{ const d=await s.json(promptSim(part),{cache:false,signal:G.ctl.signal});
      (d&&Array.isArray(d.questoes)?d.questoes:[]).forEach((q,k)=>{ if(!validQ(q)) return; const p=part.find(x=>x.t===q.topico)||part[k]||part[0]; qs.push({q:String(q.enunciado),opts:q.alternativas.map(String),right:q.correta,x:String(q.explicacao||''),t:p.t,s:p.s}); }); }
    catch(e){ if(e&&e.code==='cancelled') return; G.err=sampleMsg(e); if(e&&AI_OFF_CODES.concat(['session_expired','rate_limited']).includes(e.code)) break; }
    if(tutor.simGen!==G) return;
    G.done=Math.min(n,qs.length); if(UI.tab==='tutor'&&$('#sheet').hidden) render();
  }
  if(tutor.simGen!==G) return;
  if(qs.length<3){ G.fail=true; G.err=G.err||'Não deu para gerar o simulado agora.'; render(); return; }
  startSim(qs,'Simulado inédito','ia');
}

/* Insígnias das patentes: divisas para cadetes, estrelas para oficiais (esquemático) */
function insigniaSVG(idx){
  const star=(cx,cy,r)=>{ let p=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.45:r; p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1); } return '<path d="'+p+'Z" class="ins-g"/>'; };
  const chev=y=>'<path d="M17 '+y+'l11 7 11-7" class="ins-l"/>';
  let inner='';
  if(idx===0) inner=chev(24);
  else if(idx===1) inner=chev(20)+'<path d="M18 33h20" class="ins-l"/>';
  else if(idx===2) inner=chev(17)+chev(25);
  else if(idx===3) inner=star(28,28,8);
  else if(idx===4) inner=star(28,28,9);
  else if(idx===5) inner=star(20,28,7)+star(36,28,7);
  else inner=star(16,30,6)+star(28,22,6)+star(40,30,6);
  return '<svg viewBox="0 0 56 56" class="insig-svg" aria-hidden="true"><path d="M28 3l21 9v14c0 13-9 22-21 27C16 48 7 39 7 26V12z" class="ins-bg"/>'+inner+'</svg>';
}
function ringSVG(p,cls){ const r=26, C=2*Math.PI*r, off=C*(1-clamp(p,0,1)); return '<svg viewBox="0 0 64 64" class="ring-svg '+(cls||'')+'" aria-hidden="true"><circle cx="32" cy="32" r="'+r+'" class="rg-bg"/><circle cx="32" cy="32" r="'+r+'" class="rg-fg" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'; }

function cuN(n,suf){ return '<span class="cu" data-n="'+n+'"'+(suf?' data-suf="'+suf+'"':'')+'>'+(REDUCED?n+(suf||''):'0')+'</span>'; }
function mountCountUps(root){
  (root||document).querySelectorAll('.cu[data-n]').forEach(el=>{
    if(el.dataset.done) return; el.dataset.done='1';
    const target=parseFloat(el.dataset.n), suf=el.dataset.suf||'', dur=450;
    if(REDUCED||!target){ el.textContent=target+suf; return; }
    const t0=performance.now();
    (function step(t){ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=Math.round(target*e)+suf; if(p<1) requestAnimationFrame(step); })(t0);
  });
}

/* ===================== CRONÔMETRO DE FOCO =====================
   Livre (conta para cima), Pomodoro 25/5 e Foco 50/10. Os blocos de foco
   entram sozinhos no dia quando terminam: ninguém esquece de registrar. */
const GTM={livre:{nome:'Livre'},pomo:{nome:'Pomodoro 25/5',f:25,b:5},foco:{nome:'Foco 50/10',f:50,b:10}};
let GT=Object.assign({mode:'livre',start:null,acc:0,phase:'focus',cycles:0},lsGet(LS+'-gt2',{}));
function gtSave(){ lsSet(LS+'-gt2',GT); }
function gtElapsed(){ return GT.acc+(GT.start!=null?(Date.now()-GT.start)/1000:0); }
function gtState(){ return GT.start!=null?'running':(GT.acc>0?'paused':'idle'); }
function gtRemaining(){ const m=GTM[GT.mode]; if(!m.f) return null; const tot=(GT.phase==='focus'?m.f:m.b)*60; return tot-gtElapsed(); }
function gtRegister(mins){ if(mins<1) return 0; mins=Math.round(mins); Dm(today()).min+=mins; gainXP(mins); commit(); return mins; }
function gtTick(){
  if(GT.start==null) return;
  const rem=gtRemaining();
  if(rem!=null&&rem<=0){
    const m=GTM[GT.mode];
    if(GT.phase==='focus'){ const got=gtRegister(m.f); GT.cycles++; GT.phase='break'; GT.acc=0; GT.start=Date.now(); gtSave(); SND.timerEnd(); buzz([200,100,200]);
      FX.banner(ICO.clock,'Bloco de foco concluído: +'+got+' min','Pausa de '+m.b+' min: levante, beba água, olhe para longe.','green'); afterAction(); }
    else { GT.phase='focus'; GT.acc=0; GT.start=null; gtSave(); SND.timerEnd(); buzz([100,60,100]); FX.banner(ICO.play,'Pausa encerrada','Toque em Iniciar para o próximo bloco.',''); }
    drawGTBar(); if(UI.tab==='hoje'&&$('#sheet').hidden) render();
    return;
  }
  const disp=gtDisplay(); $$('.gtclock').forEach(el=>{ el.textContent=disp; });
}
function gtDisplay(){ const rem=gtRemaining(); return fmtClock(rem!=null?Math.max(0,rem):gtElapsed()); }
function stopwatchHTML(){
  const st=gtState(), m=GTM[GT.mode], brk=GT.phase==='break';
  let h='<section class="stopwatch '+st+(brk?' brk':'')+'" aria-label="Cronômetro de estudo"><div class="sw-top"><span class="sw-lbl">'+(brk?'Pausa':(st==='running'?'Estudando':'Cronômetro'))+'</span><div class="seg" role="group" aria-label="Modo do cronômetro">'+Object.keys(GTM).map(k=>'<button class="'+(GT.mode===k?'on':'')+'" data-a="gtMode" data-v="'+k+'"'+(st!=='idle'?' disabled':'')+'>'+(k==='livre'?'Livre':(k==='pomo'?'25/5':'50/10'))+'</button>').join('')+'</div></div>';
  h+='<div class="sw-clock gtclock">'+gtDisplay()+'</div>';
  if(m.f) h+='<p class="small muted sw-sub">'+(brk?'Descanso não conta tempo. ':'Bloco de '+m.f+' min entra sozinho no seu dia. ')+(GT.cycles?GT.cycles+(GT.cycles===1?' bloco feito hoje.':' blocos feitos hoje.'):'')+'</p>';
  if(st==='idle') h+='<button class="btn primary block" data-a="gtToggle">'+ICO.play+' '+(brk?'Iniciar pausa':'Iniciar')+'</button>';
  else h+='<div class="grid2"><button class="btn '+(st==='running'?'':'go')+'" data-a="gtToggle">'+(st==='running'?ICO.pause+' Pausar':ICO.play+' Retomar')+'</button><button class="btn" data-a="gtStop">'+ICO.stop+' Parar</button></div>';
  return h+'</section>';
}
function drawGTBar(){
  const el=$('#timerbar'); if(!el) return;
  const st=gtState();
  if(st==='idle'||UI.tab==='hoje'){ el.hidden=true; el.innerHTML=''; return; }
  el.hidden=false; el.className=st;
  el.innerHTML='<button class="tb-in" data-a="tab" data-v="hoje" aria-label="Abrir cronômetro"><span class="dot"></span><span class="gtclock">'+gtDisplay()+'</span><span class="tb-l">'+(GT.phase==='break'?'pausa':(st==='running'?'estudando':'pausado'))+'</span></button>';
}

function nextStep(){
  const ed=rfDue().length, fd=totalFlashDue(), M=missions();
  if(ed) return {a:'rfStart',t:'Refazer '+ed+(ed===1?' erro':' erros')+' do caderno',s:'É nos erros que a nota sobe mais rápido.',ic:ICO.redo};
  if(fd) return {a:'smartOpen',t:'Revisar '+Math.min(fd,30)+' flashcards',s:'Revisar no dia certo é o que fixa na memória de longo prazo.',ic:ICO.cards};
  const pend=M.list.find(m=>!m.done&&m.type!=='focus');
  if(pend) return misAction(pend);
  const tid=pick(); if(tid){ const i=topicInfo(tid); return {a:'topic',d:{t:tid},t:'Avançar em '+i.t.nome,s:'É o tópico que mais vale a pena agora: '+reason(i.s,i.t)+'.',ic:ICO.target}; }
  return {a:'hubGames',t:'Treino livre',s:'Escolha um jogo por matéria.',ic:ICO.game};
}
function misAction(m){
  switch(m.type){
    case 'cards': return {a:'smartOpen',t:m.label,s:'Revisão inteligente, das matérias mais fracas primeiro.',ic:ICO.cards};
    case 'erros': return {a:'rfStart',t:m.label,s:'Cada erro volta como questão até virar acerto fácil.',ic:ICO.redo};
    case 'quiz': return {a:'misQuiz',t:m.label,s:'Treino rápido no tópico que mais vale agora.',ic:ICO.target};
    case 'game': return {a:'gOpen',d:{id:m.gid},t:m.label,s:(SUBJ[m.sid]||{}).nome?SUBJ[m.sid].nome+': a matéria com mais peso e menos domínio.':'',ic:ICO.game};
    case 'focus': return {a:'gtStartFocus',t:m.label,s:'Um bloco de 25 minutos sem distração.',ic:ICO.clock};
    case 'redacao': return {a:'tab',d:{v:'redacao'},t:m.label,s:'Sábado é dia de redação.',ic:ICO.pen};
    case 'sim': return {a:'simOpen',t:m.label,s:'Domingo é dia de medir o progresso.',ic:ICO.flag};

function offlineQuestion(s){
  if(AR_SUBJ.indexOf(s.id)>=0) return arOffline(s.id);
  const gs=GAMES.filter(g=>g.s===s.id&&PLAYABLE(g)); if(!gs.length) return null;
  const def=one2(gs); const r=def.type==='calc'?calcRound(def):buildRound(def,one2(gItemsIdx(def,5)));
  let opts=r.opts, right=r.right;
  if(opts.length>5){ const sel=shuffle([right].concat(shuffle(opts.map((_,k)=>k).filter(k=>k!==right)).slice(0,3))); opts=sel.map(k=>r.opts[k]); right=sel.indexOf(r.right); }
  const q=def.type==='calc'?r.q:(def.type==='tf'?'**Verdadeiro ou falso?**\n'+r.q:'**'+def.title+'**\n'+r.q);

}
function recGame(){
  const ar=arRecommend(null), rs=ar?SUBJ[ar.s]:null;
  let best=null,bv=-1;
  SUBJECTS.forEach(s=>{ if(!GAMES.some(g=>g.s===s.id&&PLAYABLE(g))) return; const v=s.q*(1.05-subjMastery(s.id)); if(v>bv){ bv=v; best=s; } });
  const va=ar?rs.q*(1.05-subjMastery(rs.id)):-1;
  if(ar&&va>=bv) return {id:ar.id,title:ar.nome,s:ar.s,arena:true};
  if(!best) return null;
  const gs=GAMES.filter(g=>g.s===best.id&&PLAYABLE(g));
  gs.sort((a,b)=>(topicMastery(a.t)-topicMastery(b.t))||(((S.gb[a.id]||{}).plays||0)-((S.gb[b.id]||{}).plays||0)));
  return gs[0];
}

function gAnswer(j){

  } else {

    const def=GAME_BY_ID[G.defId]||GAME_BY_ID[r.gid];

  }
  G.maxCombo=Math.max(G.maxCombo,G.combo);
  addEv(r.t,'game',1,ok?1:0);
  const gid=G.defId||r.gid; if(r.i!=null&&gid&&GAME_BY_ID[gid]&&GAME_BY_ID[gid].items) gmScore(gid,r.i,ok);

/* ===================== FLASHCARDS ===================== */
function cardById(t,id){ return (S.flashcards[t]||[]).find(c=>c.id===id)||null; }
function deckOrder(){ const out=[]; allTopics().forEach(({t})=>{ if((S.flashcards[t.id]||[]).length) out.push(t.id); }); return out; }
function flashQueueDeck(tid){
  const cards=S.flashcards[tid]||[], k=today();
  let q=cards.filter(c=>c.seen&&c.due<=k), mode='due';
  if(!q.length){ q=cards.filter(c=>!c.seen).slice(0,10); mode='new'; }
  if(!q.length){ q=cards.slice(); mode='free'; }
  return {q:shuffle(q).map(c=>({t:tid,id:c.id})),mode};
}
function openFlash(tid){ const Q=flashQueueDeck(tid); if(!Q.q.length){ toast('Baralho vazio. Crie cartões para ele.'); return; } const info=topicInfo(tid); clearModes(); tutor.flash={t:tid,q:Q.q,mode:Q.mode,pos:0,revealed:false,ok:0,title:info?info.t.nome:''}; goTreino(); }
function smartQueue(){
  const k=today(), due=[], fresh=[];
  Object.keys(S.flashcards).forEach(t=>{ if(!topicInfo(t)) return; const m=topicMastery(t);
    S.flashcards[t].forEach(c=>{ if(c.seen&&c.due<=k) due.push({t,id:c.id,m,od:diffDays(c.due,k)}); else if(!c.seen) fresh.push({t,id:c.id,m}); }); });
  due.sort((a,b)=>a.m-b.m||b.od-a.od);
  const room=Math.max(0,Math.min(10,NEW_PER_DAY-newToday())), byT={}, fr=[];
  shuffle(fresh).sort((a,b)=>a.m-b.m).forEach(x=>{ byT[x.t]=(byT[x.t]||0)+1; if(byT[x.t]<=3) fr.push(x); });
  const d=due.slice(0,30); return d.concat(fr.slice(0,Math.max(0,Math.min(room,35-d.length))));
}
function openSmart(){ const q=smartQueue(); if(!q.length){ toast('Nada para revisar agora. Jogue um minigame ou volte amanhã.'); return; } clearModes(); tutor.flash={smart:true,q:shuffle(q.slice(0,Math.min(q.length,40))),mode:'smart',pos:0,revealed:false,ok:0,title:'Revisão inteligente'}; goTreino(); }

  const it=F.q[F.pos], c=cardById(it.t,it.id);

  const info=topicInfo(it.t);

function wpick(pool){ const tot=pool.reduce((a,p)=>a+p.w,0); let r=Math.random()*tot; for(const p of pool){ r-=p.w; if(r<=0) return p; } return pool[pool.length-1]; }
function buildOffline(mode,sid,n){
  const subs=SUBJECTS.filter(s=>(!sid||s.id===sid)&&(AR_SUBJ.indexOf(s.id)>=0||GAMES.some(g=>g.s===s.id&&PLAYABLE(g))));
  if(!subs.length) return [];
  const studied=t=>topicEvidence(t).N>=1;
  const pool=subs.map(s=>({s,w:s.q*(mode==='fraq'?Math.pow(1.1-subjMastery(s.id),2):1)}));
  const qs=[]; let g=0;
  while(qs.length<n&&g<n*14){ g++; const q=offlineQuestion(wpick(pool).s); if(!q||qs.some(x=>x.q===q.q)) continue; if(mode==='estudados'&&!studied(q.t)&&g<n*10) continue; qs.push(q); }
  return qs;
}
function simTopicPool(mode,sid){
  const pool=[];
  SUBJECTS.forEach(s=>{ if(sid&&s.id!==sid) return; const L=S.topicList[s.id]||[];
    L.forEach(t=>{ const m=topicMastery(t.id), ev=topicEvidence(t.id).N; let w=s.q/L.length; if(mode==='fraq') w*=Math.pow(1.1-m,2); if(mode==='estudados'&&ev<1) return; pool.push({t:t.id,s:s.id,w}); }); });
  return pool;
}
function simTopics(mode,sid,n){ let pool=simTopicPool(mode,sid); if(!pool.length) pool=simTopicPool('geral',sid); const out=[], used=new Set();
  for(let i=0;i<n;i++){ let p,g=0; do{ p=wpick(pool); g++; }while(used.has(p.t)&&g<8); used.add(p.t); out.push(p); } return out; }

function simFinish(){
  const M=tutor.sim; simLeave(); M.done=true; M.secs=Math.round((Date.now()-M.start)/1000);
  let ok=0; const bys={}; M.luck=0; M.sure=0;
  M.qs.forEach((r,i)=>{ const hit=M.ans[i]===r.right; if(hit) ok++; const b=bys[r.s]||(bys[r.s]={ok:0,n:0}); b.n++; if(hit) b.ok++;
    if(M.ans[i]!=null) addEv(r.t,'sim',1,hit&&!M.guess[i]?1:0);
    if(hit&&M.guess[i]) M.luck++; if(!hit&&M.ans[i]!=null&&!M.guess[i]) M.sure++;
    if(!hit||M.guess[i]) errFromQ({t:r.t,q:r.q,opts:r.opts,right:r.right,x:r.x,steps:r.steps,src:'sim',tempo:Math.round(M.time[i])||null,chute:M.guess[i]}); });
  M.ok=ok; M.bys=bys;
  const d=Dm(today()), answered=M.ans.filter(x=>x!=null).length; d.q+=answered; d.a+=ok; d.sims=(d.sims||0)+1;
  if(gtState()==='idle') d.min+=Math.round(M.secs/60);
  S.sims.push({d:today(),n:M.qs.length,ok,secs:M.secs,mode:M.mode});
  gainXP(ok*8+(answered-ok)*2+20);
  snapWeek(); commit(); afterAction();
  (ok/M.qs.length>=0.5?SND.level:SND.bad)();
}
function viewSimResult(M){
  const p=Math.round(100*M.ok/M.qs.length), proj=Math.round(70*M.ok/M.qs.length);
  let h='<div class="ghead"><div><span class="small muted">Simulado</span><h2>Resultado</h2></div></div><div class="gend"><div class="gscore pop '+accCls(M.ok/M.qs.length)+'">'+p+'%</div><p>'+M.ok+' de '+M.qs.length+' certas em '+fmtSec(M.secs)+' ('+fmtSec(M.secs/M.qs.length)+' por questão).</p><p class="small muted">Nesse aproveitamento, a prova daria cerca de '+proj+' de 70. O mínimo para não ser eliminado é 35.</p></div>';
  if(M.luck||M.sure) h+='<div class="note small"><b>Leitura da sua confiança:</b> '+(M.luck?M.luck+(M.luck===1?' acerto veio':' acertos vieram')+' no chute (não conte com eles na prova; já estão no caderno). ':'')+(M.sure?M.sure+(M.sure===1?' erro foi':' erros foram')+' com certeza: é aí que mora o conceito errado, e corrigir erro confiante fixa mais do que qualquer revisão.':'')+'</div>';
  h+='<h3>Por matéria</h3><div class="crit">'+Object.keys(M.bys).map(sid=>'<span>'+esc(SUBJ[sid].nome)+'</span><span>'+M.bys[sid].ok+'/'+M.bys[sid].n+'</span>').join('')+'</div>';
  h+='<h3 style="margin-top:18px">Correção</h3>';
  M.qs.forEach((r,i)=>{ const a=M.ans[i], ok=a===r.right;
    h+='<div class="q"><div class="qn"><span class="qnum">'+(i+1)+'</span>'+fmtText(r.q)+'</div><p class="small" style="margin-top:6px"><b class="'+(ok?'m4':'m0')+'">'+(ok?'Certa':(a==null?'Em branco':'Errada'))+'</b>'+(M.guess[i]?' <span class="pill sm">chute</span>':'')+(ok?'':'. Correta: '+esc(r.opts[r.right])+(a!=null?'. Você marcou: '+esc(r.opts[a]):''))+'. Tempo: '+fmtSec(M.time[i])+'.</p>'+(r.x?'<p class="small muted">'+fmtText(r.x)+'</p>':'')+(r.steps?'<ol class="steps">'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>':'');

function finishTeste80(){
  const M=tutor.t80; if(!M||M.done) return; M.done=true;

  rec.tries++; rec.best=Math.max(rec.best,pc); const just=pc>=0.8&&!rec.passed; if(pc>=0.8) rec.passed=true;
  addEv(M.t,'teste80',M.qs.length,ok);
  const d=Dm(today()); d.q+=M.ans.filter(x=>x!=null).length; d.a+=ok;
  M.qs.forEach((q,i)=>{ if(M.ans[i]!==q.right) errFromQ({t:M.t,q:q.q,opts:q.opts,right:q.right,x:q.x,src:'t80'}); });
  gainXP(ok*10+(just?50:0));

}

function ladder(rung,big){
  const w=big?56:22,h=big?96:34,xl=big?10:4,xr=big?46:18,ys=big?[78,50,22]:[27,17,7],sw=big?6:2.6;

  ys.forEach((y,i)=>{ const c=i<rung?'on':(i===rung?'cur':'off'); s+='<line class="rung '+c+'" x1="'+xl+'" y1="'+y+'" x2="'+xr+'" y2="'+y+'" stroke-width="'+sw+'"/>'; });
  return s+'</svg>';
}
function metricsChart(n){
  const k=today();
  if(n<=30){
    const days=[]; for(let i=n-1;i>=0;i--){ const dk=addDays(k,-i), d=S.days[dk]||{}; days.push({dk,v:d.xp||0,meta:d.meta}); }
    const mx=Math.max(goalXP(),...days.map(x=>x.v)), dense=n>15, every=n<=7?1:(n<=15?2:5), gl=Math.round(goalXP()/mx*100);
    return '<div class="wchart'+(dense?' dense':'')+'"><div class="wc-h"><b>XP por dia</b><span class="small muted">linha: meta de '+goalXP()+'</span></div><div class="wc-bars"><em class="wc-goal" style="bottom:'+gl+'%"></em>'+days.map((x,i)=>'<div class="wc-col'+(x.dk===k?' today':'')+(x.v?' has':'')+(x.meta?' meta':'')+'"><span class="wc-v">'+(!dense&&x.v?x.v:'')+'</span><i style="height:'+Math.max(3,Math.round(x.v/mx*100))+'%"></i><span class="wc-d">'+(((n-1-i)%every===0||x.dk===k)?dateOf(x.dk).getDate():'')+'</span></div>').join('')+'</div></div>';
  }
  const months=[], now=new Date();
  for(let i=11;i>=0;i--){ const dt=new Date(now.getFullYear(),now.getMonth()-i,1), y=dt.getFullYear(), m=dt.getMonth(); let v=0; for(const dk in S.days){ const dd=dateOf(dk); if(dd.getFullYear()===y&&dd.getMonth()===m) v+=S.days[dk].xp||0; } months.push({y,m,v}); }
  const mx=Math.max(1,...months.map(x=>x.v));
  return '<div class="wchart"><div class="wc-h"><b>XP por mês</b><span class="small muted">últimos 12 meses</span></div><div class="wc-bars">'+months.map(x=>{ const cur=x.y===now.getFullYear()&&x.m===now.getMonth(); return '<div class="wc-col'+(cur?' today':'')+(x.v?' has':'')+'"><span class="wc-v">'+(x.v||'')+'</span><i style="height:'+Math.max(3,Math.round(x.v/mx*100))+'%"></i><span class="wc-d">'+new Date(x.y,x.m,1).toLocaleDateString('pt-BR',{month:'short'}).replace('.','')+'</span></div>'; }).join('')+'</div></div>';
}

/* ===================== EVENTOS ===================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return; const name=b.dataset.a, f=A[name]; if(!f) return;
  if(b.tagName==='A') return;
  e.preventDefault();
  SND.unlock();
  const before=UNDO.has(name)?JSON.stringify(S):null;
  try{ const r=f(b,e); if(r&&typeof r.then==='function') r.catch(err=>console.error(err)); }catch(err){ console.error(err); toast('Algo deu errado. Tente de novo.'); }
  try{ afterAction(); }catch(err){}
  if(before!=null&&JSON.stringify(S)!==before){ undoStack.push(before); if(undoStack.length>6) undoStack.shift(); if($('#sheet').hidden) render(); }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='lgT'){ const el=$('#lgInfo'); if(el&&sheetLog.info) el.innerHTML=sheetLog.info(t.value); }
  if(t.id==='gqT'){ const n=$('#gqN'); if(n) n.value=String(Math.min(T(t.value).rung,2)); }

  if(t.id==='convImg'){ const C=CONVS[UI.conv]; if(C&&t.files&&t.files[0]){ C.img=t.files[0]; toast('Foto pronta. Escreva a pergunta e envie.'); const lb=t.closest('label'); if(lb) lb.querySelector('span').textContent='Foto pronta'; } }

});
let draftT=null;
document.addEventListener('input',e=>{

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!$('#celebrate').hidden){ A.celClose(); return; } if(!$('#sheet').hidden){ closeSheet(); return; } }
  const tg=e.target, typing=tg&&(tg.tagName==='TEXTAREA'||tg.tagName==='INPUT'||tg.tagName==='SELECT');
  if(typing){ if(tg.id==='convIn'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); A.convSend(); } return; }
  if(!$('#sheet').hidden){ if(e.key==='Tab') trapTab(e); return; }
  if(!$('#celebrate').hidden||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase(), num=/^[1-9]$/.test(k)?+k-1:('abcde'.indexOf(k)>=0&&k.length===1?'abcde'.indexOf(k):-1);
  if(arKeydown(e,k,num)){ e.preventDefault(); return; }
  const F=tutor.flash, G=tutor.game, M=tutor.sim, R=tutor.rf;
  if(UI.tab==='tutor'&&F&&!F.done&&F.pos<F.q.length){
    if(!F.revealed&&(k===' '||k==='enter')){ e.preventDefault(); A.flashFlip(); return; }
    if(F.revealed&&/^[1-4]$/.test(k)){ e.preventDefault(); flashGrade(+k-1); return; }
  }
  if(UI.tab==='tutor'&&G&&!G.done){
    const r=G.rounds[G.pos];
    if(r&&!r.ord&&G.pick==null&&num>=0&&num<r.opts.length){ e.preventDefault(); gAnswer(num); return; }
    if(G.pick!=null&&k==='enter'&&G.mode!=='relampago'&&!G.over&&!G.won){ e.preventDefault(); gNext(); return; }
  }
  if(UI.tab==='tutor'&&M&&!M.done){
    const r=M.qs[M.pos];
    if(num>=0&&num<r.opts.length&&/^[a-e1-5]$/.test(k)){ e.preventDefault(); M.ans[M.pos]=num; SND.tap(); render(); return; }
    if(k==='arrowright'){ e.preventDefault(); A.simNext(); return; } if(k==='arrowleft'){ e.preventDefault(); A.simPrev(); return; }
  }
  if(UI.tab==='erros'&&R&&!R.done&&R.pick==null&&num>=0){ const b=$$('#app [data-a="rfPick"]')[num]; if(b){ e.preventDefault(); b.click(); } }
});
function trapTab(e){ const pn=$('#sheet .panel'); const f=[...pn.querySelectorAll('button:not([disabled]),[href],input:not([type="file"]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null); if(!f.length) return; const first=f[0], last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } }
let lastDay=today();
function tick(){
  gtTick();
  const G=tutor.game;
  if(G&&G.mode==='relampago'&&!G.done){ const left=G.end-Date.now(); const c=$('#relClock'), bar=$('#relBar'); const s=Math.max(0,Math.ceil(left/1000));
    if(c&&c.textContent!==String(s)){ c.textContent=s; if(s<=5&&s>0) SND.tick(); } if(bar) bar.style.width=Math.max(0,100*left/60000)+'%';
    if(left<=0) gFinish(G); }
  const AG=arCur();
  if(AG&&AG.mode==='rel'&&!AG.done){ const left=AG.end-Date.now(); const c=$('#relClock'), bar=$('#relBar'); const s=Math.max(0,Math.ceil(left/1000));
    if(c&&c.textContent!==String(s)){ c.textContent=s; if(s<=5&&s>0) SND.tick(); } if(bar) bar.style.width=Math.max(0,100*left/60000)+'%';
    if(left<=0&&!AG.ans) arFinish(AG); }
  const R=tutor.rel;
  if(R&&!R.over){ const left=R.end-Date.now(); const c=$('#relClock'), bar=$('#relBar'); if(c) c.textContent=Math.max(0,Math.ceil(left/1000)); if(bar) bar.style.width=Math.max(0,100*left/60000)+'%';
    if(left<=0){ R.over=true; SND.timerEnd(); const g=S.games[R.t]||(S.games[R.t]={}); R.isBest=R.score>0&&(!g.rel||R.score>g.rel); if(R.isBest) g.rel=R.score; commit(); afterAction(); if(UI.tab==='tutor'&&$('#sheet').hidden) render(); } }
  const Q=tutor.quiz; if(Q&&Q.running){ const el=$('#qt-'+Q.running.idx); if(el) el.textContent=fmtSec((Q.time[Q.running.idx]||0)+(Date.now()-Q.running.start)/1000); }
  const M=tutor.sim; if(M&&!M.done){ const el=$('#simClock'); if(el) el.textContent=fmtSec((Date.now()-M.start)/1000); }
  if(today()!==lastDay){ lastDay=today(); if($('#sheet').hidden) render(); }
}
