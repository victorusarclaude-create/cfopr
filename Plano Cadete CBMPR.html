<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano Cadete CBMPR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEAE6; --surface:#F7F6F3; --sunk:#E1DFD9; --ink:#1A1B1D; --muted:#595D62; --line:#CBC8C1;
  --red:#C21D16; --on-red:#FFFFFF; --red-soft:#F4D8D5;
  --green:#08703F; --on-green:#FFFFFF; --green-soft:#D2E9DB;
  --amber:#8A6100; --amber-soft:#F2E3B8;
  --focus:#1D5BD1;
  --m0:#B3261E; --m1:#B5570F; --m2:#8A6D00; --m3:#146B63; --m4:#08703F;
  --nav-h:62px;
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171A; --surface:#1C2024; --sunk:#101215; --ink:#ECEDE9; --muted:#A3A9AE; --line:#30363B;
    --red:#FF5A4F; --on-red:#1A0605; --red-soft:#3A1917;
    --green:#6FE0A0; --on-green:#062012; --green-soft:#12301F;
    --amber:#FFC641; --amber-soft:#3A2E0E; --focus:#8AB4FF; color-scheme:dark;
    --m0:#FF6B5E; --m1:#FF9D4D; --m2:#E8C34A; --m3:#4FD1C0; --m4:#6FE0A0;
  }
}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2024; --sunk:#101215; --ink:#ECEDE9; --muted:#A3A9AE; --line:#30363B;
  --red:#FF5A4F; --on-red:#1A0605; --red-soft:#3A1917;
  --green:#6FE0A0; --on-green:#062012; --green-soft:#12301F;
  --amber:#FFC641; --amber-soft:#3A2E0E; --focus:#8AB4FF; color-scheme:dark;
  --m0:#FF6B5E; --m1:#FF9D4D; --m2:#E8C34A; --m3:#4FD1C0; --m4:#6FE0A0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
#app{max-width:640px;margin:0 auto;padding:14px 18px calc(var(--nav-h) + 96px)}
h1,h2,h3{font-family:var(--cond);margin:0;line-height:1}
h1{font-weight:700;font-size:clamp(2.6rem,12vw,3.8rem);letter-spacing:-.01em}
h2{font-weight:700;font-size:1.55rem;margin:28px 0 10px}
h3{font-weight:600;font-size:1.2rem}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;font-size:.92rem;color:var(--muted)}
.top .date::first-letter{text-transform:uppercase}
.sync{font-size:.82rem;white-space:nowrap}
.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.ok::before{background:var(--green)}
.dayhead .sub{font-size:1.05rem;color:var(--muted);margin-top:8px}

.stat b{display:block;font-family:var(--cond);font-weight:700;font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.8rem;line-height:1.25;color:var(--muted);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;transition:transform .1s ease,box-shadow .1s ease}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.go{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--red);font-weight:600;text-decoration:underline;text-underline-offset:3px}


.plan{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.plan li{display:grid;grid-template-columns:34px 1fr 46px;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.plan .n{font-family:var(--cond);font-weight:700;font-size:1.7rem;line-height:1;color:var(--muted);padding-top:2px}
.plan .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.plan .t{font-family:var(--cond);font-weight:700;font-size:1.3rem}
.plan .m{font-family:var(--cond);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.plan .d{margin:4px 0 10px}
.plan .acts{display:flex;gap:8px;flex-wrap:wrap}
.plan .acts .btn{min-height:40px;padding:6px 12px;font-size:.95rem}
.plan li.done .t,.plan li.done .d{color:var(--muted)}
.plan li.done .n{color:var(--green)}


.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.trow{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 0;background:none;border:0;text-align:left}
.trow .nm{font-weight:500}
.trow .meta{font-size:.85rem;color:var(--muted)}
.trow .pill{font-family:var(--cond);font-weight:600;font-size:.95rem;color:var(--muted);white-space:nowrap}
.ladder .rail{stroke:var(--muted);stroke-width:2}
.ladder.big .rail{stroke-width:3.5}
.ladder .rung{stroke-linecap:round}
.ladder .on{stroke:var(--green)}
.ladder .cur{stroke:var(--red)}
.ladder .off{stroke:var(--line)}
details.subj{border-bottom:1px solid var(--line)}
details.subj>summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;cursor:pointer;align-items:baseline}
details.subj>summary::-webkit-details-marker{display:none}
details.subj>summary .sn{font-family:var(--cond);font-weight:700;font-size:1.25rem}
details.subj>summary .sn::before{content:"+";display:inline-block;width:18px;color:var(--muted)}
details.subj[open]>summary .sn::before{content:"−"}
details.subj>summary .sq{font-size:.9rem;color:var(--muted);white-space:nowrap}
details.subj .inner{padding:0 0 14px 18px}
details.subj .inner .list{border-top:0}






.bar{height:6px;background:var(--sunk);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .6s cubic-bezier(.22,1,.36,1)}
label.f{display:block;margin:12px 0 0;font-weight:600;font-size:.95rem}
label.f>input,label.f>select,label.f>textarea,.f-input{display:block;width:100%;margin-top:6px;font:inherit;font-weight:400;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:110px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.note{padding:12px 14px;background:var(--amber-soft);border-left:4px solid var(--amber);margin:12px 0}
.okbox{padding:12px 14px;background:var(--green-soft);border-left:4px solid var(--green);margin:12px 0}
.badbox{padding:12px 14px;background:var(--red-soft);border-left:4px solid var(--red);margin:12px 0}
.section{margin-top:26px}



.bars{display:flex;align-items:flex-end;gap:10px;height:130px;position:relative;margin:14px 0 4px;padding-top:6px;border-bottom:1.5px solid var(--line)}
.bars .min{position:absolute;left:0;right:0;bottom:calc(50% - 10px);border-top:1.5px dashed var(--red);z-index:2;pointer-events:none}
.bars .min span{position:absolute;right:0;top:-18px;font-size:.75rem;color:var(--red);background:var(--bg);padding:0 0 0 4px}
.bars .col{flex:0 1 40px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;z-index:1}
.bars .col i{display:block;background:var(--ink);min-height:2px}
.bars .col.low i{background:var(--red)}
.bars .col b{font-family:var(--cond);font-size:.95rem;text-align:center}
.crit{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:10px 0}
.crit .w{color:var(--red);font-weight:600}
.chat{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.msg{margin:12px 0;line-height:1.5}
.msg.u{margin-left:15%;padding:10px 12px;background:var(--sunk);border-radius:10px 10px 2px 10px;white-space:pre-wrap}
.msg.a{padding-left:12px;border-left:3px solid var(--red)}
.msg.a.pending{color:var(--muted)}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q .qn{font-weight:500;white-space:pre-wrap}
.alt{display:block;width:100%;text-align:left;margin:8px 0 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);min-height:44px;transition:transform .1s ease}
.alt.right{border-color:var(--green);background:var(--green-soft)}
.alt.wrong{border-color:var(--red);background:var(--red-soft)}
.alt[disabled]{cursor:default;color:var(--ink)}
.exp{margin-top:10px;font-size:.95rem}
.exp.ok b{color:var(--green)} .exp.bad b{color:var(--red)}
.tool{padding:16px 0;border-bottom:1px solid var(--line)}
.tool:first-of-type{border-top:1px solid var(--line)}
/* nav */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);position:relative}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--red)}
#tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--red)}
#tabs .dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:var(--on-red);font-size:.7rem;display:grid;place-items:center;padding:0 4px}
/* timer */
#timerbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:29;background:var(--surface);color:var(--ink);border-top:1px solid var(--line);transition:transform .15s ease}
#timerbar.paused{background:var(--sunk);color:var(--muted)}
#timerbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:10px 1fr auto auto auto auto;align-items:center;gap:8px;padding:8px 10px 8px 0}
#timerbar .stripe{align-self:stretch;background:repeating-linear-gradient(-45deg,var(--red) 0 5px,transparent 5px 10px)}
#timerbar.paused .stripe{background:repeating-linear-gradient(-45deg,var(--muted) 0 5px,transparent 5px 10px);opacity:.5}
#timerbar .lb{font-size:.85rem;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerbar .clock{font-family:var(--mono);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
#timerbar .ghostbtn{background:transparent;border:1.5px solid var(--line);color:inherit;border-radius:6px;padding:5px 10px;min-height:36px;font-weight:600;font-size:.85rem}
#timerbar .collapse{background:transparent;border:1.5px solid var(--line);color:inherit;border-radius:6px;width:32px;min-height:32px;font-size:1.1rem;line-height:1;padding:0}
#timerbar.collapsed{background:transparent;border-top:none;pointer-events:none}
#timerbar .mini{pointer-events:auto;margin:0 auto 6px;display:flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:var(--sh1);min-height:auto}
#timerbar.running .mini .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
#timerbar.paused .mini .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
#timerbar .mini .clock{font-size:.95rem}
.mteaser{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:14px;align-items:center;width:100%;margin-top:16px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1);text-align:left}
.mt-l{font-family:var(--cond);font-weight:700;font-size:1rem;grid-column:1/-1}
.mt-row{display:flex;flex-direction:column;gap:1px}
.mt-row b{font-family:var(--mono);font-size:1.5rem;line-height:1}
.mt-row span{font-size:.75rem;color:var(--muted)}
.mt-go svg{width:18px;height:18px}
.bigstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bstat{padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1);text-align:left}
.bstat b{display:block;font-family:var(--mono);font-size:2rem;line-height:1;letter-spacing:-.02em}
.bstat span{display:block;font-size:.82rem;color:var(--muted);margin-top:4px}
.bstat em{display:block;font-style:normal;font-size:.78rem;color:var(--m4);margin-top:2px;font-weight:600}
.wchart.dense .wc-bars{gap:2px}
.wchart.dense .wc-col i{border-radius:2px 2px 1px 1px}
.wchart.dense .wc-v{display:none}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;overscroll-behavior:contain}
#sheet .panel h2{margin-top:0}
.sheet-close{float:right;background:none;border:0;font-size:1.6rem;line-height:1;padding:4px 8px;color:var(--muted);margin:-6px -8px 0 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 72px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:min(92vw,520px);font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.bigladder{display:flex;gap:16px;align-items:center;margin:14px 0}
.bigladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:10px}
.bigladder li{font-family:var(--cond);font-weight:600;font-size:1.1rem;color:var(--muted)}
.bigladder li.on{color:var(--green)} .bigladder li.cur{color:var(--red)}
.stack>*+*{margin-top:10px}
.rank{margin:16px 0 4px;padding:12px 14px 10px;background:var(--surface);border-left:4px solid var(--green)}
.rk-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rk-name{font-family:var(--cond);font-weight:700;font-size:1.35rem}
.rk-next{font-size:.82rem;color:var(--muted)}
.content-body{margin:14px 0;padding:14px;background:var(--bg);border-left:3px solid var(--amber);line-height:1.55}
.links>li{padding:10px 0}
.links a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.links a span{color:var(--red);text-decoration:none}
.deck{padding:12px 0}
.deck-hd{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center}
.deck-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-left:48px}
.deck-acts .btn{min-height:38px;padding:6px 12px;font-size:.92rem}
.fc-count{display:grid;place-items:center;width:38px;height:38px;border-radius:6px;background:var(--sunk);font-family:var(--cond);font-weight:700;font-size:1.1rem}
.fc-count.due{background:var(--red);color:var(--on-red)}
.flashcard{display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;min-height:210px;margin-top:10px;padding:24px 18px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);color:var(--ink);text-align:center;font:inherit}
button.flashcard{cursor:pointer}
.flashcard.static{min-height:120px}
.fc-f{display:block;font-family:var(--cond);font-weight:700;font-size:1.55rem;line-height:1.15}
.fc-b{display:block;width:100%;margin-top:18px;padding-top:16px;border-top:1.5px dashed var(--line);font-size:1.15rem;font-weight:600;color:var(--green)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mtile{min-height:68px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:.92rem;line-height:1.25}
.mtile.front{font-weight:600}
.mtile.sel{border-color:var(--ink);background:var(--sunk)}
.mtile.bad{border-color:var(--red);background:var(--red-soft)}
.mtile.solved{border-color:var(--green);background:var(--green-soft);color:var(--muted)}
.relbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px;font-family:var(--cond);font-weight:700;font-size:1.25rem}
.relclock{font-size:2.6rem;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.tl-done{list-style:none;margin:12px 0;padding:0;border-left:3px solid var(--green)}
.tl-done li{padding:6px 0 6px 12px}
.tl-done b{font-family:var(--cond);font-size:1.1rem;color:var(--green);margin-right:8px}
.qtimer{display:inline-flex;align-items:center;gap:6px;margin:8px 0 6px;padding:6px 14px;min-height:38px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums}
.qtimer.running{border-color:var(--red);color:var(--red)}
.topr{display:flex;align-items:center;gap:10px}
.undobtn{background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600;color:var(--ink);min-height:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.cl{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding-bottom:2px}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:.85rem;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.cd.empty{border:none;background:none}
.cd.done{background:var(--green);color:var(--on-green);border-color:var(--green)}
.cd.folga{background:var(--sunk);border-color:var(--sunk)}
.cd.miss{border-color:var(--red);color:var(--red)}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.callegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--muted)}
.callegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--bg);border:1px solid var(--line)}
.callegend i.done{background:var(--green);border-color:var(--green)}
.callegend i.folga{background:var(--sunk);border-color:var(--sunk)}
.callegend i.miss{border-color:var(--red)}
.legend-list{list-style:none;margin:12px 0;padding:0}
.legend-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.q-prompt{font-weight:600;font-size:1.05rem;margin-top:10px}
.prmap{width:100%;max-width:280px;display:block;margin:14px auto 6px}
.prmap .zone{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:fill .15s,stroke .15s}
.prmap .zone.good{fill:var(--green);stroke:var(--green)}
.prmap .zone.bad{fill:var(--red-soft);stroke:var(--red)}
.prmap text{font-family:var(--body);font-size:13px;font-weight:600;fill:var(--ink);pointer-events:none}
.prmap .zone.good~text{fill:var(--on-green)}
.btn.vffalse{border-color:var(--red);color:var(--red)}
.aibox{margin-top:10px;padding:12px 14px;background:var(--surface);border-left:3px solid var(--focus);line-height:1.5;font-size:.95rem}
.aibtn{margin-top:10px}

  });

const CONTENT = {
  'hist-ocup':'Antes da chegada europeia, o território paranaense era ocupado pelos Guarani (litoral e áreas de araucária) e pelos Kaingang (planalto). A ocupação portuguesa começou pelo litoral no século XVII, atraída pelo ouro de aluvião de Paranaguá (1648) e depois de Curitiba. Esgotado o ouro no século XVIII, os povoadores migraram para o planalto e viveram de gado e agricultura de subsistência. O eixo dos Campos Gerais (região de Ponta Grossa) foi o principal vetor de povoamento no século XIX, reforçado por imigrantes europeus (alemães, italianos, poloneses, ucranianos). No século XX, duas frentes completaram a ocupação: a cafeeira, vinda de São Paulo, no Norte (Londrina, Maringá); e a colonizadora, vinda do Rio Grande do Sul e Santa Catarina, no Oeste e Sudoeste.',
  'hist-ciclos':'Guarde a ordem: ouro → tropeirismo/erva-mate → madeira → café. 1) Ouro (séc. XVII-XVIII): extração em Paranaguá e no planalto de Curitiba, primeiro impulso povoador. 2) Tropeirismo e erva-mate (séc. XVIII-XIX): tropas de gado vindas do Sul cruzavam o estado rumo a Sorocaba (SP) pelo Caminho das Tropas, fixando os pousos que viraram cidades dos Campos Gerais; a erva-mate nativa virou o principal produto de exportação do Paraná no século XIX. 3) Madeira (fim do séc. XIX a meados do XX): exploração da araucária, ligada à expansão ferroviária. 4) Café (séc. XX): avançou do Norte vindo de São Paulo, e fez o Paraná ser o maior produtor nacional nas décadas de 1950-60, até a geada negra de 1975 devastar os cafezais e acelerar a virada para a soja.',
  'hist-emanc':'Até 1853, o território paranaense era a Comarca de Curitiba, parte da Província de São Paulo. Um movimento separatista, liderado por lideranças de Curitiba e dos Campos Gerais que reivindicavam mais autonomia e investimento, ganhou força a partir de 1840. A Lei Imperial nº 704, de 29 de agosto de 1853, desmembrou a Comarca de São Paulo e criou a Província do Paraná. Zacarias de Góis e Vasconcelos foi o primeiro presidente da província, empossado em Curitiba em 19 de dezembro de 1853 — data celebrada até hoje como o Dia do Paraná.',
  'geo-ocup':'A ocupação territorial do Paraná seguiu os mesmos ciclos econômicos que moldaram sua história: começou no litoral e no planalto de Curitiba com o ouro, avançou pelos Campos Gerais com o tropeirismo e a erva-mate, e só no século XX se completou com a ocupação do Norte (frente cafeeira vinda de São Paulo, com cidades planejadas como Londrina e Maringá) e do Oeste/Sudoeste (colonização vinda do Rio Grande do Sul e Santa Catarina). Esse duplo movimento — paulista no Norte, sulista no Oeste — explica diferenças culturais e econômicas que existem até hoje entre as regiões do estado.',
  'geo-ciclos':'Do ponto de vista espacial, os ciclos econômicos (veja em História do Paraná) explicam a regionalização do estado até hoje: o Sul e o Leste concentraram erva-mate e madeira; o Norte, café; o Oeste e o Sudoeste, a agricultura da colonização gaúcha-catarinense. É essa lógica histórica que organiza a divisão regional do Paraná cobrada em questões de geografia.',
  'geo-povos':'O Paraná tem povos indígenas Guarani e Kaingang, com terras demarcadas no litoral, no centro-sul e no oeste do estado. Há comunidades quilombolas reconhecidas principalmente no Vale do Ribeira (divisa com São Paulo) e em municípios do litoral. As comunidades tradicionais incluem os caiçaras do litoral (pesca artesanal) e os ribeirinhos ao longo de rios como o Ivaí e o Paraná.',
  'scip-lei':'A Lei Estadual 19.449/2018 regula o poder de polícia administrativa do Corpo de Bombeiros Militar e fixa normas gerais de prevenção e combate a incêndio e a desastres. Foi ela que deu ao CBMPR papel fiscalizador: analisar projetos, vistoriar, licenciar e punir irregularidades em edificações, estabelecimentos, áreas de risco e eventos temporários. Atenção: a lei foi alterada pela Lei 22.367/2025, em vigor desde abril de 2026, e os procedimentos de vistoria e licenciamento foram atualizados na NPA 001 (2026). Estude pelo texto oficial e confira na NPA 001 as siglas dos certificados (CVCB, CLCB), porque é aí que a banca costuma pegar.',
  'scip-dec':'O Decreto Estadual 11.868/2018 regulamenta a Lei 19.449/2018: detalha como o CBMPR exerce o poder de polícia (fiscalização, sanções) e disciplina o Termo de Compromisso de Ajustamento de Conduta (TCAC), usado para o responsável regularizar o imóvel dentro de um cronograma acordado. Se a questão fala em procedimento, prazo ou TCAC, pense no Decreto; se fala em competência e normas gerais, pense na Lei.',
  'leg-pnspds':'A Lei 13.675/2018 cria o Susp (Sistema Único de Segurança Pública) e a PNSPDS, reunindo União, Estados, DF e Municípios num esforço coordenado. Fixa princípios como uso comedido e proporcional da força e respeito aos direitos humanos, e lista quem compõe o Susp: polícias federais, civis e militares, corpos de bombeiros militares, guardas municipais, entre outros.',
  'leg-lonpm':'A Lei 14.751/2023 é a norma geral federal que todo estado deve seguir ao organizar sua PM e seu Corpo de Bombeiros. Define que são forças auxiliares e reserva do Exército, organizadas por hierarquia e disciplina militares, comandadas por um oficial da ativa do último posto. O detalhamento de carreira e disciplina fica com a lei de cada estado — no Paraná, a Lei 22.206/2024 e o Código da PMPR (Lei 1.943/1954).',

  'apub-lic':'A Lei 14.133/2021 é a Lei de Licitações e Contratos vigente. Modalidades: pregão (bens e serviços comuns), concorrência (demais casos, inclusive obras), concurso (trabalhos técnicos/científicos/artísticos), leilão (venda de bens) e diálogo competitivo (soluções inovadoras). Contratação direta se divide em dispensa (a lei permite não licitar, ex.: valor baixo, emergência) e inexigibilidade (é impossível ter competição, ex.: fornecedor exclusivo). O Sistema de Registro de Preços registra preços para contratações futuras sem repetir a licitação inteira.'

const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function keyOf(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function today(){ return keyOf(new Date()); }
function dateOf(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d,12); }
function addDays(k,n){ const d=dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function diffDays(a,b){ return Math.round((dateOf(b)-dateOf(a))/86400000); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function fmtMin(m){ m=Math.round(m); const h=Math.floor(m/60), r=m%60; return h? (h+'h'+(r?String(r).padStart(2,'0'):'')) : (r+' min'); }
function pct(a,f){ return f? Math.round(100*a/f)+'%' : '—'; }
function fmtText(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const tmp=a[i]; a[i]=a[j]; a[j]=tmp; } return a; }

Object.keys(FLASHCARDS2).forEach(function(k){ FLASHCARDS[k]=(FLASHCARDS[k]||[]).concat(FLASHCARDS2[k]); });

function seedDeck(topicId){ return (FLASHCARDS[topicId]||[]).map(([f,b])=>({id:uid(),f,b,box:0,due:today()})); }
function defaultState(){
  const topicList={},flashcards={};
  SUBJECTS.forEach(s=>{ topicList[s.id]=s.topicos.map(([id,nome,base])=>({id,nome,base:!!base})); });
  Object.keys(FLASHCARDS).forEach(tid=>{ flashcards[tid]=seedDeck(tid); });
  return {v:1,updatedAt:0,topicList,topics:{},days:{},erros:[],redacoes:[],flashcards,games:{}};
}
function migrate(o){
  const d=defaultState();
  if(!o||typeof o!=='object') return d;
  o.topicList=o.topicList||{};
  SUBJECTS.forEach(s=>{ if(!Array.isArray(o.topicList[s.id])) o.topicList[s.id]=d.topicList[s.id]; });
  o.topics=o.topics||{}; o.days=o.days||{}; o.erros=Array.isArray(o.erros)?o.erros:[]; o.redacoes=Array.isArray(o.redacoes)?o.redacoes:[];
  o.flashcards=o.flashcards||{};
  Object.keys(FLASHCARDS).forEach(tid=>{ if(!Array.isArray(o.flashcards[tid])) o.flashcards[tid]=seedDeck(tid); });
  o.games=o.games||{};
  o.updatedAt=o.updatedAt||0; o.v=1; return o;
}

/* ================= Sincronização ================= */
let dbRef=null, writing=false, again=false, pushT=null, syncMode='local', retried=false;
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function commit(){ S.updatedAt=Date.now(); saveLocal(); clearTimeout(pushT); pushT=setTimeout(pushRemote,1200); }
async function pushRemote(){
  if(!dbRef) return;
  if(writing){ again=true; return; }
  writing=true;
  try{ await dbRef.set({updatedAt:S.updatedAt,data:JSON.stringify(S)}); retried=false; setSync('ok'); }
  catch(e){
    if(e&&e.code==='unavailable'&&!retried){ retried=true; setTimeout(pushRemote,1500+Math.random()*2000); }
    else setSync('local');
  }
  finally{ writing=false; if(again){ again=false; pushRemote(); } }
}

function score(s,t){
  const st=T(t.id), n=(S.topicList[s.id]||[]).length||1;
  let v=(s.q/n)*FAC[s.tipo]*GAP[st.rung];
  if(t.base&&st.rung===0) v*=1.6;
  if(st.rung>0&&st.rung<3&&st.last&&diffDays(st.last,today())>21) v*=1.3;
  if(st.flag==='teoria') v*=1.15;
  v*=(1.25-topicMastery(t.id));
  return v;
}
function reason(s,t){
  const st=T(t.id), p=[s.q+' questões de '+s.nome+' na prova'];
  if(s.tipo==='memoria') p.push('conteúdo de lei ou manual, rende rápido');
  if(t.base&&st.rung===0) p.push('base que destrava Física e Química');
  if(st.rung>0&&st.last&&diffDays(st.last,today())>21) p.push('sem treino há mais de 3 semanas');
  return p.join('; ');
}
function ranked(filter){
  const out=[];
  SUBJECTS.forEach(s=>{
    if(filter&&filter.blocos&&!filter.blocos.includes(s.bloco)) return;
    if(filter&&filter.subj&&!filter.subj.includes(s.id)) return;
    (S.topicList[s.id]||[]).forEach(t=>{
      const st=T(t.id);
      if(filter&&filter.maxRung!=null&&st.rung>filter.maxRung) return;
      if(st.rung>=3) return;
      out.push({s,t,v:score(s,t)});
    });
  });
  return out.sort((a,b)=>b.v-a.v);
}
function pick(filter){ const r=ranked(filter); return r.length?r[0].t.id:null; }

function applyLog(topicId,f,a,atRung,noEv){
  const st=Tm(topicId), k=today(), d=Dm(k);
  if(!noEv){ d.q+=f; d.a+=a; } st.tf+=f; st.ta+=a; st.last=k;
  if(!noEv) addEv(topicId,'q',f,a,atRung!=null?atRung:st.rung);
  let msg='Registrado: '+a+' de '+f+'.';
  if(atRung!=null&&atRung!==st.rung){ commit(); return msg+' (contou no total, fora do degrau atual)'; }
  if(st.rung<3){
    st.f+=f; st.a+=a;
    if(st.f>=10){
      const r=st.a/st.f;
      if(r>=0.8){ SND.level(); st.rung++; st.f=0; st.a=0; st.flag=null; msg=st.rung===3?'Tópico dominado. Ele sai da fila e volta só para manutenção.':'Subiu para o degrau '+RUNGS[st.rung]+'. Mandou bem.'; }
      else if(r<0.5){ st.flag='teoria'; msg='Abaixo de 50% no degrau '+RUNGS[st.rung]+'. Volte na teoria ou peça ao Tutor para ensinar do zero.'; }
      if(st.f>=20){ st.f=f; st.a=a; }
    }
  }
  commit(); return msg;
}

function streak(){
  const act=d=>d&&(d.min>0||d.q>0||d.folga);
  let k=today(), n=0;
  if(!act(S.days[k])) k=addDays(k,-1);
  while(act(S.days[k])){ n++; k=addDays(k,-1); }
  return n;
}
function bestStreak(){
  const keys=Object.keys(S.days).filter(k=>{ const d=S.days[k]; return d&&(d.min>0||d.q>0||d.folga); }).sort();
  if(!keys.length) return 0;
  let best=1,cur=1;
  for(let i=1;i<keys.length;i++){ cur = diffDays(keys[i-1],keys[i])===1 ? cur+1 : 1; best=Math.max(best,cur); }
  return best;
}

  const cells=[]; for(let i=0;i<startWd;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);
  while(cells.length%7) cells.push(null);

}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast('Copiado.'); return; }catch(e){}
  const ta=$('#cpTxt'); if(ta){ ta.focus(); ta.select(); try{ document.execCommand('copy'); toast('Copiado.'); }catch(e){ toast('Selecione o texto e copie manualmente.'); } }
}

/* ================= Ações de tutor ================= */
function trimTurns(t){ let x=t.slice(-16); while(x.length&&x[0].role!=='user') x=x.slice(1); return x; }
async function chatSend(text){
  text=(text||'').trim(); if(!text||tutor.busy) return;
  tutor.err=''; tutor.turns.push({role:'user',content:text});
  const s=await getSample();
  if(!s){ const all=(tutor.mode==='duvida'?DUVIDA_RULES:TUTOR_RULES)+'\n\n'+tutor.turns.map(m=>(m.role==='user'?'Eu: ':'Tutor: ')+m.content).join('\n\n'); tutor.turns.pop(); render(); sheetCopy('Copiar pedido',all); return; }
  tutor.busy=true; const ctl=new AbortController(); tutor.ctl=ctl; render(); scrollChat();
  try{
    const r=await s([{role:'user',content:(tutor.mode==='duvida'?DUVIDA_RULES:TUTOR_RULES)}].concat(trimTurns(tutor.turns)),{cache:false,signal:ctl.signal,onText:({text})=>{ const el=$('#streamMsg'); if(el){ el.classList.remove('pending'); el.innerHTML=fmtText(text); } }});
    tutor.turns.push({role:'assistant',content:r.text+(r.truncated?'\n\n(resposta cortada)':'')});
  }catch(e){
    if(e&&e.text) tutor.turns.push({role:'assistant',content:e.text+'\n\n(interrompido)'});
    const m=sampleMsg(e); if(m) tutor.err=m;
    if(sampleOff&&!(e&&e.text)){ tutor.turns.pop(); }
  }finally{ tutor.busy=false; tutor.ctl=null; if(UI.tab==='tutor') render(); scrollChat(); }
}
function scrollChat(){ const el=$('#chatIn')||$('#streamMsg'); if(el) try{ el.scrollIntoView({block:'center'}); }catch(e){} }
async function gerarQuiz(tid,nivel){
  const info=topicInfo(tid); if(!info||tutor.quizBusy) return;
  const s=await getSample();
  const prompt=promptGerar(info.s,info.t,nivel);
  if(!s){ sheetCopy('Copiar pedido de questões',prompt.replace('Responda somente com JSON neste formato:','Mostre as questões numeradas e deixe o gabarito comentado no final. Formato de referência:')); return; }
  tutor.quizBusy=true; tutor.err=''; UI.tab='tutor'; saveUI(); render();
  try{
    const data=await s.json(prompt,{cache:false});
    const qs=(data&&Array.isArray(data.questoes)?data.questoes:[]).filter(q=>q&&typeof q.enunciado==='string'&&Array.isArray(q.alternativas)&&q.alternativas.length===5&&Number.isInteger(q.correta)&&q.correta>=0&&q.correta<5).slice(0,5);
    if(!qs.length) throw {code:'invalid_json'};
    tutor.quiz={t:tid,n:nivel,qs:qs.map(q=>({enunciado:q.enunciado,alternativas:q.alternativas.map(String),correta:q.correta,explicacao:String(q.explicacao||'')})),ans:qs.map(()=>null),time:qs.map(()=>0),running:null,logged:false,sentErr:false};
  }catch(e){ const m=sampleMsg(e); if(m) tutor.err=m; }
  finally{ tutor.quizBusy=false; render(); window.scrollTo(0,0); }
}
async function aprender(tid){
  tutor.mode='socratic';
  const info=topicInfo(tid); if(!info) return;
  UI.tab='tutor'; saveUI(); tutor.turns=[]; tutor.quiz=null;
  await chatSend('Quero aprender do zero: '+info.t.nome+' ('+info.s.nome+'). Comece pelo mínimo que cai em questão fácil.');
}

function drawCorrigir(txt,tema){
  const r=tutor.rdResult;
  let h='<h2 id="sheetTitle">Corrigir redação</h2><p class="small muted">Digite ou cole a redação. A correção segue os 4 critérios do edital, de 0 a 5 cada.</p><label class="f">Tema<input id="rcT" value="'+esc(tema!=null?tema:(UI.tema||''))+'"></label><label class="f">Texto<textarea id="rcX" rows="10" placeholder="Sua redação">'+esc(txt||'')+'</textarea></label><p class="small muted" id="rcCount">'+countTxt(txt||'')+'</p>';
  if(tutor.rdErr) h+='<p class="badbox">'+esc(tutor.rdErr)+'</p>';
  if(r){
    const tot=r.n.reduce((a,b)=>a+b,0);
    h+='<div class="'+(tot>=10?'okbox':'badbox')+'"><strong>'+tot+' de 20.</strong> '+(tot>=10?'Acima do mínimo.':'Abaixo do mínimo de 10. Na prova, eliminaria.')+'</div><div class="crit">'+CRIT.map((c,i)=>'<span><strong>'+c+'</strong><br><span class="small">'+esc(r.c[i]||'')+'</span></span><span>'+r.n[i]+'</span>').join('')+'</div>';
    if(r.cor.length) h+='<p style="font-weight:600;margin-top:12px">Correções</p><ul class="small">'+r.cor.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>';
    if(r.p) h+='<p class="note"><strong>Foco da próxima:</strong> '+esc(r.p)+'</p>';
    h+='<div class="stack"><button class="btn go block" data-a="saveCorr">Salvar esta nota</button></div>';
  } else {
    h+='<div class="row" style="margin-top:12px"><button class="btn primary block" data-a="runCorrigir"'+(tutor.rdBusy?' disabled':'')+'>'+(tutor.rdBusy?'Corrigindo, pode levar um minuto...':'Corrigir')+'</button></div>';
  }
  openSheet(h);
}
function countTxt(t){ const w=t.trim()?t.trim().split(/\s+/).length:0; const l=Math.round(w/10); return w+' palavras, cerca de '+l+' linhas manuscritas (estimativa). A prova aceita de 15 a 30.'; }

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b) return; const f=A[b.dataset.a]; if(!f) return;
  e.preventDefault();
  const noUndo=NOUNDO;
  const before=noUndo.includes(b.dataset.a)?null:JSON.stringify(S);
  f(b,e);
  try{ afterAction(); }catch(err){}
  if(before!=null){ const after=JSON.stringify(S); if(after!==before){ undoStack.push(before); if(undoStack.length>8) undoStack.shift(); if($('#sheet').hidden) render(); } }
});
document.addEventListener('change',e=>{

/* ================= Geradores de problemas (Exatas) ================= */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const one=a=>a[Math.floor(Math.random()*a.length)];
function nf(n){ return (Math.round(n*100)/100).toLocaleString('pt-BR',{maximumFractionDigits:2}); }
function sup(n){ const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c=>m[c]||c).join(''); }
function sgn(b){ return b<0?'− '+Math.abs(b):'+ '+b; }
function numOpts(ans,unit,cands){
  const out=[ans], seen=new Set([Math.round(ans*100)/100]);
  const base=(cands||[]).concat([ans*2,ans/2,ans+(Math.abs(ans)>=10?Math.round(Math.abs(ans)*0.1):1),ans-(Math.abs(ans)>=10?Math.round(Math.abs(ans)*0.1):1),ans*10,ans/10,ans+2,ans-2,ans*3]);
  for(const c of base){ if(out.length>=4) break; if(!isFinite(c)) continue; const v=Math.round(c*100)/100; if(seen.has(v)) continue; if(ans>0&&v<=0) continue; seen.add(v); out.push(v); }
  let g=0; while(out.length<4&&g<50){ g++; const v=Math.round((ans+ri(1,9)*(Math.random()<.5?-1:1))*100)/100; if(!seen.has(v)&&!(ans>0&&v<=0)){ seen.add(v); out.push(v); } }
  const sh=shuffle(out); return {opts:sh.map(v=>nf(v)+(unit?' '+unit:'')),right:sh.indexOf(ans)};
}
function strOpts(ans,ds){ const u=[...new Set(ds.filter(d=>d!==ans))].slice(0,3); const sh=shuffle([ans].concat(u)); return {opts:sh,right:sh.indexOf(ans)}; }
const GEN={
  frac(){ const d=one([2,3,4,5,8,10]), n=ri(1,d-1), tot=d*ri(2,12)*one([1,2,5]), a=tot*n/d;
    return {t:'mat-ops',q:'Quanto é '+n+'/'+d+' de '+tot+'?',...numOpts(a,'',[tot/d,tot*n,a+tot/d]),steps:['Divida pelo denominador: '+tot+' ÷ '+d+' = '+nf(tot/d),'Multiplique pelo numerador: '+nf(tot/d)+' × '+n+' = '+nf(a)]}; },
  pot(){ const b=one([2,3,5,10]), x=ri(1,3), y=ri(1,3), a=Math.pow(b,x+y);
    return {t:'mat-ops',q:'Calcule '+b+sup(x)+' × '+b+sup(y)+'.',...numOpts(a,'',[Math.pow(b,x*y),b*(x+y),Math.pow(b,x)+Math.pow(b,y)]),steps:['Mesma base, multiplicação: some os expoentes → '+b+sup(x+y),b+sup(x+y)+' = '+nf(a)]}; },
  notc(){ const m=ri(11,99)/10, e=one([-5,-4,-3,-2,3,4,5,6]); const val=Number((m*Math.pow(10,e)).toPrecision(2)); const dec=val.toLocaleString('pt-BR',{maximumFractionDigits:10});
    const f=(mm,ee)=>nf(mm)+' × 10'+sup(ee); const ans=f(m,e);
    return {t:'fis-unid',q:'Escreva '+dec+' em notação científica.',...strOpts(ans,[f(m,e+1),f(m,e-1),f(m*10,e-1),f(m,-e)]),steps:['Notação científica: um número entre 1 e 10 vezes uma potência de 10.','Ande com a vírgula até ficar '+nf(m)+': foram '+Math.abs(e)+' casas '+(e<0?'para a direita (expoente negativo)':'para a esquerda (expoente positivo)')+'.','Resposta: '+ans]}; },
  r3(){ if(Math.random()<.5){ const k=ri(2,9), a=ri(2,8), b=a+ri(1,6), pa=k*a, ans=k*b;
      return {t:'mat-prop',q:a+' kg de um produto custam R$ '+pa+'. Quanto custam '+b+' kg?',...numOpts(ans,'',[pa*a/b,pa+b,ans+k]),steps:['Grandezas diretamente proporcionais: mais quilos, mais caro.','Preço de 1 kg: '+pa+' ÷ '+a+' = '+k,b+' kg: '+b+' × '+k+' = R$ '+ans]}; }
    const [n1,h1,n2,h2]=one([[2,6,3,4],[3,8,4,6],[4,6,6,4],[6,4,8,3],[5,12,6,10],[4,9,6,6],[3,10,5,6],[2,9,6,3]]);
    return {t:'mat-prop',q:n1+' bombeiros fazem um rescaldo em '+h1+' h. Em quanto tempo '+n2+' bombeiros fariam o mesmo serviço, no mesmo ritmo?',...numOpts(h2,'h',[h1*n2/n1,h1+n2-n1,h1-1]),steps:['Grandezas inversamente proporcionais: mais gente, menos tempo.','Trabalho total: '+n1+' × '+h1+' = '+(n1*h1)+' bombeiro-horas',(n1*h1)+' ÷ '+n2+' = '+h2+' h']}; },
  porc(){ const k=ri(0,3);
    if(k===0){ const p=one([5,10,12,15,20,25,30,40,75]), v=one([80,120,160,200,240,300,400,500,600,800]), a=v*p/100;
      return {t:'mat-porc',q:'Quanto é '+p+'% de '+v+'?',...numOpts(a,'',[v/p,a*10,a*2]),steps:[p+'% = '+p+'/100',v+' × '+p+' ÷ 100 = '+nf(a)]}; }
    if(k===1||k===2){ const p=one([10,15,20,25,30]), v=one([100,200,250,400,500,800,1000]), up=k===1, a=v*(1+(up?1:-1)*p/100);
      return {t:'mat-porc',q:'Um equipamento custava R$ '+nf(v)+' e teve '+(up?'aumento':'desconto')+' de '+p+'%. Qual o novo preço?',...numOpts(a,'',[v*p/100,v*(1+(up?-1:1)*p/100),v+(up?p:-p)]),steps:[(up?'Aumento':'Desconto')+' de '+p+'% → multiplique por '+nf(1+(up?1:-1)*p/100),nf(v)+' × '+nf(1+(up?1:-1)*p/100)+' = R$ '+nf(a)]}; }
    const C=one([500,1000,2000,5000]), i=one([1,2,3,5]), t=ri(2,12), J=C*i*t/100;
    return {t:'mat-porc',q:'Qual o juro simples de R$ '+nf(C)+' a '+i+'% ao mês durante '+t+' meses?',...numOpts(J,'',[C*i/100,J+C,C*i*t/10]),steps:['Juros simples: J = C · i · t','J = '+nf(C)+' × '+i+'/100 × '+t+' = R$ '+nf(J)]}; },
  eq1(){ const x=ri(-6,12), a=one([2,3,4,5,6,7]), b=ri(-15,20)||3, c=a*x+b;
    return {t:'mat-eq',q:'Resolva: '+a+'x '+sgn(b)+' = '+c,...numOpts(x,'',[(c+b)/a,c-b,-x]),steps:['Passe o '+b+' para o outro lado trocando o sinal: '+a+'x = '+c+' '+sgn(-b)+' = '+(c-b),'Divida por '+a+': x = '+(c-b)+' ÷ '+a+' = '+x]}; },
  eq2(){ let r1=ri(-5,6), r2=ri(-5,6); if(r1===r2) r2=r1+2; const S=r1+r2, P=r1*r2; const eq='x² '+(S===0?'':(S>0?'− '+S+'x ':'+ '+(-S)+'x '))+(P===0?'':sgn(P)+' ')+'= 0'; const k=ri(0,2);
    if(k===0) return {t:'mat-eq',q:'Qual a soma das raízes de '+eq+'?',...numOpts(S,'',[-S,P,S+1]),steps:['Soma das raízes = −b/a','−('+(-S)+')/1 = '+S]};
    if(k===1) return {t:'mat-eq',q:'Qual o produto das raízes de '+eq+'?',...numOpts(P,'',[-P,S,P+1]),steps:['Produto das raízes = c/a',P+'/1 = '+P]};
    const M=Math.max(r1,r2); return {t:'mat-eq',q:'Qual a maior raiz de '+eq+'?',...numOpts(M,'',[Math.min(r1,r2),-M,S]),steps:['Procure dois números com soma '+S+' e produto '+P+': '+r1+' e '+r2,'Maior raiz: '+M]}; },
  fun(){ if(Math.random()<.6){ const a=one([-3,-2,2,3,4,5]), b=ri(-8,8), k=ri(-4,6), v=a*k+b;
      return {t:'mat-fun',q:'Se f(x) = '+a+'x '+sgn(b)+', quanto vale f('+k+')?',...numOpts(v,'',[a*k-b,a+k+b,-v]),steps:['Troque x por '+k+': f('+k+') = '+a+' · ('+k+') '+sgn(b),'= '+(a*k)+' '+sgn(b)+' = '+v]}; }
    const h=ri(-4,5), c=ri(-6,8), b=-2*h; return {t:'mat-fun',q:'Qual o x do vértice de f(x) = x² '+(b===0?'':sgn(b)+'x ')+sgn(c)+'?',...numOpts(h,'',[-h,b,h+1]),steps:['x do vértice = −b/(2a)','−('+b+')/(2 · 1) = '+h]}; },
  pa(){ const a1=ri(1,20), r=ri(2,9), n=ri(5,15), an=a1+(n-1)*r;
    if(Math.random()<.5) return {t:'mat-pa',q:'Numa PA, a₁ = '+a1+' e a razão é '+r+'. Qual o '+n+'º termo?',...numOpts(an,'',[a1+n*r,a1*n,an+r]),steps:['aₙ = a₁ + (n − 1) · r',a1+' + '+(n-1)+' · '+r+' = '+an]};
    const Sn=n*(a1+an)/2; return {t:'mat-pa',q:'Qual a soma dos '+n+' primeiros termos da PA com a₁ = '+a1+' e aₙ = '+an+'?',...numOpts(Sn,'',[(a1+an)*n,Sn+an,a1*n]),steps:['Sₙ = n · (a₁ + aₙ) / 2',n+' · ('+a1+' + '+an+') / 2 = '+nf(Sn)]}; },
  pg(){ const a1=one([1,2,3,5]), q=one([2,3]), n=ri(3,6), an=a1*Math.pow(q,n-1);
    return {t:'mat-pa',q:'Numa PG, a₁ = '+a1+' e a razão é '+q+'. Qual o '+n+'º termo?',...numOpts(an,'',[a1*Math.pow(q,n),a1+(n-1)*q,an/q]),steps:['aₙ = a₁ · q'+sup('n−1').replace('n','ⁿ'),a1+' · '+q+sup(n-1)+' = '+an]}; },
  log(){ const k=ri(0,2);
    if(k===0){ const e=ri(-2,5); return {t:'mat-exp',q:'Quanto vale log '+(Math.pow(10,e)).toLocaleString('pt-BR',{maximumFractionDigits:5})+'? (base 10)',...numOpts(e,'',[e+1,-e,e*10]),steps:['log de 10 elevado a n é n (base 10).','O número é 10'+sup(e)+' → log = '+e]}; }
    const b=one([2,3]), x=ri(2,6), v=Math.pow(b,x);
    return {t:'mat-exp',q:'Resolva: '+b+'ˣ = '+v,...numOpts(x,'',[v/b,x+1,x-1]),steps:['Escreva '+v+' como potência de '+b+': '+b+sup(x),'Bases iguais → expoentes iguais: x = '+x]}; },
  area(){ const k=ri(0,3);
    if(k===0){ const b=ri(3,20), h=ri(2,15); return {t:'mat-gp',q:'Área de um retângulo de '+b+' m por '+h+' m?',...numOpts(b*h,'m²',[2*(b+h),b+h,b*h/2]),steps:['A = base × altura',b+' × '+h+' = '+(b*h)+' m²']}; }
    if(k===1){ const b=ri(2,10)*2, h=ri(3,14); return {t:'mat-gp',q:'Área de um triângulo de base '+b+' m e altura '+h+' m?',...numOpts(b*h/2,'m²',[b*h,b+h,b*h/4]),steps:['A = (base × altura) / 2','('+b+' × '+h+') / 2 = '+(b*h/2)+' m²']}; }
    if(k===2){ const r=ri(1,10); return {t:'mat-gp',q:'Área de um círculo de raio '+r+' m? (use π = 3)',...numOpts(3*r*r,'m²',[2*3*r,3*r,9*r*r]),steps:['A = π · r²','3 × '+r+'² = 3 × '+(r*r)+' = '+(3*r*r)+' m²']}; }
    const [a,b,c]=one([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20]]); return {t:'mat-gp',q:'Triângulo retângulo com catetos '+a+' e '+b+'. Quanto mede a hipotenusa?',...numOpts(c,'',[a+b,c+1,Math.round((a*a+b*b)/2)]),steps:['Pitágoras: a² = b² + c²',a+'² + '+b+'² = '+(a*a)+' + '+(b*b)+' = '+(c*c),'√'+(c*c)+' = '+c]}; },
  vol(){ const k=ri(0,2);
    if(k===0){ const a=ri(2,9); return {t:'mat-ge',q:'Volume de um cubo de aresta '+a+' m?',...numOpts(a*a*a,'m³',[a*a*6,a*3,a*a]),steps:['V = a³',a+'³ = '+(a*a*a)+' m³']}; }
    if(k===1){ const a=ri(2,8), b=ri(2,8), c=ri(2,6); return {t:'mat-ge',q:'Volume de uma caixa d\u2019água de '+a+' m × '+b+' m × '+c+' m?',...numOpts(a*b*c,'m³',[a+b+c,2*(a*b+a*c+b*c),a*b]),steps:['V = comprimento × largura × altura',a+' × '+b+' × '+c+' = '+(a*b*c)+' m³','Lembre: 1 m³ = 1.000 litros.']}; }
    const r=ri(1,5), h=ri(2,10); return {t:'mat-ge',q:'Volume de um cilindro de raio '+r+' m e altura '+h+' m? (π = 3)',...numOpts(3*r*r*h,'m³',[3*r*h,2*3*r*h,3*r*r]),steps:['V = π · r² · h','3 × '+(r*r)+' × '+h+' = '+(3*r*r*h)+' m³']}; },
  media(){ if(Math.random()<.5){ const m=ri(5,15), d=shuffle([-3,-1,0,1,3]), xs=d.map(x=>m+x*ri(1,2)); const s=xs.reduce((a,b)=>a+b,0), mean=s/5;
      return {t:'mat-est',q:'Média aritmética de '+xs.join(', ')+'?',...numOpts(mean,'',[s,mean+1,xs.slice().sort((a,b)=>a-b)[2]+2]),steps:['Some: '+xs.join(' + ')+' = '+s,'Divida por 5: '+s+' ÷ 5 = '+nf(mean)]}; }
    const xs=Array.from({length:5},()=>ri(1,30)); const so=xs.slice().sort((a,b)=>a-b);
    return {t:'mat-est',q:'Mediana de '+xs.join(', ')+'?',...numOpts(so[2],'',[xs[2],so[1],so[3]]),steps:['Ordene: '+so.join(', '),'Termo do meio: '+so[2]]}; },
  comb(){ const k=ri(0,2);

  o:['subordinada substantiva subjetiva','subordinada substantiva objetiva direta','subordinada adjetiva restritiva','subordinada adverbial condicional','coordenada aditiva'],
  r:0,x:'A oração "que os candidatos cheguem no horário" funciona como sujeito de "é importante", caracterizando uma subordinada substantiva subjetiva.'},
 {q:'Em "O edital, que ainda não foi publicado, deve sair em breve.", a oração destacada é',
  o:['subordinada adjetiva restritiva','subordinada adjetiva explicativa','subordinada substantiva apositiva','subordinada adverbial temporal','subordinada substantiva completiva nominal'],
  r:1,x:'Isolada por vírgulas e acrescentando uma informação extra sobre "o edital" (não restringindo o universo do termo), trata-se de uma oração subordinada adjetiva explicativa.'},
 {q:'Assinale a alternativa em que o termo destacado exerce a função de objeto indireto.',
  o:['O comandante elogiou o novo recruta.','Precisamos de mais equipamentos.','A vítima foi socorrida rapidamente.','Ele é o responsável pelo setor.','Chegamos ao local do incêndio.'],
  r:1,x:'"Precisar" é verbo transitivo indireto (pede a preposição "de"); "de mais equipamentos" é o objeto indireto. As demais funções são: objeto direto (A), sujeito paciente/agente da passiva (C), predicativo (D) e adjunto adverbial de lugar (E).'},
 {q:'Em "Estudou bastante, mas não foi aprovado.", o período é classificado como',
  o:['composto por subordinação','composto por coordenação','simples com predicado verbal','composto por coordenação e subordinação','simples com predicado nominal'],
  r:1,x:'As duas orações são independentes entre si e estão ligadas pela conjunção coordenativa adversativa "mas", caracterizando período composto por coordenação.'},
 {q:'Em "Estudem bastante para a prova.", o sujeito da oração é classificado como',
  o:['sujeito simples','sujeito composto','sujeito oculto (elíptico)','sujeito indeterminado','oração sem sujeito'],
  r:2,x:'O verbo "estudem" está na 2ª pessoa do plural sem um pronome explícito, mas o sujeito ("vocês") pode ser identificado pela desinência verbal: trata-se de sujeito oculto (também chamado elíptico ou desinencial).'}
]},

'port-pont':{qs:[
 {q:'Assinale a alternativa em que a pontuação está de acordo com a norma-padrão.',
  o:['Os bombeiros, chegaram rapidamente ao local.','Durante o plantão, três ocorrências foram registradas.','O comandante, informou a todos sobre a mudança.','Concluída a vistoria os agentes seguiram viagem.','O relatório é longo, mas, completo.'],
  r:1,x:'O adjunto adverbial deslocado para o início da frase ("Durante o plantão") pode e costuma ser seguido de vírgula. Nas demais, a vírgula separa indevidamente sujeito e verbo (A e C) ou falta pontuação após oração reduzida deslocada (D) ou há uma vírgula indevida antes de "completo" (E).'},
 {q:'Assinale a alternativa em que a vírgula foi empregada corretamente para isolar o aposto.',
  o:['Curitiba, capital do Paraná, fica no planalto.','O relatório, foi entregue no prazo.','Todos os candidatos, chegaram cedo.','A prova terá, setenta questões objetivas.','O comandante avisou, que haveria mudanças.'],
  r:0,x:'"Capital do Paraná" é aposto explicativo de "Curitiba" e deve vir isolado por vírgulas. As demais alternativas separam indevidamente sujeito e verbo, ou verbo e complemento.'},
 {q:'Assinale a alternativa correta quanto ao uso do ponto e vírgula.',
  o:['Levou o capacete; e as luvas para o treino.','Na guarnição havia: um motorista, um socorrista; e um comandante.','No treino, os recrutas correram; nadaram; e praticaram primeiros socorros.','Na sala havia recrutas atentos; na sala ao lado, instrutores concentrados.','Ele chegou; cedo ao quartel.'],
  r:3,x:'O ponto e vírgula é adequado para separar orações coordenadas mais longas ou com sentido próprio, especialmente quando já há vírgulas internas, como em "Na sala havia recrutas atentos; na sala ao lado, instrutores concentrados." As demais empregam o ponto e vírgula de forma indevida, no lugar de vírgula simples ou sem função sintática clara.'},
 {q:'Assinale a alternativa em que os dois-pontos foram empregados corretamente.',
  o:['Ele chegou: atrasado ao plantão.','Ele disse: que chegaria atrasado.','O motivo foi: o trânsito intenso.','Faltou apenas uma coisa: coragem.','Chegamos: cedo ao local.'],
  r:3,x:'Os dois-pontos anunciam corretamente um esclarecimento final em "Faltou apenas uma coisa: coragem." Nas demais, os dois-pontos rompem indevidamente a ligação entre verbo e complemento ou antecedem uma oração subordinada sem valor de citação direta.'},

 
 {q:'Assinale a alternativa em que a ausência de vírgula compromete a norma-padrão.',
  o:['Se chover, a operação será adiada.','Quando o alarme tocou todos saíram.','Concluído o curso, os alunos seguiram para o batalhão.','Estudou muito e, por isso, foi bem na prova.','Embora estivesse cansado, continuou o plantão.'],
  r:1,x:'Orações subordinadas deslocadas para o início do período devem vir separadas por vírgula da oração principal. Em "Quando o alarme tocou todos saíram", falta a vírgula depois de "tocou": o correto é "Quando o alarme tocou, todos saíram." As demais alternativas já estão pontuadas corretamente.'}
]},

'port-int':{qs:[
 {q:'Texto: "O treinamento de resgate em altura exige, além de equipamento adequado, disciplina rigorosa: um único descuido pode custar caro à guarnição inteira." Assinale a ideia central do trecho.',
  o:['O equipamento é mais importante que a disciplina no resgate em altura.','A disciplina, tanto quanto o equipamento, é essencial para a segurança no resgate em altura.','O resgate em altura não pode ser realizado com segurança.','Apenas descuidos individuais causam acidentes em resgates.','O treinamento de resgate em altura é dispensável quando há bom equipamento.'],
  r:1,x:'O texto afirma que o treinamento exige equipamento adequado "além de" disciplina rigorosa, colocando as duas condições como necessárias, sem hierarquizar uma acima da outra.'},
 {q:'Texto: "Nem sempre a ocorrência mais grave é a que chega primeiro ao rádio. Por isso, a triagem de chamados é tão decisiva quanto o combate ao incêndio em si." A relação estabelecida pela expressão "Por isso" é de',
  o:['comparação','conclusão/consequência','concessão','condição','finalidade'],
  r:1,x:'"Por isso" introduz uma consequência lógica da ideia anterior, estabelecendo uma relação de conclusão/consequência entre as duas orações.'},
 {q:'Texto: "Embora o número de chamadas tenha caído em relação ao ano anterior, a gravidade média das ocorrências aumentou." Depreende-se do texto que',
  o:['houve mais chamadas e mais ocorrências graves.','houve menos chamadas, mas as ocorrências ficaram mais graves em média.','o número de chamadas e a gravidade caíram juntos.','a gravidade das ocorrências não pode ser medida.','o texto não permite nenhuma conclusão sobre gravidade.'],
  r:1,x:'A conjunção concessiva "embora" contrapõe a queda no número de chamadas ao aumento da gravidade média, exatamente o que a alternativa B expressa.'},
 {q:'Texto: "Mais importante do que memorizar o manual é entender por que cada procedimento existe." A palavra "por que" está empregada, nesse contexto, com o sentido de',
  o:['tempo','pelo qual (motivo)','lugar','condição','quantidade'],
  r:1,x:'"Por que" antes de substantivo abstrato como "existe" tem valor de "por qual motivo/razão", introduzindo uma causa.'},
 {q:'Texto: "O comandante insistiu: revisar o equipamento antes de cada plantão não é burocracia, é sobrevivência." O efeito de sentido da frase final é de',
  o:['dúvida sobre a necessidade da revisão','ênfase na importância vital da revisão do equipamento','crítica à existência de regras burocráticas','indiferença quanto ao procedimento','ironia sobre o comandante'],
  r:1,x:'Ao contrapor "burocracia" a "sobrevivência", o texto reforça, de forma enfática, que a revisão do equipamento é uma questão de vida ou morte, e não uma formalidade.'}
]},

const TESTE80_TOPICOS = Object.keys(TESTE80);

function openTeste80(tid){
  const set=TESTE80[tid]; if(!set) return;
  const qs=set.qs.map(q=>{ const ord=shuffle([0,1,2,3,4]); return {q:q.q,opts:ord.map(i=>q.o[i]),right:ord.indexOf(q.r),x:q.x}; });
  clearModes(); tutor.t80={t:tid,qs,ans:qs.map(()=>null),start:Date.now(),done:false};
  goTreino();
}
function t80Rec(tid){ return (S.t80||{})[tid]||null; }
function viewT80(){
  const M=tutor.t80, info=topicInfo(M.t);
  let h='<h2>Teste 80/20: '+esc(info?info.t.nome:'')+'</h2>';
  if(!M.done){
    h+='<p class="small muted">5 questões clássicas deste tópico, sem gabarito até o fim — como numa prova de verdade. Acerte pelo menos 4 de 5 (80%) para conquistar o selo.</p>';
    M.qs.forEach((q,i)=>{ h+='<div class="q"><p class="qn">'+(i+1)+'. '+fmtText(q.q)+'</p>'+q.opts.map((o,j)=>'<button class="alt'+(M.ans[i]===j?' chosen':'')+'" data-a="t80Ans" data-i="'+i+'" data-j="'+j+'">'+'ABCDE'[j]+') '+esc(o)+'</button>').join('')+'</div>'; });
    const answered=M.ans.filter(x=>x!=null).length;
    h+='<div class="row" style="margin-top:14px"><button class="btn primary block" data-a="t80Finish">'+(answered<M.qs.length?'Corrigir mesmo com '+(M.qs.length-answered)+' em branco':'Corrigir teste')+'</button></div>';
    return h+'<p style="margin-top:12px"><button class="linkbtn" data-a="closeT80">Sair</button></p>';
  }
  const pct=M.ok/M.qs.length, passed=pct>=0.8;
  h+='<div class="gend"><div class="gscore pop '+accCls(pct)+'">'+M.ok+'/'+M.qs.length+'</div><p>'+(passed?'<strong class="m4">Selo 80/20 conquistado.</strong> Você domina os padrões mais recorrentes deste tópico.':'Ainda não chegou a 80%. Reveja as explicações abaixo e tente de novo mais tarde.')+'</p></div>';
  M.qs.forEach((q,i)=>{ const a=M.ans[i], ok=a===q.right;
    h+='<div class="q"><div class="qn">'+(i+1)+'. '+fmtText(q.q)+'</div><p class="small" style="margin-top:6px"><b class="'+(ok?'m4':'m0')+'">'+(ok?'Certa':(a==null?'Em branco':'Errada'))+'</b>'+(ok?'':'. Correta: '+esc(q.opts[q.right])+(a!=null?'. Você marcou: '+esc(q.opts[a]):''))+'</p><p class="small muted">'+esc(q.x)+'</p>';
    h+=exBtn('t80-'+M.t+'-'+i,{subj:SUBJ[topicInfo(M.t).s.id].nome,q:q.q,opts:q.opts,right:q.right,pick:a,x:q.x});
    h+='</div>'; });
  h+='<div class="stack" style="margin-top:14px"><button class="btn primary block" data-a="t80Retry">Fazer de novo</button><button class="btn ghost block" data-a="closeT80">Voltar</button></div>';
  return h;
}
function finishTeste80(){
  const M=tutor.t80; if(M.done) return; M.done=true;
  let ok=0; M.qs.forEach((q,i)=>{ if(M.ans[i]===q.right) ok++; }); M.ok=ok;
  const pct=ok/M.qs.length;
  S.t80=S.t80||{}; const rec=S.t80[M.t]||(S.t80[M.t]={tries:0,best:0,passed:false});
  rec.tries++; rec.best=Math.max(rec.best,pct);
  const justPassed=pct>=0.8&&!rec.passed; if(pct>=0.8) rec.passed=true;
  addEv(M.t,'teste80',M.qs.length,ok);
  if(justPassed) SND.level(); else if(pct<0.8) SND.bad();
  commit();
}
function sheetTeste80(){
  const bySubj={}; TESTE80_TOPICOS.forEach(tid=>{ const info=topicInfo(tid); if(!info) return; (bySubj[info.s.id]=bySubj[info.s.id]||[]).push(tid); });
  let passed=0,total=0;
  let body='';
  Object.keys(bySubj).forEach(sid=>{
    body+='<h3 style="margin-top:16px">'+esc(SUBJ[sid].nome)+'</h3><ul class="list">';
    bySubj[sid].forEach(tid=>{ total++; const info=topicInfo(tid), rec=t80Rec(tid); if(rec&&rec.passed) passed++;
      const status=rec?(rec.passed?'Selo conquistado':'Tentado, melhor: '+Math.round(rec.best*100)+'%'):'Ainda não tentado';
      body+='<li class="deck"><div class="deck-hd"><span class="fc-count insignia'+(rec&&rec.passed?'':' due')+'" style="'+(rec&&rec.passed?'background:var(--m4);color:var(--on-green)':'')+'">'+(rec&&rec.passed?CHECK_SVG:'?')+'</span><span><span class="nm">'+esc(info.t.nome)+'</span><br><span class="small muted">'+status+'</span></span></div><div class="deck-acts"><button class="btn'+(rec&&rec.passed?' ghost':' primary')+'" data-a="t80Open" data-t="'+tid+'">'+(rec?'Refazer':'Fazer teste')+'</button></div></li>'; });
    body+='</ul>';
  });
  const h='<h2 id="sheetTitle">Teste 80/20</h2><p class="small muted">Para cada tópico, 5 questões no estilo dos padrões que mais se repetem em concursos — o "20% de esforço" que cobre "80% do que cai". Acertar 4 de 5 conquista o selo. Por enquanto vale para Português, Matemática, Física e Química; as outras matérias entram depois.</p><p class="okbox">Selos conquistados: '+passed+' de '+total+'.</p>'+body;
  openSheet(h);
}

const _SND_EXTRA=(function(){
  let ctx=null;
  function ac(){ try{ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); return ctx; }catch(e){ return null; } }
  function tone(freq,t0,dur,type,gain){ const c=ac(); if(!c) return; try{ const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,c.currentTime+t0);
    g.gain.setValueAtTime(0.0001,c.currentTime+t0); g.gain.linearRampToValueAtTime(gain||0.09,c.currentTime+t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t0+dur);
    o.connect(g); g.connect(c.destination); o.start(c.currentTime+t0); o.stop(c.currentTime+t0+dur+0.03); }catch(e){} }
  return {tone};
})();

SND.gameOver=function(){ if(!SND.enabled()) return; [392,349,311,262].forEach((f,i)=>_SND_EXTRA.tone(f,i*0.11,0.16,'sawtooth',0.05)); };
SND.flawless=function(){ if(!SND.enabled()) return; [523,659,784,1047].forEach((f,i)=>_SND_EXTRA.tone(f,i*0.075,0.16,'triangle',0.08)); };

function openPTable(){
  clearModes(); gSeq++;
  const order=shuffle(PT_CLUES.map((_,i)=>i)).slice(0,10);
  tutor.ptab={sid:gSeq,order,pos:0,sel:null,tries:0,errs:0,ok:0,start:Date.now(),done:false};
  goTreino();
}
function ptableGrid(sel,bad){
  const cells={};
  PTABLE.forEach(e=>{ cells[e.per+'-'+e.grp]=e; });
  let h='<div class="ptgrid">';
  for(let per=1;per<=3;per++){
    for(let grp=1;grp<=18;grp++){
      const e=cells[per+'-'+grp];
      if(!e){ h+='<span class="ptcell empty"></span>'; continue; }
      let c='ptcell'; if(bad===e.sym) c+=' bad'; else if(sel===e.sym) c+=' good';
      h+='<button class="'+c+'" data-a="ptPick" data-sym="'+e.sym+'">'+e.sym+'</button>';
    }
  }
  return h+'</div>';
}
function viewPTable(){
  const G=tutor.ptab;
  let h='<div class="ghead"><span class="small muted">Química</span><h2 style="margin:4px 0 0">Tabela Periódica: ache o elemento</h2></div>';
  if(G.done){
    const p=G.order.length?Math.round(100*G.ok/G.order.length):0;
    return h+'<div class="gend"><div class="gscore pop '+accCls(G.order.length?G.ok/G.order.length:0)+'">'+p+'%</div><p>'+G.ok+' de '+G.order.length+' certos, '+G.tries+' toques.</p></div><div class="stack" style="margin-top:14px"><button class="btn block" data-a="ptAgain">Jogar de novo</button><button class="btn ghost block" data-a="ptClose">Voltar</button></div>';

  h+='<div class="gbar"><span>'+(G.pos+1)+' / '+G.order.length+'</span><span class="small muted">Erros: '+G.errs+'</span></div><div class="bar"><i style="width:'+Math.round(100*G.pos/G.order.length)+'%"></i></div>';

  return h+'<p style="margin-top:14px"><button class="linkbtn" data-a="ptClose">Sair</button></p>';
}

const HALF=45;
const SRCW={q:[0.6,1,1.4,1.4],sim:1.2,game:0.5,card:0.35,teste80:1.3};
const CEIL=[0.55,0.75,0.9,1];
function dayNum(k){ return Math.round(dateOf(k).getTime()/86400000); }
function addEv(t,src,n,ok,lv){
  if(!t||!n||!topicInfo(t)) return;
  S.mst=S.mst||{};

function wpick(pool){ const tot=pool.reduce((a,p)=>a+p.w,0); let r=Math.random()*tot; for(const p of pool){ r-=p.w; if(r<=0) return p; } return pool[pool.length-1]; }

    if(Math.random()<.5){ const it=one(CLOZE_HIST); const opts=shuffle(it.o.slice()); return {q:it.t.replace('___','_____'),opts,right:opts.indexOf(it.o[it.r]),x:'',t:histTag(it.t),s:'hist'}; }

  }
  const gs=GAMES.filter(g=>g.s===s.id&&g.type!=='legacy'&&g.type!=='order'); if(!gs.length) return null;
  const def=one(gs); const r=def.type==='calc'?calcRound(def):buildRound(def,one(gItemsIdx(def,4)));
  let opts=r.opts, right=r.right;
  if(opts.length>5){ const sel=shuffle([right].concat(shuffle(opts.map((_,k)=>k).filter(k=>k!==right)).slice(0,3))); opts=sel.map(k=>r.opts[k]); right=sel.indexOf(r.right); }
  const q=def.type==='calc'?r.q:(def.type==='tf'?'**Verdadeiro ou falso?**\n'+r.q:'**'+def.title+'**\n'+r.q);
  return {q,opts,right,x:r.x||'',steps:r.steps,t:r.t,s:s.id};

function buildOffline(mode,sid,n){
  const subs=SUBJECTS.filter(s=>(!sid||s.id===sid)&&(s.id==='hist'||GAMES.some(g=>g.s===s.id&&g.type!=='legacy'&&g.type!=='order')));
  const pool=subs.map(s=>({s,w:s.q*(mode==='fraq'?Math.pow(1.1-subjMastery(s.id),2):1)}));
  const qs=[]; let g=0;
  while(qs.length<n&&g<n*8){ g++; const q=offlineQuestion(wpick(pool).s); if(q&&!qs.some(x=>x.q===q.q)) qs.push(q); }
  return qs;
}
function simTopicPool(mode,sid){

  ['rf10','Trabalhando os erros','Refez 10 erros no caderno.',()=>Object.values(S.days).reduce((a,d)=>a+(d.rf||0),0)>=10],
  ['cons10','Dez erros vencidos','Consolidou 10 erros.',()=>S.erros.filter(e=>e.done).length>=10]
);
markVisit();
if(window.__TEST__) window.__app={tutor,get S(){return S},today,statsRange,commit,getVG:()=>viewGame,getVG0:()=>_viewGame0};

render(); drawGTBar(); initRemote();
})();
</script>
