<meta charset="utf-8">
<title>Plano Cadete CBMPR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE; --bg-glow:#ECE5FA; --surface:#FFFFFF; --raised:#FFFFFF; --sunk:#EFECE3; --ink:#15201E; --muted:#5D6966; --line:#E7E3D9; --line-2:#D6D1C3;
  --pri:#7C3AED; --pri-2:#6D28D9; --pri-3:#8B5CF6; --on-pri:#FFFFFF; --pri-soft:#F2ECFE; --pri-glow:rgba(124,58,237,.34);
  --cta:#7C3AED; --cta-a:#8B5CF6; --cta-b:#6D28D9; --on-cta:#FFFFFF;
  --forest:#1C3F3A; --forest-2:#2B5A53; --on-forest:#F4F1E6; --forest-mute:rgba(244,241,230,.74); --forest-acc:#C4B5FD;
  --beige:#EBE8D8;
  --red:#D92D20; --red-2:#B42318; --on-red:#FFFFFF; --red-soft:#FDECEA;
  --green:#067A55; --green-2:#10B981; --on-green:#FFFFFF; --green-soft:#DDF4EA;
  --amber:#8A5A00; --amber-soft:#FBEFD2; --gold:#B7791F; --gold-soft:#FBF0D5; --star:#F5A524;
  --fire:#F0612A; --focus:#7C3AED; --focus-soft:#F2ECFE;
  --m0:#D92D20; --m1:#D9661A; --m2:#A87D00; --m3:#0F857A; --m4:#067A55;
  --nav-h:64px; --r:18px; --r-sm:12px; --r-lg:26px;
  --sh1:0 1px 2px rgba(21,32,30,.04),0 2px 8px rgba(21,32,30,.05);
  --sh2:0 2px 4px rgba(21,32,30,.04),0 10px 26px rgba(21,32,30,.09);
  --sh3:0 6px 12px rgba(21,32,30,.06),0 22px 48px rgba(21,32,30,.16);
  --ease:cubic-bezier(.4,0,.2,1); --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --cond:var(--body); --mono:var(--body);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1311; --bg-glow:#1B1830; --surface:#131C1A; --raised:#18231F; --sunk:#0A0F0E; --ink:#EDF2EE; --muted:#9BA9A4; --line:#22302C; --line-2:#31423D;
    --pri:#A78BFA; --pri-2:#C4B5FD; --pri-3:#B69DFB; --on-pri:#170A33; --pri-soft:#241B3F; --pri-glow:rgba(167,139,250,.35);
    --forest:#1C443D; --forest-2:#27584F; --on-forest:#F4F1E6; --forest-mute:rgba(244,241,230,.74); --forest-acc:#C4B5FD;
    --beige:#2A2A22;
    --red:#FF6B5E; --red-2:#FF8A80; --on-red:#1A0605; --red-soft:#3A1917;
    --green:#34D399; --green-2:#34D399; --on-green:#04241A; --green-soft:#0F2F24;
    --amber:#FBBF24; --amber-soft:#3A2E0E; --gold:#FBBF24; --gold-soft:#3A2E0E; --star:#FBBF24;
    --fire:#FF8A3D; --focus:#A78BFA; --focus-soft:#241B3F;
    --m0:#FF6B5E; --m1:#FF9D4D; --m2:#E8C34A; --m3:#4FD1C0; --m4:#34D399;
    --sh1:0 1px 2px rgba(0,0,0,.45); --sh2:0 2px 4px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.35); --sh3:0 8px 16px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1311; --bg-glow:#1B1830; --surface:#131C1A; --raised:#18231F; --sunk:#0A0F0E; --ink:#EDF2EE; --muted:#9BA9A4; --line:#22302C; --line-2:#31423D;
  --pri:#A78BFA; --pri-2:#C4B5FD; --pri-3:#B69DFB; --on-pri:#170A33; --pri-soft:#241B3F; --pri-glow:rgba(167,139,250,.35);
  --forest:#1C443D; --forest-2:#27584F; --on-forest:#F4F1E6; --forest-mute:rgba(244,241,230,.74); --forest-acc:#C4B5FD;
  --beige:#2A2A22;
  --red:#FF6B5E; --red-2:#FF8A80; --on-red:#1A0605; --red-soft:#3A1917;
  --green:#34D399; --green-2:#34D399; --on-green:#04241A; --green-soft:#0F2F24;
  --amber:#FBBF24; --amber-soft:#3A2E0E; --gold:#FBBF24; --gold-soft:#3A2E0E; --star:#FBBF24;
  --fire:#FF8A3D; --focus:#A78BFA; --focus-soft:#241B3F;
  --m0:#FF6B5E; --m1:#FF9D4D; --m2:#E8C34A; --m3:#4FD1C0; --m4:#34D399;
  --sh1:0 1px 2px rgba(0,0,0,.45); --sh2:0 2px 4px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.35); --sh3:0 8px 16px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.5);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.cu{font:inherit!important;color:inherit!important;letter-spacing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(900px 420px at 50% -160px,var(--bg-glow),transparent 72%) no-repeat,var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;font-feature-settings:"cv11";font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent}
body.sheet-open{overflow:hidden}
#app{max-width:680px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 124px)}
h1,h2,h3{font-family:var(--body);margin:0;line-height:1.1;text-wrap:balance}
h1{font-weight:800;font-size:clamp(2.2rem,9vw,2.9rem);letter-spacing:-.04em;line-height:1.02}
h2{font-weight:750;font-size:1.32rem;letter-spacing:-.022em;margin:30px 0 12px}
h3{font-weight:700;font-size:1.06rem;letter-spacing:-.012em;margin:18px 0 8px}
p{margin:.45em 0}
kbd{font-family:var(--mono);font-size:.68rem;padding:1px 5px;border:1px solid currentColor;border-radius:5px;opacity:.5;margin-left:6px;font-weight:600}
@media (hover:none){kbd{display:none}}
.muted{color:var(--muted)} .small{font-size:.875rem} .center{text-align:center;justify-content:center}
.lede{color:var(--muted);margin-top:12px;max-width:62ch;font-size:1.02rem}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button[disabled]{cursor:default}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
::selection{background:var(--pri-soft)}
.m0{color:var(--m0)}.m1{color:var(--m1)}.m2{color:var(--m2)}.m3{color:var(--m3)}.m4{color:var(--m4)}
.acc-good{color:var(--m4)}.acc-mid{color:var(--m2)}.acc-bad{color:var(--m0)}
svg{flex:none}
/* ---------- topo ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;font-size:.88rem;color:var(--muted)}
.top .date{white-space:nowrap;font-weight:600;letter-spacing:.01em}
.top .date::first-letter{text-transform:uppercase}
.topr{display:flex;align-items:center;gap:8px;min-width:0}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:0;box-shadow:var(--sh1);transition:transform .3s var(--spring),color .2s,box-shadow .2s}
.iconbtn svg{width:17px;height:17px}
.undobtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.8rem;font-weight:700;box-shadow:var(--sh1)}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 11px 6px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok::before{background:var(--green-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--green-2) 22%,transparent)} .sync.busy::before{background:var(--amber)} .sync.offline::before,.sync.err::before{background:var(--red)}
@media (max-width:440px){.sync{max-width:124px}} @media (max-width:360px){.sync{max-width:76px}}
.hazard{width:44px;height:5px;margin:14px 0 0;border-radius:5px;background:linear-gradient(90deg,var(--pri),var(--fire));transform-origin:left center}
/* ---------- botões e formulários ---------- */
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-weight:650;letter-spacing:-.005em;box-shadow:var(--sh1);transition:transform .35s var(--spring),box-shadow .25s var(--ease),border-color .2s,background-color .2s,color .2s,filter .2s;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--cta);background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);border-color:transparent;color:var(--on-cta);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 20px -8px var(--pri-glow),0 2px 4px rgba(21,32,30,.08)}
.btn.primary::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-130%);pointer-events:none}
.btn.go{background:var(--green);background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 60%);border-color:transparent;color:var(--on-green);box-shadow:0 8px 20px -10px var(--green),0 2px 4px rgba(21,32,30,.08)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--pri)}
.btn.block{width:100%} .btn.grow{flex:1}
.btn.sm{min-height:38px;padding:6px 14px;font-size:.88rem;border-radius:10px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn[disabled]{opacity:.5;box-shadow:none}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--pri);font-weight:650;text-decoration:underline;text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--pri) 35%,transparent);text-underline-offset:4px;display:inline-flex;gap:6px;align-items:center;transition:text-decoration-color .2s,opacity .2s}
.linkbtn svg{width:15px;height:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f,.flabel{display:block;margin:16px 0 6px;font-weight:650;font-size:.9rem}
input:not([type="checkbox"]):not([type="file"]),select,textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 14px;min-height:48px;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:100px;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 4px var(--pri-soft)}
input[type="checkbox"]{accent-color:var(--pri)}
.filebtn{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600;font-size:.9rem;transition:background-color .25s var(--ease),color .25s,border-color .25s,transform .35s var(--spring),box-shadow .25s}
.chip.on,.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest);box-shadow:0 6px 14px -8px var(--forest)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:650;color:var(--muted);min-height:32px;display:flex;flex-direction:column;align-items:center;line-height:1.1;transition:background-color .25s var(--ease),color .2s,box-shadow .25s}
.seg button small{font-family:var(--mono);font-size:.68rem;font-weight:500;opacity:.8}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--sh1),0 0 0 1px var(--line)}
.seg.wide{display:flex;width:100%} .seg.wide button{flex:1;padding:8px 6px}
.note,.okbox,.badbox{padding:13px 15px;border-radius:var(--r-sm);margin:12px 0;border:1px solid;border-left-width:4px}
.note{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,transparent);border-left-color:var(--amber)} .okbox{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 25%,transparent);border-left-color:var(--green)} .badbox{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 25%,transparent);border-left-color:var(--red)}
.pill{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:700;font-size:.78rem;padding:4px 11px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green);color:var(--on-green)} .pill.sm{font-size:.7rem;padding:2px 8px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:30px 0 12px}
.sec-h h2{margin:0}
/* ---------- HOJE ---------- */
.hero-hoje{position:relative;margin-top:18px;padding:18px;border-radius:var(--r-lg);background:radial-gradient(130% 90% at 100% 0%,var(--pri-soft),transparent 58%),var(--surface);border:1px solid var(--line);box-shadow:var(--sh2);display:flex;flex-direction:column;gap:12px}
.hh-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hh-rank{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0}
.insig{display:inline-grid;place-items:center;width:54px;height:54px;flex:none;filter:drop-shadow(0 6px 10px rgba(217,45,32,.25))}
.insig.big{width:96px;height:96px} .insig.sm{width:28px;height:28px;filter:none}
.insig-svg{width:100%;height:100%}
.ins-bg{fill:#C8201A;stroke:#F2B632;stroke-width:2.5}
.ins-g{fill:#FFD35A}
.ins-l{fill:none;stroke:#FFD35A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.hh-rt{display:flex;flex-direction:column;min-width:0}
.hh-rt b{font-size:1.38rem;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.hh-rt>span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ring{position:relative;display:grid;place-items:center;width:92px;height:92px;flex:none;border:0;background:none;padding:0;border-radius:50%}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg-bg{fill:none;stroke:var(--sunk);stroke-width:7}
.rg-fg{fill:none;stroke:var(--star);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .9s var(--out)}
.ring-svg.full .rg-fg{stroke:var(--green-2)}
.ring-svg.m0 .rg-fg{stroke:var(--m0)}.ring-svg.m1 .rg-fg{stroke:var(--m1)}.ring-svg.m2 .rg-fg{stroke:var(--m2)}.ring-svg.m3 .rg-fg{stroke:var(--m3)}.ring-svg.m4 .rg-fg{stroke:var(--m4)}
.rg-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rg-c b{font-size:1.3rem;font-weight:800;letter-spacing:-.03em}
.rg-c em{font-style:normal;font-size:.66rem;color:var(--muted);margin-top:3px;font-weight:600}
.lvlbar{position:relative;height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.lvlbar i{position:relative;display:block;height:100%;min-width:10px;border-radius:999px;background:linear-gradient(90deg,var(--star),var(--fire));transition:width .9s var(--out);overflow:hidden}
.lvlbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%)}
.lvl-cap{display:flex;justify-content:space-between;gap:8px;margin-top:-4px;font-variant-numeric:tabular-nums}
.hh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hs{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:left;min-width:0;transition:transform .35s var(--spring),border-color .2s,box-shadow .25s,background-color .2s}
.hs b{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hs>span:last-child{font-size:.74rem;color:var(--muted);line-height:1.2}
.hs-ic{width:22px;height:22px;color:var(--muted)} .hs-ic svg{width:100%;height:100%}
.hs.on{border-color:color-mix(in srgb,var(--fire) 40%,transparent);background:color-mix(in srgb,var(--fire) 7%,var(--bg))} .hs.on b{color:var(--fire)}
.hs-ic.fl svg{width:18px;height:22px}
.nextstep{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;margin-top:14px;padding:18px;border:0;border-radius:var(--r-lg);background:radial-gradient(120% 140% at 100% 0%,rgba(139,92,246,.55),transparent 55%),radial-gradient(90% 120% at 0% 100%,rgba(16,185,129,.22),transparent 60%),var(--forest);color:var(--on-forest);text-align:left;box-shadow:0 18px 36px -18px rgba(28,63,58,.75),var(--sh1);transition:transform .4s var(--spring),box-shadow .3s var(--ease)}
.nextstep::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);transform:translateX(-130%);pointer-events:none}
.ns-ic{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.ns-ic svg{width:24px;height:24px}
.ns-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.ns-t em{font-style:normal;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--forest-acc);font-weight:750}
.ns-t b{font-size:1.25rem;font-weight:750;letter-spacing:-.02em;line-height:1.15}
.ns-t span{font-size:.85rem;color:var(--forest-mute)}
.ns-go{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--on-forest);color:var(--forest);transition:transform .35s var(--spring)}
.ns-go svg{width:20px;height:20px}
.missions ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mis{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);transition:transform .35s var(--spring),box-shadow .25s}
.mis-ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--on-green);transition:background-color .3s,border-color .3s}
.mis.done{background:color-mix(in srgb,var(--green-soft) 55%,var(--surface))}
.mis.done .mis-ck{background:var(--green);border-color:var(--green)}
.mis.done .mis-b b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.mis-b{display:flex;flex-direction:column;gap:5px;min-width:0}
.mis-b b{font-weight:650;font-size:.96rem;line-height:1.25;letter-spacing:-.01em}
.mis-bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.mis-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--star),var(--fire));border-radius:999px;transition:width .7s var(--out)}
.mis.done .mis-bar i{background:var(--green-2)}
.mis-foot{margin-top:10px}
.stopwatch{margin-top:20px;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh2);text-align:center;transition:border-color .3s,box-shadow .3s,background-color .3s}
.stopwatch.running{border-color:color-mix(in srgb,var(--pri) 45%,var(--line));box-shadow:0 0 0 4px var(--pri-soft),var(--sh2)} .stopwatch.brk{border-color:color-mix(in srgb,var(--green) 45%,var(--line))} .stopwatch.paused{background:var(--sunk)}
.sw-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sw-lbl{font-weight:750;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.stopwatch.running .sw-lbl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pri)}
.sw-clock{font-variant-numeric:tabular-nums;font-size:3.6rem;font-weight:800;line-height:1;letter-spacing:-.03em;margin:16px 0 8px}

.msg.u{align-self:flex-end;padding:11px 14px;background:var(--cta);color:var(--on-cta);border-radius:18px 18px 4px 18px;white-space:pre-wrap;box-shadow:0 6px 16px -8px var(--pri-glow)}
.msg.a{align-self:flex-start;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;box-shadow:var(--sh1)}
.msg.a.pending{color:var(--muted)}
.convbar{margin-top:10px}
.aibox{margin-top:10px;padding:13px 15px;background:var(--surface);border-radius:12px;border:1px solid var(--line);border-left:3px solid var(--pri);line-height:1.6;font-size:.95rem}
details.content-d{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:0 14px 10px;background:var(--surface);box-shadow:var(--sh1)}
details.content-d>summary{cursor:pointer;padding:13px 0 3px;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
details.content-d>summary::-webkit-details-marker{display:none}
details.content-d>summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:1.2rem;line-height:1}
details.content-d[open]>summary::after{content:"−"}
details.content-d>summary svg{width:17px;height:17px;color:var(--pri)}
.content-body{margin:8px 0 0;line-height:1.65}
.links>li{padding:10px 0}
.links a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.links a span{color:var(--pri);text-decoration:none}
.wlist{padding-left:18px;margin:8px 0} .wlist li{margin:8px 0}
/* ---------- PAINEL ---------- */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.hero>div{background:var(--surface);padding:16px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh1)}
.hero>div:first-child{background:radial-gradient(120% 120% at 100% 0%,rgba(139,92,246,.5),transparent 55%),var(--forest);border-color:transparent;color:var(--on-forest);box-shadow:0 16px 30px -18px rgba(28,63,58,.8)}
.hero>div:first-child>span{color:var(--forest-mute)}
.hero b{display:block;font-weight:800;font-size:2.5rem;line-height:1;letter-spacing:-.05em}
.hero>div>span{font-size:.84rem;color:var(--muted)}
.projbar{position:relative;height:10px;background:var(--sunk);margin:16px 0 6px;border-radius:999px}
.projbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green-2),var(--green));border-radius:999px}
.projbar em{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--red)}
.rankcard{display:flex;gap:14px;align-items:center;margin-top:14px;padding:15px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh1);width:100%;text-align:left;transition:transform .4s var(--spring),box-shadow .3s}
.rankcard>div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.rankcard b{font-size:1.2rem;font-weight:750;letter-spacing:-.02em}
.patlist{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:4px}
.patlist li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;color:var(--muted)}
.patlist li em{margin-left:auto;font-style:normal;font-size:.8rem;font-weight:600}
.patlist li.done{color:var(--ink)} .patlist li.cur{background:var(--gold-soft);color:var(--ink);font-weight:700}
.patlist li:not(.done):not(.cur) .insig{opacity:.35;filter:grayscale(1)}
.subjrow{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 0}
.sr-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl{font-weight:750;white-space:nowrap;font-size:.9rem}
.mbar{display:block;height:8px;background:var(--sunk);margin:7px 0 5px;border-radius:999px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:999px;transition:width .7s var(--out)}
.mbar.sm{height:6px;width:140px;max-width:100%}
.trow{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 0;background:none;border:0;text-align:left}
.trow .meta{font-size:.84rem;color:var(--muted)}
.trow .pill{font-size:.82rem}
.ladder .rail{stroke:var(--muted);stroke-width:2} .ladder.big .rail{stroke-width:3.5}
.ladder .rung{stroke-linecap:round} .ladder .on{stroke:var(--green)} .ladder .cur{stroke:var(--pri)} .ladder .off{stroke:var(--line-2)}
.topichead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0}
.bigladder{display:flex;gap:16px;align-items:center}
.bigladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:10px}
.bigladder li{font-weight:700;font-size:1.02rem;color:var(--muted)}
.bigladder li.on{color:var(--green)} .bigladder li.cur{color:var(--pri)}
.tm-ring{position:relative;width:96px;height:96px;flex:none}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;min-width:0;box-shadow:var(--sh1);transition:transform .35s var(--spring),border-color .2s,box-shadow .25s}
.act svg{width:32px;height:32px;padding:7px;border-radius:10px;background:var(--pri-soft);color:var(--pri);margin-bottom:6px;transition:background-color .25s,color .25s}
.act b{font-size:.92rem;line-height:1.2;font-weight:700} .act span{font-size:.76rem;color:var(--muted)}
.evsrc{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.evsrc div{background:var(--surface);padding:11px 4px;text-align:center}
.evsrc b{display:block;font-size:1.1rem;font-weight:800}
.evsrc span{font-size:.68rem;color:var(--muted)}
.wbars{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:8px;border-bottom:1px solid var(--line)}
.wbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.wbars i{display:block;width:100%;border-radius:5px 5px 0 0}
.wbars span{font-size:.7rem;color:var(--muted)}
.wchart{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1)}
.wc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wc-bars{position:relative;display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:12px}
.wc-goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--star);pointer-events:none}
.wc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;position:relative}
.wc-col i{display:block;width:100%;max-width:28px;border-radius:7px 7px 3px 3px;background:var(--sunk);transition:height .7s var(--out);transform-origin:bottom}
.wc-col.has i{background:var(--pri);opacity:.45} .wc-col.meta i{background:linear-gradient(180deg,var(--star),var(--fire));opacity:.95} .wc-col.today i{opacity:1}
.wc-v{font-size:.66rem;color:var(--muted);min-height:1em;font-weight:600}
.wc-d{font-size:.7rem;font-weight:700;color:var(--muted);min-height:1em} .wc-col.today .wc-d{color:var(--pri)}
.wchart.dense .wc-bars{gap:2px} .wchart.dense .wc-v{display:none}
.bigstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bstat{padding:15px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1)}
.bstat b{display:block;font-size:1.85rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.bstat>span{display:block;font-size:.82rem;color:var(--muted);margin-top:5px}
.bstat em{display:block;font-style:normal;font-size:.76rem;color:var(--m4);margin-top:2px;font-weight:700}
.crit{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:10px 0}
.crit .w{color:var(--red);font-weight:700}
.achlist li{display:flex;gap:12px;align-items:center;padding:10px 0}
.achlist .ai{width:36px;height:36px;display:grid;place-items:center;background:var(--sunk);flex:none;color:var(--on-green)}
.achlist li.on .ai{background:linear-gradient(145deg,var(--star),var(--fire))}
.achlist li:not(.on){opacity:.55}
.insignia{clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.checkdraw{width:20px;height:20px;flex:none}
.checkdraw path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:checkdraw .34s .05s ease-out forwards}
@keyframes checkdraw{to{stroke-dashoffset:0}}
/* ---------- ERROS e REDAÇÃO ---------- */
.errcta{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;margin-top:16px;padding:18px;border:0;border-radius:var(--r-lg);background:radial-gradient(120% 140% at 0% 0%,rgba(240,97,42,.45),transparent 55%),var(--forest);color:var(--on-forest);text-align:left;box-shadow:0 18px 36px -18px rgba(28,63,58,.75);transition:transform .4s var(--spring),box-shadow .3s}
.ec-n{font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.05em;color:#FFB28A}
.ec-t b{display:block;font-size:1.04rem;line-height:1.2;font-weight:700} .ec-t span{display:block;font-size:.84rem;color:var(--forest-mute);margin-top:3px}
.ec-go{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--on-forest);color:var(--forest);transition:transform .35s var(--spring)}
.ec-go svg{width:20px;height:20px;display:block}
.errok{display:flex;gap:10px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:var(--r);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 25%,transparent);font-size:.92rem}
.errok .checkdraw{color:var(--green)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic l" "v v" "w w";gap:2px 8px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;box-shadow:var(--sh1);min-height:108px;transition:transform .35s var(--spring),box-shadow .25s}
.ti-ic{grid-area:ic;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--pri-soft);color:var(--pri)}
.ti-ic svg{width:17px;height:17px}
.ti-l{grid-area:l;font-size:.8rem;font-weight:650;color:var(--muted);line-height:1.15}
.ti-v{grid-area:v;font-size:1.8rem;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:10px}
.ti-w{grid-area:w;font-size:.74rem;color:var(--muted);line-height:1.3;margin-top:3px}
.erritem{padding:14px 0;border-bottom:1px solid var(--line)}
.ei-q{margin-top:4px;line-height:1.5}
.ei-acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.subjerr{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0}
.rfgrades{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.rfgrades .btn{min-height:52px} .span2{grid-column:1/-1}
.temacard{margin-top:16px;padding:18px;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--beige),transparent 70%),var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh1)}
.temacard>b{font-size:1.3rem;font-weight:750;letter-spacing:-.022em;line-height:1.2}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;position:relative;margin:14px 0 4px;padding-top:6px;border-bottom:1px solid var(--line-2)}
.bars .min{position:absolute;left:0;right:0;bottom:calc(50% - 10px);border-top:1.5px dashed var(--red);z-index:2;pointer-events:none}
.bars .min span{position:absolute;right:0;top:-18px;font-size:.75rem;color:var(--red);background:var(--bg);padding:0 0 0 4px}
.bars .col{flex:0 1 40px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;z-index:1}
.bars .col i{display:block;background:var(--pri);min-height:2px;border-radius:6px 6px 0 0}
.bars .col.low i{background:var(--red)}
.bars .col b{font-size:.85rem;font-weight:700;text-align:center}
/* ---------- navegação, cronômetro, folha, toast, instrutor ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#tabs .in{position:relative;pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);padding:0 6px;border-radius:24px;background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--line);box-shadow:var(--sh3)}
#tabs .in::before{content:"";position:absolute;top:8px;bottom:8px;left:6px;width:calc((100% - 12px)/5);border-radius:17px;background:var(--pri-soft);transform:translateX(calc(var(--ti,0)*100%));transition:transform .5s var(--spring);pointer-events:none}
#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.72rem;font-weight:650;color:var(--muted);position:relative;z-index:1;transition:color .25s}
#tabs button svg{width:23px;height:23px;transition:transform .4s var(--spring)}
#tabs button[aria-current="page"]{color:var(--pri)}
#tabs .dot{position:absolute;top:7px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.64rem;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--surface)}
#timerbar{position:fixed;left:16px;bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));z-index:29}
.tb-in{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh2);font-weight:750}
.tb-in .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
#timerbar.running .dot{background:var(--pri)} #timerbar.running{color:var(--pri)}
.tb-l{font-size:.75rem;color:var(--muted);font-weight:600}
#fab{position:fixed;right:max(16px,calc(50vw - 340px + 16px));bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));z-index:31;display:flex;align-items:center;gap:8px;padding:12px 18px 12px 15px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--cta-a),var(--cta-b));color:var(--on-cta);font-weight:700;letter-spacing:-.005em;box-shadow:0 12px 28px -10px var(--pri-glow),0 2px 6px rgba(21,32,30,.12);transition:transform .4s var(--spring),box-shadow .3s}
#fab svg{width:20px;height:20px;color:#FDE68A}
#sheet{position:fixed;inset:0;z-index:50}
#sheet .scrim{position:absolute;inset:0;background:rgba(8,14,12,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto;overscroll-behavior:contain;box-shadow:0 -12px 48px rgba(0,0,0,.22)}
#sheet .panel::before{content:"";display:block;width:40px;height:5px;margin:-14px auto 14px;border-radius:5px;background:var(--line-2)}
#sheet .panel h2{margin-top:0;padding-right:36px}
.sheet-bar{position:sticky;top:-8px;height:0;display:flex;justify-content:flex-end;z-index:5;pointer-events:none}
.sheet-close{pointer-events:auto;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--sunk);border:0;color:var(--muted);margin:-8px -6px 0 0;box-shadow:0 0 0 4px var(--surface);transition:transform .35s var(--spring),background-color .2s}
.sheet-close svg{width:18px;height:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(14px) scale(.96);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;max-width:min(92vw,520px);font-size:.92rem;font-weight:550;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .4s var(--spring);box-shadow:var(--sh3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
#banners{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.banner{display:flex;gap:12px;align-items:center;max-width:460px;width:100%;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--raised) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);box-shadow:var(--sh3);border:1px solid var(--line);transform:translateY(-130%) scale(.92);opacity:0;transition:transform .5s var(--spring),opacity .25s}
.banner.in{transform:none;opacity:1}
.bn-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--sunk);flex:none}
.bn-ic svg{width:22px;height:22px}
.bn-t{display:flex;flex-direction:column;min-width:0} .bn-t b{font-size:1rem;font-weight:750;letter-spacing:-.015em;line-height:1.2} .bn-t span{font-size:.84rem;color:var(--muted)}
.banner.gold{border-color:color-mix(in srgb,var(--star) 55%,transparent)} .banner.gold .bn-ic{background:linear-gradient(145deg,var(--star),var(--fire));color:#fff}
.banner.green{border-color:color-mix(in srgb,var(--green) 45%,transparent)} .banner.green .bn-ic{background:linear-gradient(145deg,var(--green-2),var(--green));color:#fff}
.banner.fire{border-color:color-mix(in srgb,var(--fire) 50%,transparent)} .banner.fire .bn-ic{background:color-mix(in srgb,var(--fire) 14%,transparent)} .banner.fire .bn-ic svg{width:20px;height:24px}
#celebrate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(6,12,10,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cel-card{position:relative;isolation:isolate;overflow:hidden;width:100%;max-width:360px;padding:30px 22px 20px;border-radius:30px;background:radial-gradient(120% 70% at 50% 0%,rgba(139,92,246,.55),transparent 62%),var(--forest);color:var(--on-forest);text-align:center;border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:celin .55s var(--spring)}
.cel-card::before{content:"";position:absolute;left:50%;top:92px;width:520px;height:520px;margin:-260px 0 0 -260px;z-index:-1;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%)}
@keyframes celin{from{transform:scale(.72) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.cel-kicker{font-size:.76rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--forest-acc)}
.cel-big{font-weight:800;font-size:5.4rem;line-height:1;letter-spacing:-.06em;margin:10px 0;background:linear-gradient(180deg,#FEF3C7,#FBBF24 45%,#F97316);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 24px rgba(251,191,36,.35))}
.cel-name{font-weight:800;font-size:2rem;line-height:1.08;letter-spacing:-.035em;margin:10px 0}
.cel-sub{color:var(--forest-mute);margin:8px 0 20px}
.cel-card .insig{margin:12px auto 0;filter:drop-shadow(0 10px 24px rgba(242,182,50,.45))}
.cel-card .btn.primary{box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 10px 28px -6px rgba(139,92,246,.75)}
#fxcanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.xpfloat{position:fixed;z-index:95;transform:translate(-50%,0);padding:4px 11px;border-radius:999px;background:linear-gradient(135deg,#FCD34D,#F97316);color:#3B1703;font-weight:800;font-size:.95rem;letter-spacing:-.01em;box-shadow:0 8px 20px -6px rgba(249,115,22,.6);pointer-events:none;white-space:nowrap;animation:xpup 1.1s var(--out) forwards}
.xpfloat.big{font-size:1.2rem;padding:6px 14px}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}18%{opacity:1;transform:translate(-50%,-8px) scale(1.12)}32%{transform:translate(-50%,-14px) scale(1)}100%{opacity:0;transform:translate(-50%,-58px) scale(.96)}}
.rip-w{position:fixed;z-index:96;pointer-events:none;overflow:hidden}
.rip-w i{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rip .6s var(--out) forwards}
@keyframes rip{60%{opacity:.14}to{transform:scale(1);opacity:0}}
/* ---------- movimento ---------- */
@media (prefers-reduced-motion: no-preference){

@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important} }
@media (hover:hover) and (pointer:fine){

  .qk:hover>svg,.act:hover svg{background:var(--pri);color:var(--on-pri)}

}

/* ===== Arena de jogos ===== */
:root{--sc-port:#3B5BDB;--sc-mat:#D9480F;--sc-fis:#0C8599;--sc-qui:#AE3EC9;--sc-hist:#A16207;--on-sc:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sc-port:#91A7FF;--sc-mat:#FFA94D;--sc-fis:#66D9E8;--sc-qui:#E599F7;--sc-hist:#FFD43B;--on-sc:#0C1311}}
:root[data-theme="dark"]{--sc-port:#91A7FF;--sc-mat:#FFA94D;--sc-fis:#66D9E8;--sc-qui:#E599F7;--sc-hist:#FFD43B;--on-sc:#0C1311}
.s-port{--sc:var(--sc-port)} .s-mat{--sc:var(--sc-mat)} .s-fis{--sc:var(--sc-fis)} .s-qui{--sc:var(--sc-qui)} .s-hist{--sc:var(--sc-hist)}
.artabs{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.artabs::-webkit-scrollbar{display:none}
.artabs .chip{flex:none}
.artabs .chip.on[class*="s-"]{background:var(--sc);border-color:var(--sc);color:var(--on-sc);box-shadow:0 8px 18px -10px var(--sc)}
.arsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}

.arsum b{display:block;font-size:1.55rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.arsum b small{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:0}
.arsum span{display:block;margin-top:5px;font-size:.76rem;line-height:1.3;color:var(--muted)}
.arrec{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:1fr auto;grid-template-areas:"k btn" "t btn" "d btn";gap:3px 14px;align-items:center;width:100%;margin-top:12px;padding:18px;border-radius:var(--r-lg);border:0;background:radial-gradient(120% 140% at 100% 0%,rgba(139,92,246,.5),transparent 55%),var(--forest);color:var(--on-forest);box-shadow:0 18px 36px -18px rgba(28,63,58,.75);text-align:left;transition:transform .4s var(--spring),box-shadow .3s}
.arrec>.small:first-child{grid-area:k;color:var(--forest-acc);font-weight:750;text-transform:uppercase;letter-spacing:.12em;font-size:.68rem} .arrec b{grid-area:t;font-size:1.22rem;font-weight:750;letter-spacing:-.02em;line-height:1.2} .arrec>.small:nth-of-type(2){grid-area:d;color:var(--forest-mute)} .arrec .btn{grid-area:btn}
.aglist{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
@media (min-width:560px){.aglist{grid-template-columns:1fr 1fr}}
.agc{display:grid;grid-template-columns:50px 1fr auto;gap:13px;align-items:center;width:100%;padding:12px 14px 12px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh1);text-align:left;transition:transform .4s var(--spring),border-color .2s,box-shadow .3s}
.agc-ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--sc) 72%,#fff),var(--sc));color:var(--on-sc);font-weight:800;font-size:.95rem;letter-spacing:-.03em;overflow:hidden;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 16px -8px var(--sc);transition:transform .4s var(--spring)}
.agc-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.agc-t b{font-size:1.02rem;font-weight:700;letter-spacing:-.015em;line-height:1.2} .agc-t>span:not(.lvdots){font-size:.78rem;color:var(--muted);line-height:1.25}
.agc-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}

.lvdots{display:flex;gap:4px;margin-top:5px} .lvdots i{width:18px;height:6px;border-radius:3px;background:var(--line)} .lvdots i.open{background:color-mix(in srgb,var(--sc) 35%,var(--line))} .lvdots i.on{background:var(--sc)}
@media (hover:hover) and (pointer:fine){.agc:hover{border-color:color-mix(in srgb,var(--sc) 50%,var(--line))} .agc:hover .agc-ic{transform:rotate(-7deg) scale(1.08)} .arrec:hover{box-shadow:0 24px 44px -18px rgba(28,63,58,.85)} .lvpath li:not(.locked) button:hover{transform:scale(1.012);border-color:var(--sc);box-shadow:var(--sh2)}}

.lvpath li{position:relative}

.lvpath .lvn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--sunk);border:2px solid var(--line)}
.lvpath .lvn svg{width:18px;height:18px;color:var(--muted)}
.lvpath .lvt b{display:block;font-size:.95rem;font-weight:700} .lvpath .lvt span{font-size:.8rem;color:var(--muted);line-height:1.3;display:block}
.lvpath li.done .lvn{background:linear-gradient(145deg,color-mix(in srgb,var(--sc) 72%,#fff),var(--sc));border-color:transparent;color:var(--on-sc)}
.lvpath li.cur button{border-color:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 16%,transparent),var(--sh1)}
.lvpath li.cur .lvn{border-color:var(--sc);color:var(--sc);background:var(--surface)}

.stars{display:inline-flex;gap:2px} .stars svg{width:18px;height:18px;fill:var(--line-2)} .stars svg.on{fill:var(--star)}

@keyframes starpop{from{transform:scale(0) rotate(-50deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}to{transform:none;opacity:1}}
.segs{display:flex;gap:4px;margin-top:10px} .segs i{flex:1;height:7px;border-radius:4px;background:var(--line);transition:background-color .3s} .segs i.ok{background:var(--green-2)} .segs i.bad{background:var(--red)} .segs i.cur{background:var(--pri);opacity:.55}

.revtag{display:inline-block;margin-bottom:8px;padding:3px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:.72rem;font-weight:800}
.qcard.ar .qtext{white-space:normal;line-height:1.55}
.figbox{margin-top:14px;display:flex;justify-content:center}
.fg{width:100%;max-width:340px;height:auto;display:block}
.fg .gr{stroke:var(--line);stroke-width:1} .fg .ax{stroke:var(--muted);stroke-width:1.5;fill:none} .fg .ln{stroke:var(--pri);stroke-width:2.5;fill:none} .fg .ln2{stroke:var(--fire);stroke-width:2.5;fill:none}
.fg .ln0{stroke:var(--muted);stroke-width:1.5} .fg .dash{stroke-dasharray:5 4} .fg .pt{fill:var(--pri)} .fg .ar{fill:var(--pri-soft);stroke:none}
.fg .sh{fill:var(--pri-soft);stroke:var(--pri);stroke-width:2} .fg .sh2{fill:var(--sunk);stroke:var(--pri);stroke-width:2} .fg .sh.nb{stroke:none}
.fg .br{fill:var(--sc-port)} .fg .rs{fill:var(--surface);stroke:var(--ink);stroke-width:2} .fg .wr{stroke:var(--ink);stroke-width:2} .fg .bt{stroke:var(--ink);stroke-width:3} .fg .bt2{stroke:var(--ink);stroke-width:5}
.fg text{fill:var(--ink);font-family:var(--body);font-size:12px} .fg .tk{fill:var(--muted);font-size:10px} .fg .al{fill:var(--muted);font-size:11px;font-weight:700} .fg .lb{font-weight:700;font-size:13px} .fg .pl{font-size:11px;font-weight:700}

const CONTENT = {
  'hist-ocup':'Antes da chegada europeia, o território paranaense era ocupado pelos Guarani (litoral e áreas de araucária) e pelos Kaingang (planalto). A ocupação portuguesa começou pelo litoral no século XVII, atraída pelo ouro de aluvião de Paranaguá (1648) e depois de Curitiba. Esgotado o ouro no século XVIII, os povoadores migraram para o planalto e viveram de gado e agricultura de subsistência. O eixo dos Campos Gerais (região de Ponta Grossa) foi o principal vetor de povoamento no século XIX, reforçado por imigrantes europeus (alemães, italianos, poloneses, ucranianos). No século XX, duas frentes completaram a ocupação: a cafeeira, vinda de São Paulo, no Norte (Londrina, Maringá); e a colonizadora, vinda do Rio Grande do Sul e Santa Catarina, no Oeste e Sudoeste.',
  'hist-ciclos':'Guarde a ordem: ouro → tropeirismo/erva-mate → madeira → café. 1) Ouro (séc. XVII-XVIII): extração em Paranaguá e no planalto de Curitiba, primeiro impulso povoador. 2) Tropeirismo e erva-mate (séc. XVIII-XIX): tropas de gado vindas do Sul cruzavam o estado rumo a Sorocaba (SP) pelo Caminho das Tropas, fixando os pousos que viraram cidades dos Campos Gerais; a erva-mate nativa virou o principal produto de exportação do Paraná no século XIX. 3) Madeira (fim do séc. XIX a meados do XX): exploração da araucária, ligada à expansão ferroviária. 4) Café (séc. XX): avançou do Norte vindo de São Paulo, e fez o Paraná ser o maior produtor nacional nas décadas de 1950-60, até a geada negra de 1975 devastar os cafezais e acelerar a virada para a soja.',
  'hist-emanc':'Até 1853, o território paranaense era a Comarca de Curitiba, parte da Província de São Paulo. Um movimento separatista, liderado por lideranças de Curitiba e dos Campos Gerais que reivindicavam mais autonomia e investimento, ganhou força a partir de 1840. A Lei Imperial nº 704, de 29 de agosto de 1853, desmembrou a Comarca de São Paulo e criou a Província do Paraná. Zacarias de Góis e Vasconcelos foi o primeiro presidente da província, empossado em Curitiba em 19 de dezembro de 1853 — data celebrada até hoje como o Dia do Paraná.',
  'geo-ocup':'A ocupação territorial do Paraná seguiu os mesmos ciclos econômicos que moldaram sua história: começou no litoral e no planalto de Curitiba com o ouro, avançou pelos Campos Gerais com o tropeirismo e a erva-mate, e só no século XX se completou com a ocupação do Norte (frente cafeeira vinda de São Paulo, com cidades planejadas como Londrina e Maringá) e do Oeste/Sudoeste (colonização vinda do Rio Grande do Sul e Santa Catarina). Esse duplo movimento — paulista no Norte, sulista no Oeste — explica diferenças culturais e econômicas que existem até hoje entre as regiões do estado.',
  'geo-ciclos':'Do ponto de vista espacial, os ciclos econômicos (veja em História do Paraná) explicam a regionalização do estado até hoje: o Sul e o Leste concentraram erva-mate e madeira; o Norte, café; o Oeste e o Sudoeste, a agricultura da colonização gaúcha-catarinense. É essa lógica histórica que organiza a divisão regional do Paraná cobrada em questões de geografia.',
  'geo-povos':'O Paraná tem povos indígenas Guarani e Kaingang, com terras demarcadas no litoral, no centro-sul e no oeste do estado. Há comunidades quilombolas reconhecidas principalmente no Vale do Ribeira (divisa com São Paulo) e em municípios do litoral. As comunidades tradicionais incluem os caiçaras do litoral (pesca artesanal) e os ribeirinhos ao longo de rios como o Ivaí e o Paraná.',
  'scip-lei':'A Lei Estadual 19.449/2018 regula o poder de polícia administrativa do Corpo de Bombeiros Militar e fixa normas gerais de prevenção e combate a incêndio e a desastres. Foi ela que deu ao CBMPR papel fiscalizador: analisar projetos, vistoriar, licenciar e punir irregularidades em edificações, estabelecimentos, áreas de risco e eventos temporários. Atenção: a lei foi alterada pela Lei 22.367/2025, em vigor desde abril de 2026, e os procedimentos de vistoria e licenciamento foram atualizados na NPA 001 (2026). Estude pelo texto oficial e confira na NPA 001 as siglas dos certificados (CVCB, CLCB), porque é aí que a banca costuma pegar.',
  'scip-dec':'O Decreto Estadual 11.868/2018 regulamenta a Lei 19.449/2018: detalha como o CBMPR exerce o poder de polícia (fiscalização, sanções) e disciplina o Termo de Compromisso de Ajustamento de Conduta (TCAC), usado para o responsável regularizar o imóvel dentro de um cronograma acordado. Se a questão fala em procedimento, prazo ou TCAC, pense no Decreto; se fala em competência e normas gerais, pense na Lei.',
  'leg-pnspds':'A Lei 13.675/2018 cria o Susp (Sistema Único de Segurança Pública) e a PNSPDS, reunindo União, Estados, DF e Municípios num esforço coordenado. Fixa princípios como uso comedido e proporcional da força e respeito aos direitos humanos, e lista quem compõe o Susp: polícias federais, civis e militares, corpos de bombeiros militares, guardas municipais, entre outros.',
  'leg-lonpm':'A Lei 14.751/2023 é a norma geral federal que todo estado deve seguir ao organizar sua PM e seu Corpo de Bombeiros. Define que são forças auxiliares e reserva do Exército, organizadas por hierarquia e disciplina militares, comandadas por um oficial da ativa do último posto. O detalhamento de carreira e disciplina fica com a lei de cada estado — no Paraná, a Lei 22.206/2024 e o Código da PMPR (Lei 1.943/1954).',
  'leg-pnpdec':'A Lei 12.608/2012 institui a Política Nacional de Proteção e Defesa Civil, com foco em prevenir desastres, não só responder a eles. Criou o cadastro de municípios com áreas suscetíveis a desastres e reforçou o papel de União, Estados e Municípios na gestão de risco — tema direto para quem vai atuar em enchentes e deslizamentos no Paraná.',

  'apub-lic':'A Lei 14.133/2021 é a Lei de Licitações e Contratos vigente. Modalidades: pregão (bens e serviços comuns), concorrência (demais casos, inclusive obras), concurso (trabalhos técnicos/científicos/artísticos), leilão (venda de bens) e diálogo competitivo (soluções inovadoras). Contratação direta se divide em dispensa (a lei permite não licitar, ex.: valor baixo, emergência) e inexigibilidade (é impossível ter competição, ex.: fornecedor exclusivo). O Sistema de Registro de Preços registra preços para contratações futuras sem repetir a licitação inteira.'

/* ================= Geradores de problemas (Exatas) ================= */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const one=a=>a[Math.floor(Math.random()*a.length)];
function nf(n){ return (Math.round(n*100)/100).toLocaleString('pt-BR',{maximumFractionDigits:2}); }
function sup(n){ const m={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c=>m[c]||c).join(''); }
function sgn(b){ return b<0?'− '+Math.abs(b):'+ '+b; }
function numOpts(ans,unit,cands){
  const out=[ans], seen=new Set([Math.round(ans*100)/100]);
  const base=(cands||[]).concat([ans*2,ans/2,ans+(Math.abs(ans)>=10?Math.round(Math.abs(ans)*0.1):1),ans-(Math.abs(ans)>=10?Math.round(Math.abs(ans)*0.1):1),ans*10,ans/10,ans+2,ans-2,ans*3]);
  for(const c of base){ if(out.length>=4) break; if(!isFinite(c)) continue; const v=Math.round(c*100)/100; if(seen.has(v)) continue; if(ans>0&&v<=0) continue; seen.add(v); out.push(v); }
  let g=0; while(out.length<4&&g<50){ g++; const v=Math.round((ans+ri(1,9)*(Math.random()<.5?-1:1))*100)/100; if(!seen.has(v)&&!(ans>0&&v<=0)){ seen.add(v); out.push(v); } }
  const sh=shuffle(out); return {opts:sh.map(v=>nf(v)+(unit?' '+unit:'')),right:sh.indexOf(ans)};
}
function strOpts(ans,ds){ const u=[...new Set(ds.filter(d=>d!==ans))].slice(0,3); const sh=shuffle([ans].concat(u)); return {opts:sh,right:sh.indexOf(ans)}; }
const GEN={
  frac(){ const d=one([2,3,4,5,8,10]), n=ri(1,d-1), tot=d*ri(2,12)*one([1,2,5]), a=tot*n/d;
    return {t:'mat-ops',q:'Quanto é '+n+'/'+d+' de '+tot+'?',...numOpts(a,'',[tot/d,tot*n,a+tot/d]),steps:['Divida pelo denominador: '+tot+' ÷ '+d+' = '+nf(tot/d),'Multiplique pelo numerador: '+nf(tot/d)+' × '+n+' = '+nf(a)]}; },
  pot(){ const b=one([2,3,5,10]), x=ri(1,3), y=ri(1,3), a=Math.pow(b,x+y);
    return {t:'mat-ops',q:'Calcule '+b+sup(x)+' × '+b+sup(y)+'.',...numOpts(a,'',[Math.pow(b,x*y),b*(x+y),Math.pow(b,x)+Math.pow(b,y)]),steps:['Mesma base, multiplicação: some os expoentes → '+b+sup(x+y),b+sup(x+y)+' = '+nf(a)]}; },
  notc(){ const m=ri(11,99)/10, e=one([-5,-4,-3,-2,3,4,5,6]); const val=Number((m*Math.pow(10,e)).toPrecision(2)); const dec=val.toLocaleString('pt-BR',{maximumFractionDigits:10});
    const f=(mm,ee)=>nf(mm)+' × 10'+sup(ee); const ans=f(m,e);
    return {t:'fis-unid',q:'Escreva '+dec+' em notação científica.',...strOpts(ans,[f(m,e+1),f(m,e-1),f(m*10,e-1),f(m,-e)]),steps:['Notação científica: um número entre 1 e 10 vezes uma potência de 10.','Ande com a vírgula até ficar '+nf(m)+': foram '+Math.abs(e)+' casas '+(e<0?'para a direita (expoente negativo)':'para a esquerda (expoente positivo)')+'.','Resposta: '+ans]}; },
  r3(){ if(Math.random()<.5){ const k=ri(2,9), a=ri(2,8), b=a+ri(1,6), pa=k*a, ans=k*b;
      return {t:'mat-prop',q:a+' kg de um produto custam R$ '+pa+'. Quanto custam '+b+' kg?',...numOpts(ans,'',[pa*a/b,pa+b,ans+k]),steps:['Grandezas diretamente proporcionais: mais quilos, mais caro.','Preço de 1 kg: '+pa+' ÷ '+a+' = '+k,b+' kg: '+b+' × '+k+' = R$ '+ans]}; }
    const [n1,h1,n2,h2]=one([[2,6,3,4],[3,8,4,6],[4,6,6,4],[6,4,8,3],[5,12,6,10],[4,9,6,6],[3,10,5,6],[2,9,6,3]]);
    return {t:'mat-prop',q:n1+' bombeiros fazem um rescaldo em '+h1+' h. Em quanto tempo '+n2+' bombeiros fariam o mesmo serviço, no mesmo ritmo?',...numOpts(h2,'h',[h1*n2/n1,h1+n2-n1,h1-1]),steps:['Grandezas inversamente proporcionais: mais gente, menos tempo.','Trabalho total: '+n1+' × '+h1+' = '+(n1*h1)+' bombeiro-horas',(n1*h1)+' ÷ '+n2+' = '+h2+' h']}; },
  porc(){ const k=ri(0,3);
    if(k===0){ const p=one([5,10,12,15,20,25,30,40,75]), v=one([80,120,160,200,240,300,400,500,600,800]), a=v*p/100;
      return {t:'mat-porc',q:'Quanto é '+p+'% de '+v+'?',...numOpts(a,'',[v/p,a*10,a*2]),steps:[p+'% = '+p+'/100',v+' × '+p+' ÷ 100 = '+nf(a)]}; }
    if(k===1||k===2){ const p=one([10,15,20,25,30]), v=one([100,200,250,400,500,800,1000]), up=k===1, a=v*(1+(up?1:-1)*p/100);
      return {t:'mat-porc',q:'Um equipamento custava R$ '+nf(v)+' e teve '+(up?'aumento':'desconto')+' de '+p+'%. Qual o novo preço?',...numOpts(a,'',[v*p/100,v*(1+(up?-1:1)*p/100),v+(up?p:-p)]),steps:[(up?'Aumento':'Desconto')+' de '+p+'% → multiplique por '+nf(1+(up?1:-1)*p/100),nf(v)+' × '+nf(1+(up?1:-1)*p/100)+' = R$ '+nf(a)]}; }
    const C=one([500,1000,2000,5000]), i=one([1,2,3,5]), t=ri(2,12), J=C*i*t/100;
    return {t:'mat-porc',q:'Qual o juro simples de R$ '+nf(C)+' a '+i+'% ao mês durante '+t+' meses?',...numOpts(J,'',[C*i/100,J+C,C*i*t/10]),steps:['Juros simples: J = C · i · t','J = '+nf(C)+' × '+i+'/100 × '+t+' = R$ '+nf(J)]}; },
  eq1(){ const x=ri(-6,12), a=one([2,3,4,5,6,7]), b=ri(-15,20)||3, c=a*x+b;
    return {t:'mat-eq',q:'Resolva: '+a+'x '+sgn(b)+' = '+c,...numOpts(x,'',[(c+b)/a,c-b,-x]),steps:['Passe o '+b+' para o outro lado trocando o sinal: '+a+'x = '+c+' '+sgn(-b)+' = '+(c-b),'Divida por '+a+': x = '+(c-b)+' ÷ '+a+' = '+x]}; },
  eq2(){ let r1=ri(-5,6), r2=ri(-5,6); if(r1===r2) r2=r1+2; const S=r1+r2, P=r1*r2; const eq='x² '+(S===0?'':(S>0?'− '+S+'x ':'+ '+(-S)+'x '))+(P===0?'':sgn(P)+' ')+'= 0'; const k=ri(0,2);
    if(k===0) return {t:'mat-eq',q:'Qual a soma das raízes de '+eq+'?',...numOpts(S,'',[-S,P,S+1]),steps:['Soma das raízes = −b/a','−('+(-S)+')/1 = '+S]};
    if(k===1) return {t:'mat-eq',q:'Qual o produto das raízes de '+eq+'?',...numOpts(P,'',[-P,S,P+1]),steps:['Produto das raízes = c/a',P+'/1 = '+P]};
    const M=Math.max(r1,r2); return {t:'mat-eq',q:'Qual a maior raiz de '+eq+'?',...numOpts(M,'',[Math.min(r1,r2),-M,S]),steps:['Procure dois números com soma '+S+' e produto '+P+': '+r1+' e '+r2,'Maior raiz: '+M]}; },
  fun(){ if(Math.random()<.6){ const a=one([-3,-2,2,3,4,5]), b=ri(-8,8), k=ri(-4,6), v=a*k+b;

    const h=ri(-4,5), c=ri(-6,8), b=-2*h; return {t:'mat-fun',q:'Qual o x do vértice de f(x) = x² '+(b===0?'':sgn(b)+'x ')+sgn(c)+'?',...numOpts(h,'',[-h,b,h+1]),steps:['x do vértice = −b/(2a)','−('+b+')/(2 · 1) = '+h]}; },
  pa(){ const a1=ri(1,20), r=ri(2,9), n=ri(5,15), an=a1+(n-1)*r;
    if(Math.random()<.5) return {t:'mat-pa',q:'Numa PA, a₁ = '+a1+' e a razão é '+r+'. Qual o '+n+'º termo?',...numOpts(an,'',[a1+n*r,a1*n,an+r]),steps:['aₙ = a₁ + (n − 1) · r',a1+' + '+(n-1)+' · '+r+' = '+an]};
    const Sn=n*(a1+an)/2; return {t:'mat-pa',q:'Qual a soma dos '+n+' primeiros termos da PA com a₁ = '+a1+' e aₙ = '+an+'?',...numOpts(Sn,'',[(a1+an)*n,Sn+an,a1*n]),steps:['Sₙ = n · (a₁ + aₙ) / 2',n+' · ('+a1+' + '+an+') / 2 = '+nf(Sn)]}; },
  pg(){ const a1=one([1,2,3,5]), q=one([2,3]), n=ri(3,6), an=a1*Math.pow(q,n-1);

  log(){ const k=ri(0,2);

    const b=one([2,3]), x=ri(2,6), v=Math.pow(b,x);

  area(){ const k=ri(0,3);
    if(k===0){ const b=ri(3,20), h=ri(2,15); return {t:'mat-gp',q:'Área de um retângulo de '+b+' m por '+h+' m?',...numOpts(b*h,'m²',[2*(b+h),b+h,b*h/2]),steps:['A = base × altura',b+' × '+h+' = '+(b*h)+' m²']}; }

    if(k===2){ const r=ri(1,10); return {t:'mat-gp',q:'Área de um círculo de raio '+r+' m? (use π = 3)',...numOpts(3*r*r,'m²',[2*3*r,3*r,9*r*r]),steps:['A = π · r²','3 × '+r+'² = 3 × '+(r*r)+' = '+(3*r*r)+' m²']}; }
    const [a,b,c]=one([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20]]); return {t:'mat-gp',q:'Triângulo retângulo com catetos '+a+' e '+b+'. Quanto mede a hipotenusa?',...numOpts(c,'',[a+b,c+1,Math.round((a*a+b*b)/2)]),steps:['Pitágoras: a² = b² + c²',a+'² + '+b+'² = '+(a*a)+' + '+(b*b)+' = '+(c*c),'√'+(c*c)+' = '+c]}; },

    if(k===1){ const a=ri(2,8), b=ri(2,8), c=ri(2,6); return {t:'mat-ge',q:'Volume de uma caixa d\u2019água de '+a+' m × '+b+' m × '+c+' m?',...numOpts(a*b*c,'m³',[a+b+c,2*(a*b+a*c+b*c),a*b]),steps:['V = comprimento × largura × altura',a+' × '+b+' × '+c+' = '+(a*b*c)+' m³','Lembre: 1 m³ = 1.000 litros.']}; }

  media(){ if(Math.random()<.5){ const m=ri(5,15), d=shuffle([-3,-1,0,1,3]), xs=d.map(x=>m+x*ri(1,2)); const s=xs.reduce((a,b)=>a+b,0), mean=s/5;

  vm(){ const t=ri(2,6), v=one([40,50,60,70,80,90,100]), s=v*t;

  newton(){ if(Math.random()<.6){ const m=ri(2,50), a=ri(1,6); return {t:'fis-din',q:'Força resultante para acelerar '+m+' kg a '+a+' m/s²?',...numOpts(m*a,'N',[m+a,m/a,m*a*10]),steps:['F = m · a',m+' × '+a+' = '+(m*a)+' N']}; }

  ec(){ const m=one([2,4,6,10,20,50,80,100]), v=one([2,4,5,10,20]), e=m*v*v/2; return {t:'fis-ene',q:'Energia cinética de '+m+' kg a '+v+' m/s?',...numOpts(e,'J',[m*v,m*v*v,m*v/2]),steps:['Ec = m · v² / 2',m+' × '+(v*v)+' / 2 = '+nf(e)+' J']}; },
  ep(){ const m=ri(2,80), h=ri(1,20), e=m*10*h; return {t:'fis-ene',q:'Energia potencial de '+m+' kg a '+h+' m de altura? (g = 10 m/s²)',...numOpts(e,'J',[m*h,e/2,e*10]),steps:['Ep = m · g · h',m+' × 10 × '+h+' = '+e+' J']}; },
  trab(){ if(Math.random()<.5){ const F=ri(1,20)*10, d=ri(2,20); return {t:'fis-ene',q:'Trabalho de uma força de '+F+' N ao longo de '+d+' m (mesma direção)?',...numOpts(F*d,'J',[F+d,F/d,F*d*2]),steps:['τ = F · d',F+' × '+d+' = '+(F*d)+' J']}; }

  press(){ const F=one([100,200,500,1000,2000]), A=one([0.5,1,2,4,5]), p=F/A; return {t:'fis-hid',q:'Pressão de uma força de '+F+' N sobre '+nf(A)+' m²?',...numOpts(p,'Pa',[F*A,p*2,p/10]),steps:['p = F / A',F+' ÷ '+nf(A)+' = '+nf(p)+' Pa']}; },

  onda(){ const l=one([0.5,1,2,3,4,5]), f=one([10,20,50,100,170]), v=l*f; return {t:'fis-ond',q:'Onda com comprimento '+nf(l)+' m e frequência '+f+' Hz. Qual a velocidade?',...numOpts(v,'m/s',[f/l,l+f,v*2]),steps:['v = λ · f',nf(l)+' × '+f+' = '+nf(v)+' m/s']}; },
  ohm(){ const k=ri(0,4), R=one([2,4,5,10,20,50]), i=one([1,2,3,4,5]), U=R*i;

    if(k===1) return {t:'fis-eldin',q:'Corrente num resistor de '+R+' Ω ligado a '+U+' V?',...numOpts(i,'A',[U*R,R/U,i+1]),steps:['i = U / R',U+' ÷ '+R+' = '+i+' A']};
    if(k===2) return {t:'fis-eldin',q:'Potência de um aparelho em '+U+' V com corrente de '+i+' A?',...numOpts(U*i,'W',[U/i,U+i,U*i*2]),steps:['P = U · i',U+' × '+i+' = '+(U*i)+' W']};

    return {t:'fis-eldin',q:'Dois resistores iguais de '+R+' Ω em paralelo. Resistência equivalente?',...numOpts(R/2,'Ω',[R*2,R,R/4]),steps:['Dois iguais em paralelo: R/2',R+' ÷ 2 = '+nf(R/2)+' Ω']}; },
  mol(){ const [f,M]=one([['H₂O',18],['CO₂',44],['O₂',32],['CH₄',16],['NaOH',40],['CaCO₃',100]]), n=one([0.5,1,2,3,4,5]), m=n*M;

  dil(){ const C1=one([10,20,30,40,60]), V1=one([100,200,300]), k=one([2,3,4,5]), V2=V1*k, C2=C1/k; return {t:'qui-sol',q:V1+' mL de solução a '+C1+' g/L são diluídos até '+V2+' mL. Nova concentração?',...numOpts(C2,'g/L',[C1*k,C1-k,C2*2]),steps:['C₁ · V₁ = C₂ · V₂',C1+' × '+V1+' = C₂ × '+V2,'C₂ = '+nf(C2)+' g/L']}; },
  ph(){ const n=ri(1,13); if(Math.random()<.5) return {t:'qui-eq',q:'[H⁺] = 10'+sup(-n)+' mol/L. Qual o pH?',...numOpts(n,'',[14-n,-n,n+1]),steps:['pH = −log [H⁺]','−log 10'+sup(-n)+' = '+n,n<7?'pH < 7: ácido':(n>7?'pH > 7: básico':'pH 7: neutro')]};

  atom(){ const [el,Z,A]=one([['Na',11,23],['Cl',17,35],['C',6,12],['O',8,16],['Fe',26,56],['Ca',20,40],['K',19,39],['Al',13,27]]);

  boyle(){ const P1=one([1,2,3,4]), V1=one([6,8,12,24]), P2=one([2,3,4,6]); const V2=P1*V1/P2; if(V2%1) return GEN.boyle();

  r:0,x:'"Capital do Paraná" é aposto explicativo de "Curitiba" e deve vir isolado por vírgulas. As demais alternativas separam indevidamente sujeito e verbo, ou verbo e complemento.'},
 {q:'Assinale a alternativa correta quanto ao uso do ponto e vírgula.',
  o:['Levou o capacete; e as luvas para o treino.','Na guarnição havia: um motorista, um socorrista; e um comandante.','No treino, os recrutas correram; nadaram; e praticaram primeiros socorros.','Na sala havia recrutas atentos; na sala ao lado, instrutores concentrados.','Ele chegou; cedo ao quartel.'],
  r:3,x:'O ponto e vírgula é adequado para separar orações coordenadas mais longas ou com sentido próprio, especialmente quando já há vírgulas internas, como em "Na sala havia recrutas atentos; na sala ao lado, instrutores concentrados." As demais empregam o ponto e vírgula de forma indevida, no lugar de vírgula simples ou sem função sintática clara.'},
 {q:'Assinale a alternativa em que os dois-pontos foram empregados corretamente.',
  o:['Ele chegou: atrasado ao plantão.','Ele disse: que chegaria atrasado.','O motivo foi: o trânsito intenso.','Faltou apenas uma coisa: coragem.','Chegamos: cedo ao local.'],
  r:3,x:'Os dois-pontos anunciam corretamente um esclarecimento final em "Faltou apenas uma coisa: coragem." Nas demais, os dois-pontos rompem indevidamente a ligação entre verbo e complemento ou antecedem uma oração subordinada sem valor de citação direta.'},

 
 {q:'Assinale a alternativa em que a ausência de vírgula compromete a norma-padrão.',
  o:['Se chover, a operação será adiada.','Quando o alarme tocou todos saíram.','Concluído o curso, os alunos seguiram para o batalhão.','Estudou muito e, por isso, foi bem na prova.','Embora estivesse cansado, continuou o plantão.'],
  r:1,x:'Orações subordinadas deslocadas para o início do período devem vir separadas por vírgula da oração principal. Em "Quando o alarme tocou todos saíram", falta a vírgula depois de "tocou": o correto é "Quando o alarme tocou, todos saíram." As demais alternativas já estão pontuadas corretamente.'}
]},

'port-int':{qs:[
 {q:'Texto: "O treinamento de resgate em altura exige, além de equipamento adequado, disciplina rigorosa: um único descuido pode custar caro à guarnição inteira." Assinale a ideia central do trecho.',
  o:['O equipamento é mais importante que a disciplina no resgate em altura.','A disciplina, tanto quanto o equipamento, é essencial para a segurança no resgate em altura.','O resgate em altura não pode ser realizado com segurança.','Apenas descuidos individuais causam acidentes em resgates.','O treinamento de resgate em altura é dispensável quando há bom equipamento.'],
  r:1,x:'O texto afirma que o treinamento exige equipamento adequado "além de" disciplina rigorosa, colocando as duas condições como necessárias, sem hierarquizar uma acima da outra.'},
 {q:'Texto: "Nem sempre a ocorrência mais grave é a que chega primeiro ao rádio. Por isso, a triagem de chamados é tão decisiva quanto o combate ao incêndio em si." A relação estabelecida pela expressão "Por isso" é de',
  o:['comparação','conclusão/consequência','concessão','condição','finalidade'],
  r:1,x:'"Por isso" introduz uma consequência lógica da ideia anterior, estabelecendo uma relação de conclusão/consequência entre as duas orações.'},
 {q:'Texto: "Embora o número de chamadas tenha caído em relação ao ano anterior, a gravidade média das ocorrências aumentou." Depreende-se do texto que',
  o:['houve mais chamadas e mais ocorrências graves.','houve menos chamadas, mas as ocorrências ficaram mais graves em média.','o número de chamadas e a gravidade caíram juntos.','a gravidade das ocorrências não pode ser medida.','o texto não permite nenhuma conclusão sobre gravidade.'],
  r:1,x:'A conjunção concessiva "embora" contrapõe a queda no número de chamadas ao aumento da gravidade média, exatamente o que a alternativa B expressa.'},
 {q:'Texto: "Mais importante do que memorizar o manual é entender por que cada procedimento existe." A palavra "por que" está empregada, nesse contexto, com o sentido de',
  o:['tempo','pelo qual (motivo)','lugar','condição','quantidade'],
  r:1,x:'"Por que" antes de substantivo abstrato como "existe" tem valor de "por qual motivo/razão", introduzindo uma causa.'},
 {q:'Texto: "O comandante insistiu: revisar o equipamento antes de cada plantão não é burocracia, é sobrevivência." O efeito de sentido da frase final é de',
  o:['dúvida sobre a necessidade da revisão','ênfase na importância vital da revisão do equipamento','crítica à existência de regras burocráticas','indiferença quanto ao procedimento','ironia sobre o comandante'],
  r:1,x:'Ao contrapor "burocracia" a "sobrevivência", o texto reforça, de forma enfática, que a revisão do equipamento é uma questão de vida ou morte, e não uma formalidade.'}
]},
