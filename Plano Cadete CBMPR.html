/* ---------- PORTUGUÊS ---------- */
'port-int':'**Compreender** é achar o que o texto diz; **interpretar** é concluir o que ele permite concluir.\n• Ideia principal: costuma estar no tópico frasal (início do parágrafo) ou no fechamento.\n• Inferência: conclusão que o texto autoriza, mesmo sem dizer com todas as letras.\n• Os três erros que a banca planta: **extrapolação** (vai além do texto), **redução** (pega só uma parte) e **contradição** (diz o oposto).\n**Como cai:** "De acordo com o texto" pede o literal; "infere-se" pede conclusão.\n**Pegadinha:** alternativa verdadeira no mundo real, mas que o texto não sustenta. Está errada.',
'port-gen':'**Tipos textuais** são poucos: narrativo (fatos no tempo), descritivo (características), dissertativo-argumentativo (defende tese), expositivo (informa sem opinar) e injuntivo (instrui: receitas, manuais).\n**Gêneros** são infinitos: notícia, reportagem, editorial, artigo de opinião, crônica, charge, ofício, bula.\n• Editorial: opinião do veículo, sem assinatura. Artigo de opinião: opinião assinada.\n• Notícia: fato recente, 3ª pessoa, linguagem objetiva.\n**Pegadinha:** um gênero mistura tipos. A pergunta quer o tipo **predominante**.',
'port-coe':'**Coesão** é a costura gramatical: pronomes, sinônimos, elipses e conectivos. **Coerência** é o sentido lógico do todo.\n• Oposição: mas, porém, contudo, todavia, entretanto, no entanto.\n• Concessão: embora, ainda que, mesmo que, apesar de.\n• Causa: porque, já que, visto que, uma vez que.\n• Conclusão: logo, portanto, por isso, assim.\n• Condição: se, caso, desde que. Finalidade: para que, a fim de que. Proporção: à medida que.\n**Pegadinha:** "pois" antes do verbo explica; depois do verbo, entre vírgulas, conclui ("Estudou; passará, pois, na prova").',
'port-ort':'**Acentuação:** proparoxítonas, todas. Oxítonas em a(s), e(s), o(s), em, ens. Paroxítonas em l, n, r, x, ps, ã(s), ão(s), i(s), us, um, uns e ditongo.\n• Acordo de 2009: sem acento em "ideia", "heroico", "voo", "leem"; trema extinto.\n• Porquês: **por que** (pergunta ou "pelo qual"), **por quê** (fim de frase), **porque** (explicação), **porquê** (substantivo).\n• Mal (oposto de bem) x mau (oposto de bom). Há (tempo passado) x a (futuro ou distância).\n**Pegadinha:** "Há dez anos atrás" é redundante; use um ou outro.',
'port-cla':'**Dez classes:** substantivo, adjetivo, artigo, numeral, pronome, verbo (variáveis) e advérbio, preposição, conjunção, interjeição (invariáveis).\n• A classe depende do uso na frase, não da palavra isolada.\n• "Meio" advérbio não varia: "ela está meio cansada".\n• "Bastante" adjetivo varia (bastantes provas); advérbio, não (estudou bastante).\n• O "que" pode ser pronome relativo (substitui "o qual"), conjunção integrante, advérbio de intensidade.\n**Pegadinha:** substantivação: "o **não** dele doeu" transforma advérbio em substantivo.',
'port-sint':'**Termos essenciais:** sujeito e predicado. **Integrantes:** objeto direto, objeto indireto, complemento nominal, agente da passiva. **Acessórios:** adjunto adnominal, adjunto adverbial, aposto. Vocativo fica à parte.\n• Coordenadas: aditivas, adversativas, alternativas, conclusivas, explicativas.\n• Subordinadas: substantivas (valor de substantivo), adjetivas (restritivas sem vírgula; explicativas entre vírgulas) e adverbiais (causa, condição, concessão, tempo...).\n**Pegadinha:** complemento nominal completa nome de sentido passivo ("a defesa **da cidade**"); adjunto adnominal indica posse ou agente ("a defesa **do bombeiro**").',
'port-conc':'**Verbal:** o verbo concorda com o núcleo do sujeito.\n• "Haver" (existir) e "fazer" (tempo) são impessoais: singular, e o auxiliar também ("deve haver").\n• Voz passiva sintética concorda: "vendem-se casas". Índice de indeterminação fica no singular: "precisa-se de bombeiros".\n• Sujeito composto antes do verbo: plural.\n**Nominal:** o adjetivo concorda com o substantivo. Anexo, incluso, obrigado, mesmo, quite variam; menos e alerta, nunca.\n**Pegadinha:** "É proibido entrada" (sem artigo) x "É proibida a entrada" (com artigo).',
'port-reg':'**Regência verbal clássica:** assistir (ver) pede "a"; assistir (ajudar) é direto. Visar (objetivar) pede "a". Aspirar (desejar) pede "a". Obedecer e desobedecer pedem "a". Preferir A a B, sem "do que" e sem "mais". Implicar (acarretar) é direto. Chegar e ir pedem "a".\n**Crase** = preposição a + artigo a.\n• Proibida: antes de masculino, verbo, pronomes pessoais e de tratamento, "uma", e em "cara a cara".\n• Obrigatória: horas determinadas, "à moda de", locuções femininas (às vezes, à noite).\n• Facultativa: antes de possessivo feminino, de nome de mulher e depois de "até".\n**Teste:** troque por masculino; se virar "ao", há crase.',
'port-pont':'**Vírgula nunca separa** sujeito do verbo nem verbo do complemento.\n• Separa: adjunto adverbial deslocado (longo, obrigatória; curto, facultativa), aposto explicativo, vocativo, oração adjetiva explicativa, conjunção intercalada ("é, porém, necessário"), orações coordenadas sem conectivo e verbo omitido (zeugma).\n• Ponto e vírgula: separa itens longos ou orações que já têm vírgula.\n• Dois-pontos: enumeração, citação, explicação.\n**Pegadinha:** "Os candidatos, que estudaram, passaram" (todos estudaram) x "Os candidatos que estudaram passaram" (só alguns).',
'port-col':'**Próclise** (pronome antes do verbo) quando há palavra atrativa: negação, advérbio sem vírgula, pronomes relativos, indefinidos e demonstrativos, conjunções subordinativas, frases exclamativas, interrogativas e optativas.\n**Mesóclise** com futuro do presente ou do pretérito sem atrativo: "far-se-á", "dir-lhe-ia".\n**Ênclise** no início de frase, com imperativo afirmativo, gerúndio (sem "em") e infinitivo impessoal.\n**Regra de ouro:** na norma-padrão, não se começa frase com pronome oblíquo átono. "Me disseram" é informal; "Disseram-me" é padrão.\n**Pegadinha:** "Não **o** vi" (a negação atrai).',
'port-sem':'**Sinônimos, antônimos, homônimos e parônimos.**\n• Homófonos: cela/sela, concerto (espetáculo)/conserto (reparo), sessão (reunião)/seção (divisão)/cessão (ato de ceder).\n• Parônimos: eminente (ilustre)/iminente (prestes a acontecer); descrição/discrição; flagrante/fragrante; ratificar (confirmar)/retificar (corrigir); infligir (aplicar pena)/infringir (violar); deferir (atender)/diferir (adiar).\n• Denotação (sentido literal) x conotação (figurado).\n• Figuras: metáfora, metonímia, hipérbole, eufemismo, ironia, antítese, paradoxo.\n**Pegadinha:** o sentido de uma palavra se decide pelo contexto da frase.',
/* ---------- MATEMÁTICA ---------- */
'mat-ops':'**Frações:** somar pede MMC; multiplicar é numerador × numerador e denominador × denominador; dividir é multiplicar pelo inverso.\n**Potências:** aᵐ · aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐ·ⁿ; a⁰ = 1; a⁻ⁿ = 1/aⁿ.\n**Raízes:** √(a·b) = √a · √b; racionalize o denominador multiplicando pela raiz.\n**Ordem:** parênteses, potências e raízes, multiplicação e divisão, soma e subtração.\n**Pegadinha:** (−2)² = 4, mas −2² = −4. O sinal só entra no quadrado se estiver dentro do parêntese.',
'mat-prop':'**Razão** é divisão (a/b). **Proporção** é igualdade de razões: produto dos meios = produto dos extremos.\n• Regra de três direta: as grandezas crescem juntas (mais quilos, mais caro).\n• Inversa: uma cresce e a outra cai (mais bombeiros, menos horas). Inverta a razão antes de multiplicar em cruz.\n• Composta: compare cada grandeza com a incógnita, uma por vez.\n• Escala = medida no desenho ÷ medida real.\n**Pegadinha:** a banca esconde a proporção inversa em problemas de "trabalho" e "velocidade".',
'mat-porc':'**p% = p/100.** Aumento de p%: multiplique por (1 + p/100). Desconto: por (1 − p/100).\n• Aumentos e descontos sucessivos se multiplicam: +10% e depois −10% dão 1,1 × 0,9 = 0,99, ou seja, −1%.\n• Juros simples: J = C · i · t; montante M = C + J.\n• Juros compostos: M = C · (1 + i)ᵗ.\n**Pegadinha:** taxa e tempo precisam estar na mesma unidade (taxa mensal com tempo em meses).',
'mat-eq':'**1º grau:** isole o x fazendo a mesma operação dos dois lados.\n**2º grau:** Δ = b² − 4ac e x = (−b ± √Δ) / 2a.\n• Δ > 0: duas raízes reais diferentes; Δ = 0: uma raiz (dupla); Δ < 0: nenhuma raiz real.\n• Soma das raízes = −b/a; produto = c/a (atalho que resolve muita questão).\n**Inequações:** multiplicou ou dividiu por número negativo, inverta o sinal da desigualdade.\n**Sistemas:** substituição ou adição.\n**Pegadinha:** esquecer de verificar se a raiz faz sentido no problema (tempo e comprimento não são negativos).',
'mat-fun':'**Afim:** f(x) = ax + b. "a" é a inclinação (a > 0, crescente); "b" é onde a reta corta o eixo y; raiz em x = −b/a.\n**Quadrática:** f(x) = ax² + bx + c. Parábola com concavidade para cima se a > 0 (tem mínimo) e para baixo se a < 0 (tem máximo).\n• Vértice: xv = −b/2a e yv = −Δ/4a.\n• "c" é onde corta o eixo y.\n• Função composta: f(g(x)), resolva de dentro para fora.\n**Como cai:** problemas de lucro máximo e altura máxima de lançamento pedem o vértice.',
'mat-exp':'**Exponencial:** f(x) = aˣ; cresce se a > 1 e decresce se 0 < a < 1. Para resolver, iguale as bases.\n**Logaritmo:** log_b a = x ⇔ bˣ = a (a > 0, b > 0 e b ≠ 1).\n• log(a·b) = log a + log b; log(a/b) = log a − log b; log aⁿ = n · log a.\n• Mudança de base: log_b a = log a / log b.\n• log 1 = 0; log_b b = 1; log 10 = 1.\n**Onde aparece:** pH, crescimento populacional, decaimento radioativo, juros compostos.',
'mat-pa':'**PA** (soma uma razão r): aₙ = a₁ + (n − 1) · r; Sₙ = n · (a₁ + aₙ) / 2.\n• Três termos em PA: o do meio é a média dos vizinhos.\n**PG** (multiplica por q): aₙ = a₁ · qⁿ⁻¹; Sₙ = a₁ · (qⁿ − 1) / (q − 1).\n• Soma infinita (|q| < 1): S = a₁ / (1 − q).\n• Três termos em PG: o do meio ao quadrado é o produto dos vizinhos.\n**Pegadinha:** conferir se a sequência soma (PA) ou multiplica (PG) antes de escolher a fórmula.',
'mat-comb':'**Princípio fundamental da contagem:** etapas independentes se multiplicam.\n• Permutação: n! (todos em fila).\n• Arranjo: A = n! / (n − p)! quando a **ordem importa** (senha, pódio).\n• Combinação: C = n! / [p! (n − p)!] quando a **ordem não importa** (comissão, aperto de mão).\n• Anagramas com letras repetidas: divida pelo fatorial das repetições.\n**Probabilidade** = casos favoráveis ÷ casos possíveis. Eventos independentes (e) multiplicam; excludentes (ou) somam; o complementar é 1 − P.\n**Pegadinha:** trocar arranjo por combinação. Pergunte-se: trocar a ordem gera outro resultado?',
'mat-est':'**Média** = soma ÷ quantidade. Ponderada: cada valor vezes o seu peso, dividido pela soma dos pesos.\n**Mediana:** o termo central **depois de ordenar**; com quantidade par, a média dos dois centrais.\n**Moda:** o valor que mais aparece (pode haver mais de uma ou nenhuma).\n**Dispersão:** amplitude (maior − menor); variância (média dos quadrados dos desvios); desvio padrão = √variância.\n**Pegadinha:** calcular a mediana sem ordenar os dados.',
'mat-mtz':'**Matriz m × n:** m linhas, n colunas.\n• Soma: só com a mesma ordem.\n• Produto A(m×n) · B(n×p) só existe se as colunas de A = linhas de B; resulta m × p. Não é comutativo.\n**Determinante:** 2×2 é ad − bc; 3×3, regra de Sarrus.\n• Linha de zeros ou duas linhas iguais: det = 0. Trocar duas linhas troca o sinal. det(kA) = kⁿ · det A.\n• det ≠ 0: matriz inversível e sistema com solução única (SPD).\n**Sistemas:** SPD (uma solução), SPI (infinitas), SI (nenhuma).',
'mat-trig':'**No triângulo retângulo:** sen = oposto/hipotenusa; cos = adjacente/hipotenusa; tg = oposto/adjacente.\n**Ângulos notáveis:** 30°: sen 1/2, cos √3/2, tg √3/3. 45°: sen e cos √2/2, tg 1. 60°: sen √3/2, cos 1/2, tg √3.\n• Relação fundamental: sen² x + cos² x = 1.\n• Lei dos senos: a/sen A = b/sen B. Lei dos cossenos: a² = b² + c² − 2bc · cos A.\n• π rad = 180°.\n**Macete:** o seno de 30° é igual ao cosseno de 60° (ângulos complementares trocam seno e cosseno).',
'mat-gp':'**Áreas:** retângulo b·h; triângulo b·h/2; trapézio (B + b)·h/2; losango D·d/2; círculo π·r²; comprimento da circunferência 2π·r.\n• Pitágoras: hipotenusa² = cateto² + cateto². Ternos: 3-4-5, 5-12-13, 8-15-17.\n• Soma dos ângulos internos: (n − 2) · 180°; no triângulo, 180°.\n• Semelhança: se os lados dobram (razão k), a área multiplica por k².\n• Hexágono regular = 6 triângulos equiláteros.\n**Pegadinha:** unidade de área ao quadrado (m²) e conversões (1 m² = 10.000 cm²).',
'mat-ge':'**Volumes:** prisma = área da base × altura; cubo a³; paralelepípedo a·b·c; cilindro π·r²·h; pirâmide e cone = (área da base × altura)/3; esfera 4π·r³/3 (área 4π·r²).\n• 1 m³ = 1.000 L e 1 dm³ = 1 L (conta clássica de caixa d’água e reservatório de incêndio).\n• Diagonal do cubo: a√3; do paralelepípedo: √(a² + b² + c²).\n**Pegadinha:** pirâmide e cone têm o "÷ 3"; esquecer dá o triplo.',
'mat-analit':'**Distância entre pontos:** d = √(Δx² + Δy²).\n**Ponto médio:** ((x₁ + x₂)/2, (y₁ + y₂)/2).\n**Coeficiente angular:** m = Δy/Δx. Reta: y − y₀ = m(x − x₀).\n• Paralelas: mesmo m. Perpendiculares: m₁ · m₂ = −1.\n**Circunferência:** (x − a)² + (y − b)² = r², centro (a, b) e raio r.\n**Como cai:** distância com números que formam terno pitagórico (3-4-5) e alinhamento de pontos.',
'mat-calc':'**Limite:** o valor de que f(x) se aproxima quando x tende a um ponto.\n**Derivada:** taxa de variação instantânea, a inclinação da reta tangente.\n• (xⁿ)′ = n · xⁿ⁻¹; constante tem derivada 0; a derivada da soma é a soma das derivadas.\n• Máximos e mínimos acontecem onde f′(x) = 0.\n**Integral:** área sob a curva; ∫xⁿ dx = xⁿ⁺¹/(n + 1) + C.\n**Ponte com a Física:** velocidade é a derivada da posição; aceleração, a derivada da velocidade.',
/* ---------- FÍSICA ---------- */
'fis-unid':'**SI:** metro (m), quilograma (kg), segundo (s), ampère (A), kelvin (K), mol, candela (cd).\n• Derivadas: newton N = kg·m/s²; joule J = N·m; watt W = J/s; pascal Pa = N/m².\n• Prefixos: k = 10³, M = 10⁶, G = 10⁹; c = 10⁻², m = 10⁻³, µ = 10⁻⁶, n = 10⁻⁹.\n• Notação científica: a × 10ⁿ com 1 ≤ a < 10.\n• km/h ÷ 3,6 = m/s.\n• Escalar (só módulo: massa, tempo, energia) x vetorial (módulo, direção e sentido: força, velocidade).\n**Pegadinha:** o símbolo do quilograma é kg (minúsculo) e a massa não é peso.',
'fis-cin':'**MU:** s = s₀ + v·t.\n**MUV:** v = v₀ + a·t; s = s₀ + v₀·t + a·t²/2; Torricelli: v² = v₀² + 2a·Δs (quando não há tempo).\n**Queda livre:** g ≈ 10 m/s²; v = g·t; h = g·t²/2. No lançamento vertical, v = 0 no ponto mais alto.\n**Gráficos:** no v × t, a área é o deslocamento e a inclinação é a aceleração; no s × t, a inclinação é a velocidade.\n**Pegadinha:** velocidade média = deslocamento total ÷ tempo total, e não a média das velocidades.',
'fis-din':'**1ª lei (inércia):** sem força resultante, o corpo mantém repouso ou MRU.\n**2ª lei:** F = m · a (força resultante).\n**3ª lei:** ação e reação têm mesma intensidade e sentidos opostos, em **corpos diferentes** (por isso nunca se anulam).\n• Peso P = m·g; atrito Fat = µ·N (o estático é maior que o cinético).\n• Plano inclinado: P·sen θ puxa rampa abaixo; P·cos θ equilibra a normal.\n• Centrípeta: Fc = m·v²/R.\n**No serviço:** o recuo do esguicho é a reação do jato d’água.',
'fis-ene':'**Trabalho:** τ = F·d·cos θ. **Energia cinética:** Ec = m·v²/2. **Potencial gravitacional:** Ep = m·g·h. **Elástica:** k·x²/2.\n• Sem atrito, a energia mecânica se conserva: quem cai de h chega com v = √(2gh).\n• Teorema da energia cinética: τ total = ΔEc.\n• Potência: P = τ/t = F·v. Rendimento: útil ÷ total.\n• 1 kWh = 3,6 × 10⁶ J; 1 cv ≈ 735 W.\n**Pegadinha:** dobrar a velocidade quadruplica a energia cinética.',
'fis-qm':'**Quantidade de movimento:** Q = m·v (vetor).\n**Impulso:** I = F·Δt = ΔQ.\n• Sistema isolado (colisões, explosões, recuo de arma): Q antes = Q depois.\n• Colisão elástica conserva a energia cinética; inelástica perde; perfeitamente inelástica: os corpos seguem juntos.\n**Aplicação:** air bag e capacete aumentam o tempo de impacto e reduzem a força (mesmo impulso, Δt maior).\n**Pegadinha:** a quantidade de movimento se conserva mesmo quando a energia cinética não se conserva.',
'fis-hid':'**Densidade:** d = m/V. **Pressão:** p = F/A.\n**Stevin:** p = p₀ + d·g·h. Cada 10 m de água ≈ +1 atm (≈ 10⁵ Pa).\n**Pascal:** a pressão se transmite integralmente (prensa hidráulica: F₁/A₁ = F₂/A₂).\n**Arquimedes:** empuxo E = d(líquido) · V(deslocado) · g. Flutua se o corpo for menos denso que o líquido.\n**Vazão:** Q = A·v = V/t. Continuidade: A₁·v₁ = A₂·v₂ (bico mais estreito, jato mais rápido).\n**Bernoulli:** onde a velocidade é maior, a pressão é menor.',
'fis-term':'**Escalas:** C/5 = (F − 32)/9 = (K − 273)/5.\n**Calor sensível:** Q = m·c·ΔT. **Latente:** Q = m·L (mudança de estado, temperatura constante).\n• Água: c = 1 cal/g·°C e calor latente de vaporização ≈ 540 cal/g. Por isso é o melhor agente de resfriamento.\n• Dilatação: ΔL = L₀·α·ΔT; superficial 2α; volumétrica 3α.\n• Propagação: condução (contato), convecção (fluidos em movimento), irradiação (ondas, até no vácuo).\n**Pegadinha:** temperatura não é calor. Calor é energia em trânsito.',
'fis-tdin':'**Gás ideal:** P·V = n·R·T, com T em kelvin.\n• Isotérmica (T constante): P·V constante. Isobárica: V/T constante. Isocórica: P/T constante. Adiabática: sem troca de calor.\n**1ª lei:** ΔU = Q − τ; na isobárica, τ = P·ΔV.\n**2ª lei:** o calor flui sozinho do quente para o frio; nenhuma máquina converte todo o calor em trabalho.\n• Rendimento: η = τ/Q₁ = 1 − Q₂/Q₁. Carnot: η = 1 − T₂/T₁ (kelvin).\n**No serviço:** cilindro aquecido em incêndio tem a pressão aumentada (isocórica). Risco de ruptura.',
'fis-ond':'**v = λ · f** e **T = 1/f**.\n• Transversais (luz, corda) x longitudinais (som).\n• Mecânicas precisam de meio (o som não se propaga no vácuo); eletromagnéticas não.\n• O som é mais rápido nos sólidos que no ar.\n• Fenômenos: reflexão (eco), refração, difração, interferência, ressonância.\n• **Efeito Doppler:** a sirene que se aproxima soa mais aguda; afastando, mais grave.\n• Qualidades do som: altura (frequência), intensidade (volume, dB), timbre.\n**Pegadinha:** frequência depende da fonte; na refração, muda a velocidade e o comprimento de onda.',
'fis-opt':'**Reflexão:** ângulo de incidência = ângulo de reflexão.\n• Espelho plano: imagem virtual, direita, do mesmo tamanho e simétrica.\n• Côncavo: converge a luz; pode formar imagem real. Convexo: imagem virtual, direita e menor, com campo visual maior (retrovisores).\n**Refração:** n = c/v; Snell: n₁·sen θ₁ = n₂·sen θ₂.\n• Gauss: 1/f = 1/p + 1/p′. Vergência (dioptria) = 1/f, com f em metros.\n• Miopia corrige com lente divergente; hipermetropia, com convergente.',
'fis-elst':'• Carga elementar: e = 1,6 × 10⁻¹⁹ C. Iguais se repelem; opostas se atraem.\n• Eletrização por atrito (cargas opostas), contato (mesmo sinal) e indução (sinal oposto, sem contato).\n• Coulomb: F = k·|q₁·q₂|/d², com k = 9 × 10⁹ N·m²/C². Dobrou a distância, a força cai a um quarto.\n• Campo elétrico: E = F/q.\n• Em condutor em equilíbrio, as cargas ficam na superfície (gaiola de Faraday); pontas concentram cargas (para-raios).\n**Pegadinha:** a força depende do inverso do **quadrado** da distância.',
'fis-eldin':'**Corrente:** i = Q/Δt (ampère). **1ª lei de Ohm:** U = R·i. **2ª lei:** R = ρ·L/A.\n**Potência:** P = U·i = R·i² = U²/R. **Energia:** E = P·Δt (kWh na conta de luz).\n• Série: resistências somam e a corrente é a mesma.\n• Paralelo: 1/Req = soma dos inversos e a tensão é a mesma (a instalação da casa é em paralelo).\n• Fusível e disjuntor protegem contra sobrecorrente.\n**No serviço:** efeito Joule em fiação sobrecarregada é causa clássica de incêndio.',
'fis-msolid':'**Torque (momento):** M = F·d, onde d é o braço de alavanca.\n**Equilíbrio de corpo extenso:** força resultante nula e momento resultante nulo.\n• Alavancas: interfixa (apoio no meio: tesoura, gangorra), inter-resistente (resistência no meio: carrinho de mão), interpotente (força no meio: pinça).\n• Centro de gravidade: ponto de aplicação do peso; apoio abaixo dele dá estabilidade.\n• Lei de Hooke: F = k·x.\n**Fluidos:** retome pressão, empuxo e vazão (tópico de Hidrostática).',
/* ---------- QUÍMICA ---------- */
'qui-mat':'**Substância pura** (simples: O₂; composta: H₂O) x **mistura** (homogênea, 1 fase; heterogênea, 2 ou mais fases).\n• Mudanças de estado: fusão, vaporização (evaporação, ebulição, calefação), condensação, solidificação, sublimação.\n• Separação de heterogêneas: filtração, decantação, centrifugação, catação, peneiração, separação magnética.\n• Homogêneas: destilação simples (sólido + líquido) e fracionada (líquidos com pontos de ebulição diferentes).\n• Fenômeno químico forma substância nova; físico, não.\n• Alotropia: O₂ e O₃; diamante e grafite.',
'qui-atom':'**Z** = prótons; **A** = Z + nêutrons.\n• Cátion perdeu elétrons; ânion ganhou.\n• Isótopos: mesmo Z. Isóbaros: mesmo A. Isótonos: mesmo número de nêutrons.\n• Modelos: Dalton (bola maciça), Thomson (pudim de passas), Rutherford (núcleo e eletrosfera), Bohr (níveis de energia).\n• Tabela: períodos = camadas; família 1 alcalinos, 2 alcalino-terrosos, 17 halogênios, 18 gases nobres.\n• Eletronegatividade cresce para cima e para a direita (flúor é o maior). Raio atômico cresce para baixo e para a esquerda.',
'qui-radio':'• **Alfa (α):** núcleo de hélio (Z − 2, A − 4); pouco penetrante, uma folha de papel detém.\n• **Beta (β):** elétron emitido (Z + 1, A igual); o alumínio detém.\n• **Gama (γ):** onda eletromagnética; muito penetrante, exige chumbo ou concreto.\n• **Meia-vida:** a cada período, a massa cai à metade: m = m₀/2ⁿ.\n• Fissão (núcleo pesado se divide: usinas) x fusão (núcleos leves se unem: Sol).\n• Aplicações: radioterapia, iodo-131, datação por carbono-14.\n**Caso brasileiro:** acidente com césio-137 em Goiânia (1987).',
'qui-lig':'• **Iônica:** metal + ametal, transferência de elétrons (NaCl). Sólidos, alto ponto de fusão; conduzem fundidos ou em solução.\n• **Covalente:** ametal + ametal ou hidrogênio, compartilhamento (H₂O, CO₂).\n• **Metálica:** metal + metal, "mar de elétrons"; conduz corrente.\n• Regra do octeto: estabilidade com 8 elétrons na camada de valência.\n**Forças intermoleculares:** ligação de hidrogênio (H ligado a F, O ou N) > dipolo-dipolo > dipolo induzido.\n**Pegadinha:** a ligação de hidrogênio explica o alto ponto de ebulição da água. Semelhante dissolve semelhante.',
'qui-gas':'**Variáveis:** pressão, volume e temperatura (sempre em kelvin).\n• Boyle (T constante): P₁V₁ = P₂V₂.\n• Charles/Gay-Lussac (P constante): V/T constante. Isocórica (V constante): P/T constante.\n• Geral: P₁V₁/T₁ = P₂V₂/T₂. Clapeyron: PV = nRT (R = 0,082 atm·L/mol·K).\n• CNTP (0 °C, 1 atm): 1 mol de gás ocupa 22,4 L.\n• Mistura: cada gás exerce a sua pressão parcial (Dalton).\n**No serviço:** recipiente de gás aquecido aumenta de pressão. É a base do risco de BLEVE.',
'qui-inorg':'• **Ácido** (libera H⁺): sem oxigênio termina em -ídrico (HCl); com oxigênio, -ico ou -oso (H₂SO₄). Fortes: HCl, HBr, HI, H₂SO₄, HNO₃.\n• **Base** (libera OH⁻): hidróxidos. Fortes: das famílias 1 e 2 (exceto Be e Mg).\n• **Sal:** ácido + base → sal + água (neutralização). Terminações -eto, -ato, -ito.\n• **Óxido:** binário com oxigênio. Ácido (CO₂, SO₃: chuva ácida), básico (CaO), neutro (CO, NO).\n• Indicadores: fenolftaleína fica rosa em base; tornassol azul em base e vermelho em ácido.',
'qui-reac':'• **Síntese:** A + B → AB.\n• **Decomposição:** AB → A + B (pelo calor: pirólise; pela luz: fotólise; pela eletricidade: eletrólise).\n• **Simples troca:** A + BC → AC + B (só se A for mais reativo).\n• **Dupla troca:** AB + CD → AD + CB (ocorre se formar precipitado, gás ou água).\n**Balanceamento:** a massa se conserva (Lavoisier). Método das tentativas na ordem: metais, ametais, carbono, hidrogênio, oxigênio.\n**Combustão:** completa gera CO₂ + H₂O; incompleta gera CO (tóxico) e fuligem.',
'qui-esteq':'**Mol** = 6,02 × 10²³ entidades. **Massa molar** (g/mol) = soma das massas atômicas.\n• n = m/M. Nas CNTP, 1 mol de gás = 22,4 L.\n**Roteiro de toda questão:**\n1. Balanceie a equação.\n2. Leia a proporção em mols pelos coeficientes.\n3. Converta para a unidade pedida (massa, volume, moléculas).\n• Reagente limitante: o que acaba primeiro e define o produto.\n• Pureza e rendimento: multiplique pela porcentagem no final.\n**Pegadinha:** usar a proporção sem balancear.',
'qui-sol':'**Solução** = soluto + solvente.\n• Concentração comum: C = m/V (g/L). Molaridade: M = n/V (mol/L).\n• Título/percentual: massa do soluto ÷ massa da solução.\n• Diluição: C₁·V₁ = C₂·V₂ (o soluto não muda, só o volume).\n• Mistura de soluções do mesmo soluto: some C·V e divida pelo volume total.\n• Saturada (no limite), insaturada, supersaturada (instável).\n**Pegadinha:** volume em litros. 250 mL = 0,25 L.',
'qui-termo':'**Entalpia (ΔH):**\n• Exotérmica libera calor, ΔH < 0 (combustão, condensação).\n• Endotérmica absorve calor, ΔH > 0 (fusão do gelo, fotossíntese).\n• **Lei de Hess:** o ΔH total é a soma das etapas, qualquer que seja o caminho.\n• Energia de ligação: romper absorve; formar libera.\n• Combustão completa (CO₂) x incompleta (CO, monóxido de carbono, gás tóxico e inodoro).\n**Ponte com o combate:** toda combustão é exotérmica, e é esse calor que realimenta o fogo.',
'qui-cin':'**Velocidade** = variação da concentração ÷ tempo.\n**Aumentam a velocidade:** temperatura maior, concentração maior, **superfície de contato** maior, catalisador, pressão (em gases).\n• Catalisador baixa a energia de ativação, não é consumido e não altera o ΔH.\n• Teoria das colisões: só reage a colisão com energia mínima e orientação favorável.\n• Inibidor: diminui a velocidade.\n**No serviço:** serragem e pó queimam muito mais rápido que a madeira em bloco. É a superfície de contato (explosão de poeira).',
'qui-eq':'**Equilíbrio:** velocidade direta = velocidade inversa.\n• Kc = [produtos]^coef / [reagentes]^coef. Sólidos e líquidos puros ficam fora.\n**Le Chatelier:** o sistema reage contra a perturbação.\n• Mais reagente desloca para os produtos.\n• Mais pressão desloca para o lado com menos mols de gás.\n• Mais temperatura favorece o sentido endotérmico.\n• Catalisador **não** desloca o equilíbrio.\n**pH** = −log[H⁺]; pH + pOH = 14 (25 °C); pH < 7 ácido, > 7 básico.',
'qui-ele':'**Pilha** (espontânea: química → elétrica):\n• Ânodo (−): oxidação, perde elétrons e corrói.\n• Cátodo (+): redução, ganha elétrons e recebe depósito.\n• Elétrons vão do ânodo para o cátodo. Quem tem maior potencial de redução se reduz.\n• ddp = E°red(maior) − E°red(menor).\n**Eletrólise** (não espontânea: elétrica → química): cátodo (−) reduz; ânodo (+) oxida.\n**Macete:** ânodo é sempre oxidação (vogal com vogal); cátodo, redução (consoante com consoante).\n**Aplicação:** metal de sacrifício protege cascos e tubulações da corrosão.',
'qui-org':'**Carbono** faz 4 ligações.\n• Hidrocarbonetos: alcano (-ano, simples), alceno (-eno, dupla), alcino (-ino, tripla), aromáticos (anel benzênico).\n• Oxigenadas: álcool (-ol), fenol (OH no anel), aldeído (-al), cetona (-ona), ácido carboxílico (-oico), éster, éter.\n• Nitrogenadas: amina, amida.\n• Nomenclatura: prefixo (met, et, prop, but, pent, hex) + infixo (an, en, in) + sufixo.\n• Reações: combustão, adição (em insaturados), substituição, esterificação (ácido + álcool → éster + água).\n**Pegadinha:** aldeído tem a carbonila na ponta; cetona, no meio.',
/* ---------- INGLÊS ---------- */
'ing-int':'**Estratégias:**\n• **Skimming:** leitura rápida para captar a ideia geral (título, primeiras linhas, fonte).\n• **Scanning:** busca de uma informação específica (datas, nomes, números).\n• Cognatos ajudam; falsos cognatos enganam.\n• Marcadores: however (no entanto), therefore (portanto), although (embora), moreover (além disso), unless (a menos que), because (porque).\n• Referência pronominal: descubra a quem "it", "they", "which" se referem.\n**Pegadinha:** alternativa que traduz uma frase do texto, mas responde outra pergunta.',
'ing-voc':'**Falsos cognatos que mais caem:** actually (na verdade), pretend (fingir), push (empurrar), library (biblioteca), college (faculdade), parents (pais), realize (perceber), eventually (por fim), sensible (sensato), attend (frequentar), exquisite (requintado).\n**Afixos:** un-/dis- (negação), -less (sem), -ful (cheio de), -ly (advérbio), -er (quem faz).\n**Phrasal verbs:** put out (apagar fogo), carry out (realizar), look for (procurar), give up (desistir), set up (montar).\n**Vocabulário da profissão:** firefighter, fire extinguisher, hose (mangueira), ladder (escada), smoke, rescue, injury (ferimento), burn (queimadura).',
'ing-verb':'• **Simple Present:** rotina e verdades (he works; does he work?).\n• **Present Continuous:** ação agora (am/is/are + -ing).\n• **Simple Past:** passado terminado (-ed ou irregular; did).\n• **Past Continuous:** was/were + -ing.\n• **Future:** will (decisão, previsão) e going to (plano).\n• **Present Perfect:** have/has + particípio; experiência ou ação que começou no passado e continua (for, since, already, yet, ever).\n• **Modais:** can, could, may, might, must, should, would.\n• **Voz passiva:** be + particípio ("The fire was put out").',
'ing-gram':'• **Artigos:** a (antes de som de consoante), an (antes de som de vogal: an hour, a university), the (definido).\n• Contáveis x incontáveis: many/few x much/little.\n• Adjetivo vem antes do substantivo e não vai para o plural.\n• Comparativo: -er than / more ... than. Superlativo: the -est / the most.\n• Preposições de tempo: at (horas), on (dias), in (meses e anos). De lugar: at home, on the table, in the room.\n• Pronomes: sujeito (I, he), objeto (me, him), possessivos (my/mine), reflexivos (myself).\n• Wh-questions: what, where, when, who, whose, which, why, how.',
/* ---------- DIREITO ADMINISTRATIVO ---------- */
'dadm-princ':'**Art. 37 da CF: LIMPE.**\n• **Legalidade:** a Administração só faz o que a lei autoriza (o particular faz tudo o que a lei não proíbe).\n• **Impessoalidade:** finalidade pública e vedação de promoção pessoal na publicidade oficial.\n• **Moralidade:** ética e probidade; o nepotismo é vedado (Súmula Vinculante 13).\n• **Publicidade:** transparência, com exceções de segurança e intimidade.\n• **Eficiência:** incluída pela EC 19/1998; foco em resultado.\n**Implícitos:** supremacia e indisponibilidade do interesse público, razoabilidade, proporcionalidade, autotutela (Súmula 473 do STF), continuidade do serviço público e motivação.',
'dadm-atos':'**Ato administrativo:** manifestação unilateral da Administração sob regime de direito público.\n**Elementos (COFIFOMOB):** competência, finalidade e forma (sempre vinculados); motivo e objeto (mérito, quando discricionário).\n**Atributos (PATI):** presunção de legitimidade, autoexecutoriedade, tipicidade e imperatividade.\n**Extinção:**\n• Anulação: ilegalidade, efeitos retroativos (ex tunc), pela Administração ou pelo Judiciário; 5 anos para anular ato favorável, salvo má-fé (Lei 9.784/1999).\n• Revogação: conveniência e oportunidade, só pela Administração, efeitos para frente (ex nunc); não atinge ato vinculado nem direito adquirido.\n• Cassação, caducidade e contraposição.\n**Convalidação:** vício sanável de competência (não exclusiva) e de forma.',
'dadm-org':'**Administração direta:** os entes políticos (União, Estados, DF e Municípios) e seus **órgãos**, sem personalidade jurídica, criados por **desconcentração** (com hierarquia).\n**Indireta:** entidades com personalidade própria, criadas por **descentralização** (com controle, sem hierarquia):\n• Autarquia: direito público, criada por lei específica (INSS).\n• Fundação pública.\n• Empresa pública: capital 100% público, qualquer forma societária (Caixa, Correios).\n• Sociedade de economia mista: maioria do capital votante público, sempre S/A (Petrobras, Banco do Brasil).\n**Agentes públicos:** políticos, servidores, militares e particulares em colaboração.\n**Exemplo:** o Corpo de Bombeiros é órgão da Administração direta estadual.',
'dadm-pod':'• **Vinculado x discricionário:** a lei fixa tudo, ou deixa margem de conveniência e oportunidade.\n• **Hierárquico:** ordenar, fiscalizar, rever, delegar e avocar, dentro da mesma pessoa jurídica.\n• **Disciplinar:** punir servidores e particulares com vínculo especial.\n• **Regulamentar:** decretos para a fiel execução da lei, sem inovar.\n• **De polícia:** limitar liberdade e propriedade em favor do interesse público. Atributos: discricionariedade, autoexecutoriedade e coercibilidade. Ciclo: ordem, consentimento (licença, autorização), fiscalização e sanção.\n**Abuso de poder:** excesso (fora da competência) ou desvio de finalidade.\n**No CBMPR:** vistoria, licenciamento e interdição de edificações são poder de polícia.',
/* ---------- DIREITO CONSTITUCIONAL ---------- */
'dcon-poder':'• **Originário:** cria a Constituição; inicial, ilimitado juridicamente e incondicionado.\n• **Derivado reformador:** emendas (art. 60). Proposta por 1/3 da Câmara ou do Senado, pelo Presidente ou por mais da metade das Assembleias Legislativas. Aprovação em 2 turnos, em cada Casa, por 3/5.\n• **Cláusulas pétreas** (art. 60, §4º): forma federativa; voto direto, secreto, universal e periódico; separação dos Poderes; direitos e garantias individuais.\n• Limite circunstancial: não se emenda durante intervenção federal, estado de defesa ou de sítio.\n• **Derivado decorrente:** as Constituições estaduais.\n• **Revisor:** a revisão única de 1993.',
'dcon-princ':'• **Art. 1º, fundamentos (SO-CI-DI-VA-PLU):** soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa, pluralismo político.\n• **Art. 2º:** Legislativo, Executivo e Judiciário, independentes e harmônicos.\n• **Art. 3º, objetivos (começam com verbo):** construir sociedade livre, justa e solidária; garantir o desenvolvimento nacional; erradicar a pobreza e reduzir desigualdades; promover o bem de todos.\n• **Art. 4º, relações internacionais:** independência nacional, prevalência dos direitos humanos, autodeterminação dos povos, não intervenção, defesa da paz, repúdio ao terrorismo e ao racismo, cooperação, concessão de asilo político.\n**Macete:** objetivo é verbo; fundamento é substantivo.',
'dcon-dir':'**Art. 5º:** vida, liberdade, igualdade, segurança e propriedade.\n• A casa é asilo inviolável. Pode-se entrar sem consentimento em **flagrante, desastre ou para prestar socorro** (a qualquer hora) ou por ordem judicial (durante o dia). É a base da entrada do bombeiro em ocorrência.\n**Remédios:** habeas corpus (liberdade de locomoção, gratuito), habeas data (informações pessoais), mandado de segurança (direito líquido e certo), mandado de injunção (falta de norma regulamentadora), ação popular (qualquer cidadão, contra ato lesivo ao patrimônio público).\n• Normas de direitos fundamentais têm aplicação imediata.\n• Tratado de direitos humanos aprovado em 2 turnos por 3/5 equivale a emenda.\n**Art. 6º, direitos sociais:** educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência, proteção à maternidade e à infância, assistência aos desamparados.',
'dcon-nac':'**Natos:** nascidos no Brasil (salvo filhos de estrangeiros a serviço do seu país); nascidos no exterior de pai ou mãe brasileiros a serviço do Brasil, ou registrados em repartição brasileira, ou que venham residir e optem.\n**Naturalizados:** de países de língua portuguesa, 1 ano de residência e idoneidade moral; demais, 15 anos e sem condenação penal.\n**Cargos só de nato (MP3.COM):** Ministro do STF, Presidente e Vice, Presidentes da Câmara e do Senado, carreira diplomática, oficial das Forças Armadas, Ministro da Defesa.\n**Direitos políticos:** voto obrigatório dos 18 aos 70; facultativo aos 16 e 17, acima de 70 e para analfabetos. Idades mínimas: 35 (Presidente, Senador), 30 (Governador), 21 (Deputado, Prefeito), 18 (Vereador).\n• É vedada a cassação de direitos políticos (só perda ou suspensão).',
'dcon-org':'**Federação:** União, Estados, DF e Municípios, todos autônomos. Territórios integram a União.\n**Competências:**\n• União: exclusivas (art. 21) e privativas para legislar (art. 22: civil, penal, processual, trânsito... e normas gerais das PMs e CBMs).\n• Comuns (art. 23): todos atuam (saúde, meio ambiente, patrimônio).\n• Concorrentes (art. 24): União faz normas gerais; Estados e DF suplementam.\n• Municípios: interesse local (art. 30).\n• Estados: competência remanescente (o que não foi vedado).\n• DF acumula competências de Estado e Município e não pode ser dividido em municípios.\n**Intervenção:** federal (art. 34) e estadual (art. 35), sempre excepcional.',
'dcon-poderes':'**Legislativo:** Congresso = Câmara (representa o povo, sistema proporcional, mandato de 4 anos) + Senado (representa os Estados e o DF, 3 por unidade, majoritário, 8 anos). O TCU auxilia o controle externo.\n• Lei complementar: maioria absoluta. Ordinária: maioria simples. Medida provisória: 60 + 60 dias.\n**Executivo:** Presidente (chefe de Estado e de Governo), eleito por maioria absoluta, mandato de 4 anos, uma reeleição. Crime de responsabilidade: julgado pelo Senado, após autorização de 2/3 da Câmara.\n**Judiciário:** STF (guarda da CF, 11 ministros), STJ (lei federal), justiças especializadas. Garantias dos juízes: vitaliciedade, inamovibilidade e irredutibilidade de subsídio.',
'dcon-admp':'**Art. 37:** LIMPE; concurso público com validade de até 2 anos, prorrogável uma vez por igual período; cargo em comissão só para direção, chefia e assessoramento.\n• Acumulação vedada, salvo: dois de professor; professor + técnico ou científico; dois de saúde.\n• Estabilidade após 3 anos de efetivo exercício, com avaliação especial de desempenho (art. 41).\n**Art. 42:** membros das Polícias Militares e dos Corpos de Bombeiros Militares são **militares dos Estados**, organizados com base na hierarquia e na disciplina.\n• Ao militar são proibidas a sindicalização e a greve, e, na ativa, a filiação a partido político (art. 142, §3º, aplicável aos militares estaduais).',
'dcon-defesa':'**Estado de defesa (art. 136):** ordem pública ou paz social ameaçadas por grave instabilidade institucional ou calamidade de grandes proporções; locais restritos; o Presidente decreta (ouvidos os Conselhos da República e de Defesa Nacional) e o Congresso aprova depois; até 30 dias, prorrogável uma vez.\n**Estado de sítio (art. 137):** comoção grave de repercussão nacional, ineficácia do estado de defesa, guerra ou agressão estrangeira; exige **autorização prévia** do Congresso por maioria absoluta.\n**Forças Armadas (art. 142):** Marinha, Exército e Aeronáutica; comandante supremo: Presidente.\n**Segurança pública (art. 144):** PF, PRF, PFF, polícias civis, PMs e **CBMs**, polícias penais. Aos CBMs cabe também a execução de atividades de defesa civil. PMs e CBMs são forças auxiliares e reserva do Exército, subordinadas aos Governadores.',
/* ---------- DIREITOS HUMANOS ---------- */
'dh-dudh':'**Declaração Universal dos Direitos Humanos:** adotada pela Assembleia Geral da ONU em **10/12/1948**, em Paris; 30 artigos.\n• É uma **resolução**, não um tratado; ainda assim é referência universal e costume internacional.\n• Art. 1º: "Todos os seres humanos nascem livres e iguais em dignidade e direitos".\n• Reúne direitos civis e políticos e direitos econômicos, sociais e culturais.\n• Características: universalidade, indivisibilidade, interdependência.\n**Pegadinha:** a DUDH não foi "ratificada" pelo Brasil como tratado; ela foi proclamada pela ONU.',
'dh-cadh':'**Convenção Americana (Pacto de São José da Costa Rica):** assinada em **1969**; Brasil aderiu em 1992 (Decreto 678/1992).\n• Arts. 1º a 32: dever de respeitar e garantir direitos; vida, integridade pessoal (proibição de tortura), proibição da escravidão, liberdade pessoal, garantias judiciais, expressão, direito de resposta, reunião, associação, nome, nacionalidade, propriedade, circulação, igualdade e proteção judicial.\n• Proíbe prisão por dívida, salvo a do devedor de alimentos. Por isso é ilícita a prisão do depositário infiel (Súmula Vinculante 25).\n• Órgãos: Comissão e Corte Interamericanas.\n• No Brasil tem status **supralegal** (acima das leis, abaixo da CF).',
'dh-pequim':'**IV Conferência Mundial sobre a Mulher (Pequim, 1995):** Declaração e Plataforma de Ação.\n• Direitos das mulheres são direitos humanos.\n• Consagrou os conceitos de **gênero**, **empoderamento** e **transversalidade** (políticas de gênero em todas as áreas do governo).\n• 12 áreas críticas: pobreza, educação, saúde, violência, conflitos armados, economia, poder e tomada de decisão, mecanismos institucionais, direitos humanos, mídia, meio ambiente e a menina.\n**Como cai:** reconhecer o ano (1995), a cidade e os conceitos de empoderamento e transversalidade.',
'dh-pidcp':'**Pacto Internacional dos Direitos Civis e Políticos:** ONU, **1966**; Brasil promulgou em 1992 (Decreto 592/1992).\n• Vida, proibição de tortura e escravidão, liberdade e segurança, tratamento humano de presos, vedação de prisão por dívida contratual, circulação, devido processo, presunção de inocência, privacidade, religião, expressão, reunião, associação e participação política.\n• Direitos de aplicação imediata.\n• Em emergência pública admite suspensão, exceto de um núcleo inderrogável (vida, tortura, escravidão, legalidade penal, religião...).\n• Monitoramento: Comitê de Direitos Humanos.',
'dh-pidesc':'**Pacto Internacional dos Direitos Econômicos, Sociais e Culturais:** ONU, **1966**; Brasil promulgou em 1992 (Decreto 591/1992).\n• Trabalho em condições justas, sindicalização e greve, previdência, proteção à família, nível de vida adequado (alimentação, moradia, vestuário), saúde, educação (primária obrigatória e gratuita) e cultura.\n• Realização **progressiva**, até o máximo dos recursos disponíveis, sem discriminação; vedação do retrocesso.\n• Monitoramento: Comitê DESC.\n**Carta Internacional de Direitos Humanos** = DUDH + PIDCP + PIDESC.',
'dh-hist':'**Precedentes da internacionalização:**\n• **Direito humanitário:** Cruz Vermelha e Convenções de Genebra, proteção em tempo de guerra.\n• **Liga das Nações** (1919, Tratado de Versalhes): manter a paz; fracassou com a 2ª Guerra.\n• **OIT** (1919): padrões internacionais de trabalho; existe até hoje.\n**Pós-guerra:** Carta da ONU (1945) e **Convenção para a Prevenção e Repressão do Crime de Genocídio** (ONU, 9/12/1948, um dia antes da DUDH). Genocídio: atos com intenção de destruir, no todo ou em parte, grupo nacional, étnico, racial ou religioso, na paz ou na guerra.\n**Gerações:** 1ª liberdade (civis e políticos), 2ª igualdade (sociais), 3ª fraternidade (meio ambiente, paz).',
'dh-idoso':'**Estatuto da Pessoa Idosa** (Lei 10.741/2003; nome atualizado em 2022): pessoa idosa tem **60 anos ou mais**.\n• Prioridade no atendimento; entre os idosos, prioridade especial para quem tem mais de 80.\n• Transporte coletivo urbano gratuito a partir de 65 anos.\n• Interestadual: 2 vagas gratuitas por veículo para renda de até 2 salários mínimos e desconto mínimo de 50% nas demais.\n• Meia-entrada em eventos culturais, esportivos e de lazer; reserva de 3% das unidades em programas habitacionais.\n• Planos de saúde não podem cobrar valores diferenciados em razão da idade.\n• Violência contra a pessoa idosa: notificação compulsória.',
/* ---------- LEGISLAÇÃO (aprofunda o resumo anterior) ---------- */
'leg-pnspds':'**Lei 13.675/2018:** cria o **Susp** (Sistema Único de Segurança Pública) e institui a **PNSPDS** (Política Nacional de Segurança Pública e Defesa Social).\n• Integra União, Estados, DF e Municípios, sob coordenação da União.\n• Integrantes operacionais: polícias federal, rodoviária federal, civis, militares, **corpos de bombeiros militares**, guardas municipais, sistema penitenciário, perícia oficial, agentes de trânsito, guarda portuária, entre outros.\n• Princípios: proteção dos direitos humanos e da vida, **uso comedido e proporcional da força**, eficiência, transparência e participação social.\n• Instrumentos: Plano Nacional de Segurança Pública (10 anos) e sistema nacional de informações (Sinesp).\n**Como cai:** saber quem integra o Susp e reconhecer os princípios.',
'leg-lonpm':'**Lei 14.751/2023:** Lei Orgânica Nacional das Polícias Militares e dos Corpos de Bombeiros Militares. São **normas gerais** (competência privativa da União, CF art. 22, XXI).\n• PMs e CBMs: instituições permanentes, militares, baseadas em **hierarquia e disciplina**; forças auxiliares e reserva do Exército; subordinadas aos Governadores.\n• Comandante-geral: oficial da ativa do último posto, nomeado pelo Governador.\n• Atribuições típicas do CBM: prevenção e combate a incêndio, busca e salvamento, atendimento pré-hospitalar, defesa civil e **poder de polícia** de segurança contra incêndio (análise de projetos, vistoria, fiscalização).\n• Ingresso por concurso público.\n• Carreira e disciplina ficam com a lei estadual. No Paraná: Lei 22.206/2024 e Código da PMPR (Lei 1.943/1954).',
'leg-pnpdec':'**Lei 12.608/2012:** Política Nacional de Proteção e Defesa Civil (**PNPDEC**).\n• Abrange **prevenção, mitigação, preparação, resposta e recuperação**.\n• Cria o SINPDEC (sistema) e o CONPDEC (conselho nacional).\n• Dever de União, Estados, DF e Municípios reduzirem riscos de desastre, com apoio da sociedade.\n• "A incerteza quanto ao risco não impede a adoção de medidas preventivas."\n• União reconhece situação de emergência e estado de calamidade; **Municípios decretam**, mapeiam áreas de risco, vedam novas ocupações nelas e organizam abrigos; Estados apoiam e mapeiam.\n• Cadastro nacional de municípios com áreas suscetíveis a deslizamentos e inundações.',
'leg-mariapenha':'**Lei 11.340/2006:** violência doméstica e familiar contra a mulher é ação ou omissão **baseada no gênero** que cause morte, lesão, sofrimento físico, sexual ou psicológico e dano moral ou patrimonial.\n• Âmbitos: unidade doméstica, família ou qualquer relação íntima de afeto, independentemente de coabitação e de orientação sexual.\n• Formas: **física, psicológica, sexual, patrimonial e moral**.\n• Medidas protetivas de urgência: afastamento do lar, proibição de aproximação e contato, suspensão da posse de armas.\n• Descumprir medida protetiva é crime (art. 24-A).\n• Não se aplica a Lei 9.099 (juizados especiais) e é vedada pena de cesta básica.\n• Lesão corporal nesse contexto: ação penal pública incondicionada (Súmula 542 do STJ).',
/* ---------- ADMINISTRAÇÃO PÚBLICA ---------- */
'apub-org':'**Estado:** povo, território e governo soberano.\n• Administração em sentido subjetivo (quem executa: órgãos e entidades) e objetivo (a atividade: serviço público, polícia administrativa, fomento, intervenção).\n• **Desconcentração:** distribuição interna, dentro da mesma pessoa, com hierarquia.\n• **Descentralização:** para outra pessoa jurídica, com controle e sem hierarquia.\n• Indireta: autarquias e fundações públicas (autarquia criada por lei; demais, lei autoriza), empresas públicas e sociedades de economia mista.\n**Modelos de gestão:** patrimonialista (público e privado se confundem), burocrático (Weber: impessoalidade, hierarquia, formalismo) e gerencial (resultados, eficiência, foco no cidadão; reforma de 1995 e EC 19/1998).',
'apub-disp':'**Contratação direta (Lei 14.133/2021):**\n• **Inexigibilidade (art. 74):** a competição é **inviável**. Fornecedor exclusivo, artista consagrado, serviço técnico especializado de natureza intelectual com notória especialização, credenciamento, imóvel com características que tornem necessária a escolha. Rol exemplificativo.\n• **Dispensa (art. 75):** a competição é possível, mas a lei permite não licitar. Baixo valor (referência original: R$ 100 mil para obras e serviços de engenharia; R$ 50 mil para os demais; valores corrigidos todo ano), emergência ou calamidade (contrato de até 1 ano, sem prorrogação), licitação deserta ou fracassada. Rol taxativo.\n**Sistema de Registro de Preços:** registra preços para contratações futuras; ata válida por 1 ano, prorrogável por igual período; não obriga a contratar.',
'apub-contr':'**Contratos administrativos (Lei 14.133/2021):** têm **cláusulas exorbitantes**: alterar e extinguir unilateralmente, fiscalizar, aplicar sanções, ocupar bens provisoriamente.\n• Serviços e fornecimentos contínuos: até 5 anos, prorrogáveis até 10.\n• Alteração unilateral: acréscimos ou supressões de até **25%** do valor inicial (até 50% de acréscimo em reforma de edifício ou equipamento).\n• Equilíbrio econômico-financeiro protegido: reajuste, repactuação, revisão.\n• Execução acompanhada por fiscal e gestor designados.\n• Sanções: advertência, multa, impedimento de licitar e contratar (até 3 anos) e declaração de inidoneidade (3 a 6 anos).\n• Garantia: em regra até 5% do valor, podendo chegar a 10%.',
/* ---------- ECA ---------- */
'eca-dir':'**Lei 8.069/1990.** Criança: até 12 anos incompletos. Adolescente: de 12 a 18 anos.\n• **Proteção integral e prioridade absoluta** (art. 4º), dever da família, da comunidade, da sociedade e do poder público: primazia de receber proteção e **socorro** em quaisquer circunstâncias, precedência de atendimento, preferência nas políticas públicas e na destinação de recursos.\n• Direitos: vida e saúde, liberdade, respeito e dignidade, convivência familiar, educação, cultura, esporte e lazer, profissionalização.\n• Trabalho: proibido abaixo de 16 anos, salvo como aprendiz a partir de 14; noturno, perigoso ou insalubre, vedado abaixo de 18.\n• Castigo físico e tratamento cruel são vedados.',
'eca-prot':'**Medidas de proteção** (art. 98 e 101): aplicadas quando direitos são ameaçados ou violados, por ação ou omissão da sociedade ou do Estado, dos pais, ou pela própria conduta.\n• Exemplos: encaminhamento aos pais, orientação e apoio, matrícula escolar, tratamento médico ou psicológico, acolhimento institucional ou familiar (provisório e excepcional), família substituta.\n**Conselho Tutelar:** órgão permanente e autônomo, **não jurisdicional**; ao menos 1 por município, 5 membros escolhidos pela comunidade, mandato de 4 anos.\n• Suspeita de maus-tratos deve ser comunicada ao Conselho Tutelar.\n• Criança que pratica ato infracional recebe **só medidas de proteção**.',
'eca-ato':'**Ato infracional:** conduta descrita como crime ou contravenção. Menores de 18 são inimputáveis (CF art. 228); vale a idade na data do fato.\n**Medidas socioeducativas** (art. 112, só para adolescentes): advertência; obrigação de reparar o dano; prestação de serviços à comunidade (até 6 meses); liberdade assistida (mínimo de 6 meses); semiliberdade; internação.\n• Internação: máximo de 3 anos, reavaliação a cada 6 meses, liberação compulsória aos 21. Cabe em ato com violência ou grave ameaça, reiteração de infrações graves ou descumprimento reiterado de medida anterior (esta, por até 3 meses).\n• Apreensão só em flagrante ou por ordem judicial.',
/* ---------- PRIMEIROS SOCORROS ---------- */
'ps-anat':'• **Tegumentar:** pele (epiderme, derme, hipoderme). Protege e regula a temperatura; é a base da classificação das queimaduras.\n• **Músculo-esquelético:** 206 ossos no adulto; músculos esquelético, liso e cardíaco.\n• **Respiratório:** vias superiores (nariz, faringe, laringe) e inferiores (traqueia, brônquios, alvéolos, onde ocorre a troca gasosa). O diafragma é o principal músculo da respiração.\n• **Cardiovascular:** coração com 2 átrios e 2 ventrículos; artérias saem do coração, veias chegam. Pulsos: carotídeo, radial e braquial (bebês).\n• **Nervoso:** central (encéfalo e medula) e periférico.\n**Sinais vitais do adulto em repouso:** FC 60 a 100 bpm; FR 12 a 20 irpm; temperatura de 36 a 37,5 °C.',
'ps-aval':'1. **Cena:** segurança (sua, da equipe, da vítima), EPI, mecanismo do trauma, número de vítimas, recursos.\n2. **Impressão geral e consciência (AVDI):** Alerta, responde à Voz, responde à Dor, Inconsciente.\n3. **Primária XABCDE:** X hemorragia exsanguinante; A vias aéreas com controle cervical; B respiração; C circulação e perfusão; D estado neurológico (Glasgow 3 a 15, pupilas); E exposição com prevenção de hipotermia.\n4. **Secundária:** exame da cabeça aos pés, sinais vitais e histórico **SAMPLA** (Sinais e sintomas, Alergias, Medicamentos, Passado médico, Líquidos e alimentos, Ambiente).\n5. **Reavaliação** contínua.\n**Pegadinha:** trate o que mata primeiro. Hemorragia grave vem antes da via aérea (o "X").',
'ps-hem':'**Tipos:** arterial (vermelho vivo, em jatos que acompanham o pulso), venosa (vermelho escuro, fluxo contínuo), capilar (em lençol).\n**Conduta na externa:** compressão direta firme; curativo compressivo; **torniquete** em hemorragia grave de membro que não para com compressão (anote o horário e não afrouxe).\n**Choque hipovolêmico:** pele fria, pálida e úmida; pulso rápido e fraco; respiração rápida; enchimento capilar acima de 2 s; sede e ansiedade; queda da pressão é sinal tardio.\n• Conduta: controlar o sangramento, deitar a vítima, aquecer, oxigênio se houver, **não dar líquidos**, transporte rápido.\n• Tipos de choque: hipovolêmico, cardiogênico, distributivo (séptico, anafilático, neurogênico) e obstrutivo.',
'ps-trau':'**TCE:** alteração de consciência, pupilas desiguais, sangue ou líquor pelo nariz ou ouvidos, hematoma ao redor dos olhos (olhos de guaxinim) ou atrás da orelha (sinal de Battle), vômito, convulsão. Conduta: controle cervical, via aérea, oxigênio, Glasgow; não tampe a saída de líquor.\n**Tórax:** pneumotórax hipertensivo (falta de ar grave, turgência jugular, desvio de traqueia); ferimento aspirativo (curativo oclusivo com válvula); tórax instável (costelas fraturadas em 2 pontos, movimento paradoxal).\n**Fraturas:** dor, deformidade, edema, crepitação, perda de função. Imobilize a articulação acima e abaixo; cheque pulso, sensibilidade e movimento antes e depois; **não recoloque osso exposto**.',
'ps-quei':'**Profundidade:**\n• 1º grau: epiderme; vermelhidão e dor (queimadura solar).\n• 2º grau: epiderme e parte da derme; **bolhas** e dor intensa.\n• 3º grau: toda a derme; pele branca ou carbonizada, **pouca dor** no centro (terminações nervosas destruídas).\n**Extensão (regra dos 9, adulto):** cabeça 9%; cada braço 9%; tronco anterior 18%; posterior 18%; cada perna 18%; genitais 1%. A palma da mão da vítima ≈ 1%.\n**Conduta:** interromper a queimadura, retirar anéis e roupas não aderidas, resfriar com água corrente em temperatura ambiente, cobrir com curativo limpo e seco, prevenir hipotermia. Nada de gelo, pasta de dente ou pomada; não fure bolhas.\n**Alerta de via aérea:** queimadura na face, pelos nasais chamuscados, rouquidão.',
'ps-rcp':'**Adulto:** não responde e não respira (ou só "gasping") → peça ajuda e o DEA → compressões.\n• **100 a 120 por minuto, 5 a 6 cm**, retorno total do tórax, mínimas interrupções; mãos no centro do tórax (metade inferior do esterno).\n• **30:2** sem via aérea avançada. Troque o compressor a cada 2 minutos.\n• **DEA:** assim que chegar; ligue, cole as pás, afaste todos, choque se indicado e volte às compressões na hora.\n**Criança:** 30:2 com 1 socorrista, 15:2 com 2; cerca de 5 cm. **Bebê:** cerca de 4 cm, 2 dedos (ou 2 polegares com 2 socorristas).\n**Engasgo (OVACE):** adulto consciente, compressões abdominais (Heimlich); gestante ou obeso, compressões torácicas; bebê, 5 golpes nas costas + 5 compressões no tórax.',
'ps-afog':'**Afogamento:** dificuldade respiratória por submersão ou imersão em líquido.\n• Cadeia de sobrevivência: prevenção, reconhecer e pedir ajuda, **dar flutuação**, retirar da água, suporte de vida.\n• Sem treinamento, **não entre na água**: jogue algo que flutue (boia, corda, garrafa).\n• Na areia: vítima de barriga para cima, paralela à água.\n• Se não respira: **5 ventilações iniciais** e depois RCP 30:2. A falta de oxigênio é o problema central.\n• Não faça compressão abdominal para "tirar água". Vômito é comum: vire a vítima de lado.\n• Classificação de Szpilman (graus 1 a 6) orienta a gravidade; todo afogado com sintomas vai ao hospital.',
/* ---------- SEGURANÇA CONTRA INCÊNDIO E PÂNICO ---------- */
'scip-adm':'**Fluxo do processo:** projeto técnico (análise) → execução das medidas → vistoria → certificado → renovação periódica e fiscalização a qualquer tempo.\n• **CVCB:** Certificado de Vistoria do Corpo de Bombeiros, emitido após vistoria.\n• **CLCB:** Certificado de Licenciamento do Corpo de Bombeiros, para o licenciamento em processo simplificado de edificações de menor risco.\n• Responsáveis: proprietário ou responsável pelo uso (manter as medidas funcionando) e responsável técnico (projeto e execução).\n• Irregularidade: notificação, multa, interdição ou embargo.\n• Eventos temporários também precisam de licenciamento.\n**Atenção:** confirme as definições e prazos na NPA 001 vigente (atualizada em 2026). É onde a banca mais cobra detalhe.',
'scip-med':'**Passivas** (já estão na edificação): compartimentação horizontal e vertical, controle de materiais de acabamento, separação entre edificações, saídas de emergência e escadas protegidas, segurança estrutural, acesso de viaturas.\n**Ativas** (precisam ser acionadas ou operadas): extintores, hidrantes e mangotinhos, chuveiros automáticos, detecção e alarme, controle de fumaça.\n**Classificação das edificações:**\n• Por ocupação: A residencial, B hospedagem, C comercial, D serviço profissional, E educacional, F reunião de público, G serviço automotivo, H saúde e institucional, I indústria, J depósito, L explosivos, M especial.\n• Por altura, área e **carga de incêndio** (risco baixo até 300 MJ/m²; médio de 300 a 1.200; alto acima de 1.200).\n• Quanto maiores área, altura e risco, mais medidas são exigidas.',
/* ---------- COMBATE A INCÊNDIO ---------- */
'comb-tetra':'**Tetraedro do fogo:** combustível, comburente (oxigênio), calor e reação em cadeia. Tire qualquer um e o fogo apaga.\n• O ar tem 21% de oxigênio. Pelos manuais de bombeiros, abaixo de cerca de 16% as chamas somem (brasa) e abaixo de cerca de 8% a combustão cessa.\n**Pontos de temperatura:**\n• **Fulgor:** os vapores inflamam com chama externa, mas o fogo não se mantém.\n• **Combustão:** a chama se mantém.\n• **Ignição (autoignição):** inflama sem chama externa.\n• Limites de inflamabilidade: abaixo do inferior, mistura pobre; acima do superior, mistura rica. Nenhuma queima.\n**Transmissão de calor:** condução, convecção e irradiação.',
'comb-fases':'**Fases do incêndio em compartimento:**\n1. Ignição (inicial): muito oxigênio, pouca temperatura.\n2. Crescimento: gases quentes sobem e formam a camada de fumaça.\n3. **Flashover:** inflamação generalizada de tudo o que é combustível no ambiente.\n4. Desenvolvido: queima máxima.\n5. Decaimento: oxigênio ou combustível escassos.\n**Fenômenos:**\n• **Rollover:** línguas de fogo na camada de fumaça, aviso de flashover.\n• **Backdraft:** ambiente fechado, pobre em oxigênio e cheio de gases quentes recebe ar de repente e explode. Sinais: fumaça amarelada pulsando, portas quentes, vidros escurecidos, ar sendo "sugado".\n• Combustão completa x incompleta (gera CO e fuligem).',
'comb-cla':'• **A:** sólidos que queimam em superfície e profundidade e deixam resíduo (madeira, papel, tecido). Agente: água (resfriamento).\n• **B:** líquidos e gases inflamáveis; queimam só na superfície. Agentes: espuma, pó, CO₂ (abafamento).\n• **C:** equipamentos **energizados**. Agentes: CO₂ e pó. Nunca água. Desligada a energia, vira A.\n• **D:** metais pirofóricos (magnésio, titânio, sódio, potássio). Pó especial; a água pode piorar.\n• **K:** óleos e gorduras de cozinha. Agente classe K (saponificante). Nunca água.\n**Métodos de extinção:** resfriamento (calor), abafamento (oxigênio), isolamento (combustível), extinção química (reação em cadeia).',
'comb-ext':'• **Água pressurizada:** classe A.\n• **Espuma mecânica:** A e B.\n• **CO₂:** B e C. Não deixa resíduo; risco de asfixia em local fechado e de queimadura pelo frio no difusor.\n• **Pó BC:** B e C. **Pó ABC:** A, B e C. Pó especial: D. Agente classe K: cozinhas.\n**Como usar:** retire a trava (pino), aproxime-se a favor do vento, aponte para a **base** das chamas, aperte o gatilho e faça movimentos de varredura.\n• Manutenção anual e teste hidrostático a cada 5 anos (NBR 12962); inspeção periódica pelo usuário.\n• Localização: visível, sinalizado e desobstruído (NPT 021).',
'comb-agua':'**Por que a água apaga bem:** alto calor específico e alto calor latente de vaporização. 1 L de água vira cerca de 1.700 L de vapor, que também abafa.\n**Formas de aplicação:**\n• **Jato compacto (sólido):** grande alcance e penetração, mais reação no esguicho; pouco resfriamento por litro.\n• **Jato neblinado (chuveiro):** gotas finas, máxima absorção de calor, protege a guarnição (cortina d’água), alcance menor.\n• **Pulsos:** técnica para resfriar a camada de gases quentes.\n**Não use água em:** classe C energizada, classe D, classe K, e evite jato compacto em líquido inflamável (espalha o fogo).\n• Aditivos: LGE (gera espuma) e agentes molhantes.',
/* ---------- GEOGRAFIA ---------- */
'geo-form':'**Conceitos:** espaço geográfico, território, região, paisagem e lugar.\n• **América:** colonização de exploração (ibérica, plantation) x povoamento; América Latina marcada por dependência e desigualdade.\n• **África:** partilha na Conferência de Berlim (1884-1885), fronteiras artificiais, descolonização a partir dos anos 1950 e 60, conflitos étnicos e riqueza mineral.\n• **Europa:** berço do capitalismo industrial; União Europeia (integração, euro; saída do Reino Unido em 2020).\n• **Ásia:** maior continente e população; China potência industrial; Índia; Oriente Médio (petróleo e conflitos); Japão e Tigres Asiáticos.\n• **Oceania:** Austrália e Nova Zelândia desenvolvidas; ilhas do Pacífico ameaçadas pela elevação do mar.',
'geo-antart':'**Antártida:** o continente mais frio, seco e ventoso; concentra cerca de 90% do gelo e 70% da água doce do planeta; regula o clima e as correntes oceânicas.\n• **Tratado da Antártida (1959):** uso exclusivamente pacífico, liberdade de pesquisa, congelamento das reivindicações territoriais, proibição de atividade militar e testes nucleares.\n• **Protocolo de Madri (1991):** proteção ambiental e proibição da mineração.\n• O Brasil aderiu em 1975 e mantém o PROANTAR e a Estação Comandante Ferraz, destruída por um **incêndio em 2012** e reinaugurada em 2020.\n• Aquecimento global: derretimento de plataformas de gelo e elevação do nível do mar.',
'geo-reg':'**IBGE (macrorregiões):** Norte, Nordeste, Centro-Oeste, Sudeste e Sul. Respeitam os limites estaduais; Tocantins entrou no Norte após 1988.\n**Geoeconômicas (Pedro Geiger, 1967):** Amazônia, Nordeste e Centro-Sul. **Não** respeitam limites estaduais.\n**Milton Santos:** quatro Brasis (Concentrada, Nordeste, Centro-Oeste e Amazônia).\n• IBGE 2017: regiões geográficas imediatas e intermediárias.\n**Paraná:** 399 municípios; regiões tradicionais como Litoral, Metropolitana de Curitiba, Campos Gerais, Norte Pioneiro, Norte Central, Noroeste, Oeste, Sudoeste e Centro-Sul.\n**Mundo:** Norte desenvolvido x Sul em desenvolvimento; blocos econômicos (Mercosul, União Europeia).',
'geo-campo':'**Urbanização brasileira:** acelerada a partir de 1950 e 60, com industrialização, êxodo rural e mecanização do campo; hoje a grande maioria da população é urbana.\n• Problemas urbanos: favelização, **ocupação de áreas de risco** (encostas e várzeas: deslizamentos e enchentes), mobilidade, ilhas de calor e impermeabilização do solo.\n• Conceitos: metropolização, conurbação, megalópole, rede urbana, migração pendular.\n**Campo:** modernização agrícola, agronegócio (soja, milho, carnes), concentração fundiária, agricultura familiar e conflitos agrários.\n**Paraná:** agronegócio forte, cooperativismo e liderança nacional na produção e exportação de carne de frango.'

/* ===================== ARENA DE JOGOS: base comum =====================
   Português, Matemática, Física, Química e História têm um jogo por tópico, cada um com
   5 níveis, do fundamento ao padrão de prova. As rodadas são geradas na hora, a partir de
   bancos combinatórios e de geradores numéricos: o gabarito muda a cada partida.
   Tipos de rodada (k): choice, tf, num (digitar), spot (toque no erro), pick (toque no termo),
   order, sort (classificar vários), match (pares), commas (pôr vírgulas), map, ptable, balance. */

const AR_LV=[
  {n:'Fundamentos',d:'O conceito básico, cobrado de forma direta.'},
  {n:'Aplicação',d:'A regra aplicada em casos simples.'},
  {n:'Intermediário',d:'Casos com mais de um passo ou com exceções.'},
  {n:'Padrão de prova',d:'O nível das questões típicas de concurso.'},
  {n:'Prova difícil',d:'As pegadinhas e os casos que mais derrubam candidatos.'}];
const ARENA=[], AR_BY={};
function arGame(g){ ARENA.push(g); AR_BY[g.id]=g; return g; }

/* ---------- sorteio ---------- */
const rI=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rP=a=>a[Math.floor(Math.random()*a.length)];
function rS(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const rN=(a,n)=>rS(a).slice(0,n);
const rC=p=>Math.random()<p;
function rNZ(a,b){ let v=0, g=0; while(v===0&&g<50){ v=rI(a,b); g++; } return v||1; }

/* ---------- números ---------- */
function fN(v,d){ if(d==null) d=2; if(!isFinite(v)) return '?'; const p=Math.pow(10,d); let r=Math.round(v*p)/p; if(Object.is(r,-0)||Math.abs(r)<1e-12) r=0;
  return r.toLocaleString('pt-BR',{maximumFractionDigits:d}).replace('-','−'); }
const fI=v=>String(Math.round(v)).replace('-','−');
function gcd(a,b){ a=Math.abs(Math.round(a)); b=Math.abs(Math.round(b)); while(b){ const t=a%b; a=b; b=t; } return a||1; }
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
function fFr(n,d){ if(d<0){ n=-n; d=-d; } const g=gcd(n,d); n/=g; d/=g; return d===1?fI(n):(n<0?'−':'')+Math.abs(n)+'/'+d; }
const sq=v=>String(v).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'['0123456789'.indexOf(c)]||({'-':'⁻'}[c])||c).join('');
const sb=v=>String(v).split('').map(c=>'₀₁₂₃₄₅₆₇₈₉'['0123456789'.indexOf(c)]||c).join('');
/* termo de polinômio com sinal: fT(-3,'x',false) → "− 3x" */
function fT(c,v,first){ if(c===0) return ''; const a=Math.abs(c), s=c<0?'−':'+'; const body=(a===1&&v?'':fN(a,3))+(v||'');
  return first?(c<0?'−':'')+body:' '+s+' '+body; }
function fPoly(cs,v){ // cs do maior grau para o menor
  const n=cs.length-1; let out='', first=true;
  cs.forEach((c,i)=>{ const e=n-i; if(!c) return; const vv=e===0?'':(e===1?v:v+sq(e)); out+=fT(c,vv,first); first=false; });
  return out||'0'; }
function simpRad(n){ let a=1,b=n; for(let k=Math.floor(Math.sqrt(n));k>1;k--){ if(n%(k*k)===0){ a=k; b=n/(k*k); break; } } return {a,b}; }
function fRad(n){ const {a,b}=simpRad(n); if(b===1) return String(a); return (a>1?a:'')+'√'+b; }

/* ---------- construtores de rodada ---------- */
const arNorm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
function arCh(q,right,wrongs,o){
  o=o||{}; const n=o.n||5, R=String(right), seen=new Set([arNorm(R)]), ws=[];
  (o.keep?wrongs:rS(wrongs)).forEach(w=>{ const s=String(w); const k=arNorm(s); if(!s||seen.has(k)||ws.length>=n-1) return; seen.add(k); ws.push(s); });
  const opts=o.fixed?[R].concat(ws):rS([R].concat(ws));
  return Object.assign({k:'choice',q,opts,right:opts.indexOf(R)},strip(o));
}
function strip(o){ const r={}; ['x','steps','fig','t','tx','key','hint','lbl'].forEach(k=>{ if(o[k]!=null) r[k]=o[k]; }); return r; }
/* alternativas numéricas: primeiro os erros plausíveis (c), depois variações genéricas */
function arNumAlts(ans,c,d,neg){
  const f=v=>fN(v,d), A=f(ans), pri=[], gen=[], seen=new Set([A]);
  const add=(v,arr)=>{ if(!isFinite(v)) return; if(!neg&&ans>=0&&v<0) return; if(ans>0&&v===0) return; const s=f(v); if(seen.has(s)) return; seen.add(s); arr.push(s); };
  (c||[]).forEach(v=>add(v,pri));
  const m=Math.abs(ans)||1, st=d===0?Math.max(1,Math.round(m/8)):m/8;
  rS([ans*2,ans/2,ans*10,ans/10,ans+st,ans-st,ans*1.5,ans+2*st,ans-2*st,ans*3,-ans]).forEach(v=>add(v,gen));
  let g=0; while(gen.length<6&&g<60){ g++; add(ans+rI(1,12)*(rC(.5)?1:-1)*Math.max(d===0?1:0.1,st/2),gen); }
  return rS(pri).slice(0,3).concat(gen);
}
function arNum(q,ans,o){
  o=o||{}; const d=o.d==null?2:o.d, u=o.u?' '+o.u:'';
  const W=arNumAlts(ans,o.c,d,o.neg).slice(0,4), R=fN(ans,d)+u, opts=rS([R].concat(W.map(s=>s+u)));
  return Object.assign({k:'num',q,ans,d,u:o.u||'',opts,right:opts.indexOf(R),tol:o.tol},strip(o));
}
function arTF(q,truth,o){ return Object.assign({k:'tf',q,opts:['Verdadeiro','Falso'],right:truth?0:1},strip(o||{})); }
function arSpot(q,parts,wrong,fix,o){ return Object.assign({k:'spot',q,parts,wrong,fix},strip(o||{})); }
function arPick(q,parts,right,o){ return Object.assign({k:'pick',q,parts,right},strip(o||{})); }
function arOrd(q,items,o){ return Object.assign({k:'order',q,items,lab:(o&&o.lab)||null},strip(o||{})); }
function arSort(q,cats,items,o){ return Object.assign({k:'sort',q,cats,items},strip(o||{})); }
function arMatch(q,pairs,o){ return Object.assign({k:'match',q,pairs},strip(o||{})); }
function arCommas(q,ch,sl,o){ return Object.assign({k:'commas',q,ch,sl},strip(o||{})); }
function arMapR(q,zone,o){ return Object.assign({k:'map',q,zone},strip(o||{})); }
function arPT(q,sym,o){ return Object.assign({k:'ptable',q,sym},strip(o||{})); }
function arBal(q,L,R,co,o){ return Object.assign({k:'balance',q,L,R,co},strip(o||{})); }
/* alternativa ímpar a partir de afirmações: askFalse → "assinale a INCORRETA" */
function arOdd(q,trues,falses,askFalse,o){
  const right=askFalse?rP(falses):rP(trues), others=askFalse?rN(trues,4):rN(falses,4);
  return arCh(q,right,others,Object.assign({n:5},o||{}));
}

/* ---------- itens de lacuna (Português e História) ----------
   {s:'Fui {} farmácia.', c:'à', w:['a'], x:'regra'} */
const siFill=si=>si.s.replace('{}',si.c);
const siBad=si=>si.s.replace('{}',rP(si.w));
function siCloze(si,q){ return arCh((q?q+'\n':'')+si.s.replace('{}','_____'),si.c,si.w,{x:si.x}); }
function siTF(si,q){ const ok=rC(.5); return arTF((q||'De acordo com a norma-padrão, a frase está correta?')+'\n“'+(ok?siFill(si):siBad(si))+'”',ok,{x:(ok?'Está correta. ':'Não está: o certo é “'+siFill(si)+'”. ')+(si.x||'')}); }
function siSpot(si,pOk){
  const ok=rC(pOk==null?0.2:pOk), toks=si.s.split(' '), idx=toks.findIndex(t=>t.indexOf('{}')>=0), v=ok?si.c:rP(si.w);
  return arSpot('Toque na palavra ou expressão errada. Se estiver tudo certo, toque em “A frase está correta”.',toks.map((t,i)=>i===idx?t.replace('{}',v):t),ok?-1:idx,si.c,{x:(ok?'A frase está correta: “'+siFill(si)+'”. ':'Correção: “'+siFill(si)+'”. ')+(si.x||'')});
}
function siOdd(sis,askWrong,tema){
  const k=rI(0,sis.length-1), alts=sis.map((si,i)=>askWrong?(i===k?siBad(si):siFill(si)):(i===k?siFill(si):siBad(si)));
  if(new Set(alts.map(arNorm)).size<alts.length) return null;
  return {k:'choice',q:(askWrong?'Assinale a alternativa em que há **erro**'+(tema?' de '+tema:'')+'.':'Assinale a alternativa **correta**'+(tema?' quanto a '+tema:'')+'.'),opts:alts,right:k,
    x:(askWrong?'O erro está em “'+alts[k]+'”: o certo é “'+siFill(sis[k])+'”. ':'Correta: “'+alts[k]+'”. ')+(sis[k].x||'')};
}
/* escolhe um formato diferente a cada rodada para o mesmo banco */
function siAny(si,forms){ const f=rP(forms||['cloze','spot','tf']); return f==='spot'?siSpot(si):f==='tf'?siTF(si):siCloze(si); }

/* ---------- conversão para múltipla escolha (Relâmpago, simulado, caderno de erros) ---------- */
function arAsChoice(r){
  if(!r) return null;
  if(r.k==='choice') return r;
  const base=Object.assign({},r,{k:'choice'});
  if(r.k==='tf'||r.k==='num') return base;
  if(r.k==='spot'){ const words=r.parts.map((p,i)=>({p:p.replace(/[.,;:!?”“"]+$/,''),i})).filter(o=>o.p.length>1);
    const pool=rN(words.filter(o=>o.i!==r.wrong),r.wrong>=0?3:4).map(o=>'“'+o.p+'”');
    const right=r.wrong>=0?'“'+r.parts[r.wrong].replace(/[.,;:!?”“"]+$/,'')+'”':'A frase está correta';
    return arCh('Qual trecho está errado na frase?\n“'+r.parts.join(' ')+'”',right,pool.concat(r.wrong>=0?['A frase está correta']:[]),{x:r.x}); }
  if(r.k==='pick'){ const ri=Array.isArray(r.right)?r.right[0]:r.right; return arCh(r.q+'\n“'+r.parts.join(' ')+'”','“'+r.parts[ri]+'”',r.parts.filter((p,i)=>i!==ri&&p.length>1).map(p=>'“'+p+'”'),{x:r.x}); }
  if(r.k==='sort'){ const it=rP(r.items); return arCh(r.q+'\n**'+it[0]+'**',r.cats[it[1]],r.cats.filter((c,i)=>i!==it[1]),{x:r.x,keep:true}); }
  if(r.k==='match'){ const p=rP(r.pairs); return arCh(r.q+'\n**'+p[0]+'** corresponde a:',p[1],r.pairs.filter(x=>x!==p).map(x=>x[1]),{x:r.x}); }
  if(r.k==='order'){ if(r.items.length>5) return null; const ok=r.items.join(' → '), ws=[]; let g=0;
    while(ws.length<4&&g<40){ g++; const s=rS(r.items).join(' → '); if(s!==ok&&ws.indexOf(s)<0) ws.push(s); }
    return arCh(r.q+'\nQual é a ordem correta?',ok,ws,{x:r.x}); }
  if(r.k==='commas'){ const ok=arCommaText(r.ch,r.sl.map(s=>s==='must')), ws=[]; let g=0;
    while(ws.length<4&&g<60){ g++; const pat=r.sl.map(s=>s==='must'?rC(.75):s==='no'?rC(.3):rC(.5)); const bad=r.sl.some((s,i)=>(s==='must'&&!pat[i])||(s==='no'&&pat[i])); if(!bad) continue; const t=arCommaText(r.ch,pat); if(t!==ok&&ws.indexOf(t)<0) ws.push(t); }
    if(ws.length<2) return null; return arCh('Assinale a frase com a pontuação correta.',ok,ws,{x:r.x}); }
  if(r.k==='map'&&typeof AR_ZONES!=='undefined'){ return arCh(r.q,AR_ZONES[r.zone].n,Object.keys(AR_ZONES).filter(z=>z!==r.zone).map(z=>AR_ZONES[z].n),{x:r.x}); }
  if(r.k==='ptable'&&typeof AR_EL!=='undefined'){ const e=AR_EL.find(x=>x.s===r.sym); return arCh(r.q,e.s+' ('+e.n+')',rN(AR_EL.filter(x=>x.s!==r.sym&&x.z<=36),6).map(x=>x.s+' ('+x.n+')'),{x:r.x}); }
  if(r.k==='balance'){ const ok=r.co.join(', '), ws=[]; let g=0; while(ws.length<4&&g<60){ g++; const c=r.co.map(v=>Math.max(1,v+rI(-1,2))); const s=c.join(', '); if(s!==ok&&ws.indexOf(s)<0&&!arCoefEq(c,r.co)) ws.push(s); }
    return arCh(r.q+'\n'+arEqText(r.L,r.R,null)+'\nCoeficientes (na ordem, menores inteiros):',ok,ws,{x:r.x}); }
  return null;
}
function arCommaText(ch,pat){ let s=ch[0]; for(let i=1;i<ch.length;i++) s+=(pat[i-1]?', ':' ')+ch[i]; return s; }
function arEqText(L,R,co){ const f=(arr,off)=>arr.map((sp,i)=>{ const c=co?co[off+i]:null; return (c&&c>1?c+' ':'')+sp; }).join(' + '); return f(L,0)+' → '+f(R,L.length); }
function arCoefEq(a,b){ if(a.length!==b.length) return false; const k=a[0]/b[0]; return a.every((v,i)=>Math.abs(v/b[i]-k)<1e-9); }

function fgPlot(o){
  const W=300,H=220,P=26, [x0,x1]=o.xr, [y0,y1]=o.yr;
  const X=x=>P+(x-x0)/(x1-x0)*(W-2*P), Y=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
  let s='';
  const sx=o.sx||niceStep(x1-x0), sy=o.sy||niceStep(y1-y0);
  for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx) s+='<line class="gr" x1="'+fN2(X(x))+'" y1="'+P+'" x2="'+fN2(X(x))+'" y2="'+(H-P)+'"/>';
  for(let y=Math.ceil(y0/sy)*sy;y<=y1+1e-9;y+=sy) s+='<line class="gr" x1="'+P+'" y1="'+fN2(Y(y))+'" x2="'+(W-P)+'" y2="'+fN2(Y(y))+'"/>';
  const ax=y0<=0&&y1>=0?Y(0):H-P, ay=x0<=0&&x1>=0?X(0):P;
  s+='<line class="ax" x1="'+P+'" y1="'+fN2(ax)+'" x2="'+(W-P+6)+'" y2="'+fN2(ax)+'"/><line class="ax" x1="'+fN2(ay)+'" y1="'+(H-P)+'" x2="'+fN2(ay)+'" y2="'+(P-6)+'"/>';
  for(let x=Math.ceil(x0/sx)*sx;x<=x1+1e-9;x+=sx){ if(Math.abs(x)<1e-9&&y0<=0&&y1>=0&&x0<0) continue; s+=fgT(X(x),ax+13,fN(x,2),'tk'); }
  for(let y=Math.ceil(y0/sy)*sy;y<=y1+1e-9;y+=sy){ if(Math.abs(y)<1e-9) continue; s+=fgT(ay-4,Y(y)+4,fN(y,2),'tk','end'); }
  s+=fgT(W-P+4,ax-6,o.xl||'x','al','end')+fgT(ay+6,P-8,o.yl||'y','al','start');
  (o.fns||[]).forEach(fn=>{ let d='', pen=false; for(let i=0;i<=120;i++){ const x=x0+(x1-x0)*i/120, y=fn.f(x); if(!isFinite(y)||y<y0-0.01*(y1-y0)||y>y1+0.01*(y1-y0)){ pen=false; continue; } d+=(pen?'L':'M')+fN2(X(x))+' '+fN2(Y(y)); pen=true; } s+='<path class="'+(fn.cls||'ln')+'" d="'+d+'"/>'; });
  (o.segs||[]).forEach(g=>{ s+='<line class="'+(g[4]||'ln')+'" x1="'+fN2(X(g[0]))+'" y1="'+fN2(Y(g[1]))+'" x2="'+fN2(X(g[2]))+'" y2="'+fN2(Y(g[3]))+'"/>'; });
  (o.area||[]).forEach(a=>{ s+='<polygon class="ar" points="'+a.map(p=>fN2(X(p[0]))+','+fN2(Y(p[1]))).join(' ')+'"/>'; });
  (o.pts||[]).forEach(p=>{ s+='<circle class="pt" cx="'+fN2(X(p[0]))+'" cy="'+fN2(Y(p[1]))+'" r="4"/>'+(p[2]?fgT(X(p[0])+7,Y(p[1])-7,p[2],'pl','start'):''); });
  return fgSvg(W,H,s,o.label||'Gráfico');
}
function niceStep(r){ const raw=r/8, p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<=1?1:m<=2?2:m<=5?5:10)*p; }

function ortAcento(){ const g=rP(ACENTO), w=rP(g.w); return arCh('Por que a palavra **'+w+'** é acentuada?',g.r,ACENTO.filter(x=>x!==g).map(x=>x.r),{x:'"'+w+'": '+g.r+'.'}); }
function ortAcentoPar(){ const g=rP(ACENTO), [a,b]=rN(g.w,2), right=a+' e '+b, ws=[]; let t=0;
  while(ws.length<4&&t<40){ t++; const [g1,g2]=rN(ACENTO,2); const s=rP(g1.w)+' e '+rP(g2.w); if(ws.indexOf(s)<0) ws.push(s); }
  return arCh('Assinale a alternativa em que as duas palavras são acentuadas **pela mesma regra**.',right,ws,{x:'"'+a+'" e "'+b+'": '+g.r+'.'}); }
function ortAcordo(){ if(rC(.5)){ const w=rP(SEM_ACENTO); return arTF('Depois do Acordo Ortográfico, a palavra “'+w+'” se escreve sem acento (ou sem trema).',true,{x:'Correto: "'+w+'". Perderam o acento os ditongos abertos ei/oi em paroxítonas (ideia, heroico), os hiatos ee/oo (creem, voo), o i/u tônico após ditongo em paroxítona (feiura), vários diferenciais (para, pelo, polo, pera) e o trema (linguiça).'}); }
  const h=rP(HIFEN); return arCh('Qual forma segue o Acordo Ortográfico?',h[0],[h[1]],{x:h[2]}); }
function ortTodas(){ const good=()=>rN(ORT,3).map(p=>p[0]); const bad=()=>{ const ws=rN(ORT,3), k=rI(0,2); return ws.map((p,i)=>i===k?rP(p[1]):p[0]); };
  const R=good().join(', '), W=[bad().join(', '),bad().join(', '),bad().join(', '),bad().join(', ')];
  return arCh('Assinale a alternativa em que **todas** as palavras estão escritas corretamente.',R,W,{x:'Correta: '+R+'.'}); }

  return arPick('Toque no **'+CL_NOME[want].toLowerCase()+'**.',parts,idx[0],{x:'"'+parts[idx[0]].replace(/[.,!?]/g,'')+'" é '+CL_NOME[want].toLowerCase()+'.'}); } return clQual(); }
function clQual(){ const {parts,tags}=clParse(rP(CL_FR)); const idxs=tags.map((t,i)=>t?i:-1).filter(i=>i>=0), i=rP(idxs); const w=parts[i].replace(/[.,!?]/g,'');

function pontParse(t){ const toks=t.split(/ ([\/|~]) /), ch=[], sl=[]; toks.forEach((x,i)=>{ if(i%2===0) ch.push(x); else sl.push(x==='/'?'must':x==='|'?'no':'opt'); }); ch[ch.length-1]+='.'; return {ch,sl}; }

function pontVer(ok){ const T=rP(PONT), {ch,sl}=pontParse(T[0]); let pat=sl.map(s=>s==='must');
  if(!ok){ const cand=sl.map((s,i)=>s!=='opt'?i:-1).filter(i=>i>=0); if(!cand.length) return pontVer(true); const i=rP(cand); pat=pat.slice(); pat[i]=!pat[i]; }
