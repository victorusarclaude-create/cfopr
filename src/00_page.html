<meta charset="utf-8">
<title>Plano Cadete CBMPR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBEAE6; --surface:#F8F7F4; --raised:#FFFFFF; --sunk:#E1DFD9; --ink:#1A1B1D; --muted:#5A5E63; --line:#CBC8C1;
  --red:#C21D16; --red-2:#A3150F; --on-red:#FFFFFF; --red-soft:#F4D8D5;
  --green:#08703F; --on-green:#FFFFFF; --green-soft:#D2E9DB;
  --amber:#8A6100; --amber-soft:#F2E3B8; --gold:#A86F00; --gold-soft:#F6E7BF;
  --fire:#E0561A; --focus:#1D5BD1; --focus-soft:#DCE6F8;
  --m0:#B3261E; --m1:#B5570F; --m2:#8A6D00; --m3:#146B63; --m4:#08703F;
  --nav-h:64px; --r:14px; --r-sm:9px;
  --sh1:0 1px 2px rgba(30,20,15,.06),0 2px 8px rgba(30,20,15,.05);
  --sh2:0 1px 2px rgba(30,20,15,.07),0 10px 26px rgba(30,20,15,.10);
  --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131619; --surface:#1B1F23; --raised:#22272C; --sunk:#0F1113; --ink:#ECEDE9; --muted:#A3A9AE; --line:#30363B;
    --red:#FF5A4F; --red-2:#FF7A70; --on-red:#1A0605; --red-soft:#3A1917;
    --green:#6FE0A0; --on-green:#062012; --green-soft:#12301F;
    --amber:#FFC641; --amber-soft:#3A2E0E; --gold:#FFC641; --gold-soft:#3A2E0E;
    --fire:#FF8A3D; --focus:#8AB4FF; --focus-soft:#1B2A45;
    --m0:#FF6B5E; --m1:#FF9D4D; --m2:#E8C34A; --m3:#4FD1C0; --m4:#6FE0A0;
    --sh1:0 1px 2px rgba(0,0,0,.45); --sh2:0 2px 4px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131619; --surface:#1B1F23; --raised:#22272C; --sunk:#0F1113; --ink:#ECEDE9; --muted:#A3A9AE; --line:#30363B;
  --red:#FF5A4F; --red-2:#FF7A70; --on-red:#1A0605; --red-soft:#3A1917;
  --green:#6FE0A0; --on-green:#062012; --green-soft:#12301F;
  --amber:#FFC641; --amber-soft:#3A2E0E; --gold:#FFC641; --gold-soft:#3A2E0E;
  --fire:#FF8A3D; --focus:#8AB4FF; --focus-soft:#1B2A45;
  --m0:#FF6B5E; --m1:#FF9D4D; --m2:#E8C34A; --m3:#4FD1C0; --m4:#6FE0A0;
  --sh1:0 1px 2px rgba(0,0,0,.45); --sh2:0 2px 4px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
.cu{font:inherit!important;color:inherit!important;letter-spacing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body.sheet-open{overflow:hidden}
#app{max-width:680px;margin:0 auto;padding:14px 16px calc(var(--nav-h) + 110px)}
h1,h2,h3{font-family:var(--cond);margin:0;line-height:1.05;text-wrap:balance}
h1{font-weight:800;font-size:clamp(2.5rem,11vw,3.6rem);letter-spacing:-.01em;text-transform:uppercase}
h2{font-weight:700;font-size:1.5rem;margin:28px 0 10px}
h3{font-weight:700;font-size:1.18rem;margin:18px 0 8px}
p{margin:.45em 0}
kbd{font-family:var(--mono);font-size:.7rem;padding:1px 5px;border:1px solid currentColor;border-radius:4px;opacity:.55;margin-left:6px;font-weight:500}
@media (hover:none){kbd{display:none}}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center;justify-content:center}
.lede{color:var(--muted);margin-top:12px;max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button[disabled]{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.m0{color:var(--m0)}.m1{color:var(--m1)}.m2{color:var(--m2)}.m3{color:var(--m3)}.m4{color:var(--m4)}
.acc-good{color:var(--m4)}.acc-mid{color:var(--m2)}.acc-bad{color:var(--m0)}
svg{flex:none}
/* ---------- topo ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;font-size:.9rem;color:var(--muted)}
.top .date::first-letter{text-transform:uppercase}
.topr{display:flex;align-items:center;gap:8px;min-width:0}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);padding:0}
.iconbtn svg{width:17px;height:17px}
.undobtn{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:700}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok::before{background:var(--green)} .sync.busy::before{background:var(--amber)} .sync.offline::before,.sync.err::before{background:var(--red)}
@media (max-width:440px){.sync{max-width:118px}} @media (max-width:360px){.sync{max-width:70px}}
.top .date{white-space:nowrap}
.hazard{height:6px;margin:8px 0 0;background:repeating-linear-gradient(-45deg,var(--red) 0 8px,transparent 8px 16px);opacity:.9;border-radius:2px}
/* ---------- botões e formulários ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 16px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-weight:700;box-shadow:var(--sh1);transition:transform .1s ease,box-shadow .15s,border-color .15s,background-color .15s;text-align:center}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.go{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.block{width:100%} .btn.grow{flex:1}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.55}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--red);font-weight:700;text-decoration:underline;text-underline-offset:3px;display:inline-flex;gap:6px;align-items:center}
.linkbtn svg{width:15px;height:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f,.flabel{display:block;margin:14px 0 6px;font-weight:700;font-size:.93rem}
input:not([type="checkbox"]):not([type="file"]),select,textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--raised);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:46px}
textarea{resize:vertical;min-height:100px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px var(--focus-soft)}
.filebtn{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;font-weight:600;font-size:.92rem}
.chip.on,.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:.82rem;font-weight:700;color:var(--muted);min-height:32px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.seg button small{font-family:var(--mono);font-size:.68rem;font-weight:500;opacity:.8}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--sh1)}
.seg.wide{display:flex;width:100%} .seg.wide button{flex:1;padding:8px 6px}
.note,.okbox,.badbox{padding:12px 14px;border-radius:var(--r-sm);margin:12px 0;border-left:4px solid}
.note{background:var(--amber-soft);border-color:var(--amber)} .okbox{background:var(--green-soft);border-color:var(--green)} .badbox{background:var(--red-soft);border-color:var(--red)}
.pill{display:inline-flex;align-items:center;font-family:var(--mono);font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--green);color:var(--on-green)} .pill.sm{font-size:.7rem;padding:1px 7px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list>li{border-bottom:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 0 10px}
.sec-h h2{margin:0}
/* ---------- HOJE ---------- */
.hero-hoje{margin-top:16px;padding:16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--sh2);display:flex;flex-direction:column;gap:10px}
.hh-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hh-rank{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;min-width:0}
.insig{display:inline-grid;place-items:center;width:52px;height:52px;flex:none}
.insig.big{width:88px;height:88px} .insig.sm{width:28px;height:28px}
.insig-svg{width:100%;height:100%}
.ins-bg{fill:var(--red);stroke:var(--gold);stroke-width:2.5}
.ins-g{fill:#FFD35A}
.ins-l{fill:none;stroke:#FFD35A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.hh-rt{display:flex;flex-direction:column;min-width:0}
.hh-rt b{font-family:var(--cond);font-size:1.35rem;line-height:1.05}
.hh-rt>span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ring{position:relative;display:grid;place-items:center;width:92px;height:92px;flex:none;border:0;background:none;padding:0}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg-bg{fill:none;stroke:var(--sunk);stroke-width:7}
.rg-fg{fill:none;stroke:var(--gold);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.22,1,.36,1)}
.ring-svg.full .rg-fg{stroke:var(--green)}
.ring-svg.m0 .rg-fg{stroke:var(--m0)}.ring-svg.m1 .rg-fg{stroke:var(--m1)}.ring-svg.m2 .rg-fg{stroke:var(--m2)}.ring-svg.m3 .rg-fg{stroke:var(--m3)}.ring-svg.m4 .rg-fg{stroke:var(--m4)}
.rg-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rg-c b{font-family:var(--mono);font-size:1.25rem}
.rg-c em{font-style:normal;font-size:.66rem;color:var(--muted);margin-top:3px}
.lvlbar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.lvlbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--fire));transition:width .8s cubic-bezier(.22,1,.36,1)}
.lvl-cap{display:flex;justify-content:space-between;gap:8px;margin-top:-4px;font-variant-numeric:tabular-nums}
.hh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hs{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px;border-radius:var(--r-sm);background:var(--bg);border:1.5px solid transparent;text-align:left;min-width:0}
.hs b{font-family:var(--mono);font-size:1.35rem;line-height:1.1}
.hs>span:last-child{font-size:.74rem;color:var(--muted);line-height:1.2}
.hs-ic{width:22px;height:22px;color:var(--muted)} .hs-ic svg{width:100%;height:100%}
.hs.on{border-color:rgba(255,122,26,.45)} .hs.on b{color:var(--fire)}
.hs-ic.fl svg{width:18px;height:22px}
.nextstep{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;margin-top:14px;padding:16px;border:0;border-radius:var(--r);background:var(--red);color:var(--on-red);text-align:left;box-shadow:var(--sh2);transition:transform .1s}
.ns-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.ns-ic svg{width:24px;height:24px}
.ns-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ns-t em{font-style:normal;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:700}
.ns-t b{font-family:var(--cond);font-size:1.3rem;line-height:1.1}
.ns-t span{font-size:.84rem;opacity:.9}
.ns-go svg{width:22px;height:22px}
.missions ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mis{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:var(--r-sm);background:var(--surface);border:1.5px solid var(--line)}
.mis-ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-green)}
.mis.done .mis-ck{background:var(--green);border-color:var(--green)}
.mis.done .mis-b b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.mis-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.mis-b b{font-weight:700;font-size:.97rem;line-height:1.25}
.mis-bar{height:5px;border-radius:999px;background:var(--sunk);overflow:hidden}
.mis-bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .6s}
.mis.done .mis-bar i{background:var(--green)}
.mis-foot{margin-top:8px}
.stopwatch{margin-top:18px;padding:16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--sh1);text-align:center}
.stopwatch.running{border-color:var(--red)} .stopwatch.brk{border-color:var(--green)} .stopwatch.paused{background:var(--sunk)}
.sw-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sw-lbl{font-family:var(--cond);font-weight:700;font-size:1.1rem;text-transform:uppercase;letter-spacing:.04em}
.sw-clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:3.2rem;line-height:1;letter-spacing:-.02em;margin:14px 0 6px}
.stopwatch.running .sw-clock{color:var(--red)} .stopwatch.brk .sw-clock{color:var(--green)} .stopwatch.paused .sw-clock{color:var(--muted)}
.stopwatch .btn,.stopwatch .grid2{max-width:320px;margin:10px auto 0}
.stopwatch .grid2 .btn{margin:0}
.tip{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:var(--r-sm);background:var(--focus-soft);font-size:.9rem;line-height:1.4}
.tip-ic{color:var(--focus);width:22px;height:22px} .tip-ic svg{width:22px;height:22px}
.quickrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qk{display:flex;gap:10px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);text-align:left;min-width:0}
.qk svg{width:20px;height:20px;color:var(--red)}
.qk span{display:flex;flex-direction:column;min-width:0}
.qk b{font-size:.92rem} .qk em{font-style:normal;font-size:.76rem;color:var(--muted)}
/* ---------- calendário ---------- */
.cal-nav{justify-content:space-between;margin-top:8px} .cal-nav strong{font-family:var(--cond);font-size:1.15rem;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cl{text-align:center;font-size:.75rem;color:var(--muted);font-weight:700}
.cd{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:.85rem;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;position:relative}
.cd.empty{border:none;background:none}
.cd.done{background:var(--green);color:var(--on-green);border-color:var(--green)}
.cd.folga{background:var(--sunk);border-color:var(--sunk)} .cd.miss{border-color:var(--red);color:var(--red)}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.cd.meta::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1.5px var(--surface)}
.callegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.8rem;color:var(--muted)}
.callegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--bg);border:1px solid var(--line)}
.callegend i.done{background:var(--green);border-color:var(--green)} .callegend i.folga{background:var(--sunk)} .callegend i.miss{border-color:var(--red)} .callegend i.meta{background:var(--gold);border-color:var(--gold);border-radius:50%}
/* ---------- treino: jogos e questões ---------- */
.ghead{display:flex;align-items:center;gap:12px;margin-top:18px}
.ghead h2{margin:2px 0 0;font-size:1.4rem}
.backbtn{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);padding:0;flex:none}
.backbtn svg{width:18px;height:18px}
.gbar,.relbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-family:var(--mono);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.gbar .xp,.lives .xp{color:var(--gold)}
.combo{color:var(--fire);display:inline-flex;align-items:center;gap:4px}
.combo svg{width:14px;height:18px}
.bar{height:7px;background:var(--sunk);margin-top:8px;overflow:hidden;border-radius:999px}
.bar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar.time i{background:var(--red);transition:width .25s linear}
.qcard{margin-top:14px;padding:18px 16px;border-radius:var(--r);background:var(--raised);border:2px solid var(--ink);box-shadow:var(--sh1);transition:border-color .2s}
.qcard.ok{border-color:var(--green)} .qcard.bad{border-color:var(--red)}
.qtext{font-weight:600;font-size:1.08rem;line-height:1.45}
.qtext.big{font-family:var(--cond);font-size:1.5rem;line-height:1.15;text-align:center}
.optlist,.optgrid{margin-top:10px;display:grid;gap:8px}
.optgrid{grid-template-columns:1fr 1fr}
.alt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);min-height:50px;transition:transform .1s,border-color .15s,background-color .15s;margin:8px 0 0}
.optlist .alt,.optgrid .alt{margin:0}
.alt .k{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--sunk);font-family:var(--mono);font-weight:700;font-size:.85rem;flex:none}
.alt .ot{flex:1;min-width:0}
.alt.right{border-color:var(--green);background:var(--green-soft)} .alt.right .k{background:var(--green);color:var(--on-green)}
.alt.wrong{border-color:var(--red);background:var(--red-soft)} .alt.wrong .k{background:var(--red);color:var(--on-red)}
.alt.chosen{border-color:var(--ink);background:var(--sunk);font-weight:700} .alt.chosen .k{background:var(--ink);color:var(--bg)}
.alt[disabled]{cursor:default;color:var(--ink)}
.gfb{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);border-left:4px solid var(--green);background:var(--green-soft)}
.gfb.bad{border-left-color:var(--red);background:var(--red-soft)}
.gfb b{display:inline-flex;align-items:center;gap:8px} .gfb.ok b{color:var(--green)}
.gfb p{margin:.4em 0 0}
.steps{margin:8px 0 0;padding-left:20px;font-size:.93rem} .steps li{margin:3px 0}
.exbtn{margin-top:12px;border-color:var(--focus);color:var(--focus);background:transparent;box-shadow:none}
.nextbtn{margin-top:12px}
.lives{display:flex;gap:6px;align-items:center;margin-top:10px}
.life{width:22px;height:22px;color:var(--line)} .life svg{width:100%;height:100%} .life.on{color:var(--red)}
.lives .xp{margin-left:auto;font-family:var(--mono);font-weight:700}
.boss{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px;border-radius:var(--r);background:linear-gradient(135deg,#3A1411,#1A1B1D);color:#F4F2EE;border:1.5px solid rgba(255,90,79,.35)}
.boss-ic{width:44px;height:44px;border-radius:12px;background:var(--red);color:#FFD35A;display:grid;place-items:center}
.boss-ic svg{width:26px;height:26px}
.boss-b{flex:1;display:flex;flex-direction:column;gap:6px}
.boss-hp{height:12px;border-radius:999px;background:rgba(127,127,127,.35);overflow:hidden}
.boss-hp i{display:block;height:100%;background:linear-gradient(90deg,#FF5A4F,#FFB02E);border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.relclock{font-size:2.4rem;line-height:1;color:var(--red)}
.rel-sc{font-size:1.2rem}
.gend{text-align:center;padding:18px 0 6px}
.gscore{font-family:var(--cond);font-weight:800;font-size:3.8rem;line-height:1}
.gscore small{font-size:1.4rem}
.mdelta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;background:var(--surface);border-radius:var(--r-sm);border-left:4px solid var(--green);margin-top:10px}
.mdelta b{font-family:var(--mono);font-size:1.1rem;white-space:nowrap}
.rev-li{padding:10px 0}
.challengeflag{display:inline-block;margin-bottom:8px;padding:4px 12px;border-radius:999px;background:var(--m4);color:var(--on-green);font-weight:700;font-size:.85rem}
.q-prompt{font-weight:700;font-size:1.05rem;margin-top:12px}
.tl-done{list-style:none;margin:12px 0;padding:0;border-left:3px solid var(--green)}
.tl-done li{padding:6px 0 6px 12px}
.tl-done b{font-family:var(--mono);color:var(--green);margin-right:8px}
.legend-list{list-style:none;margin:12px 0;padding:0} .legend-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.prmap{width:100%;max-width:300px;display:block;margin:14px auto 6px}
.prmap .zone{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:fill .15s,stroke .15s;cursor:pointer}
.prmap .zone.good{fill:var(--green);stroke:var(--green)} .prmap .zone.bad{fill:var(--red-soft);stroke:var(--red)}
.prmap text{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--ink);pointer-events:none}
.spotq{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;line-height:1.6}
.spotw{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:42px;font-weight:600}
.spotw.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)} .spotw.badpick{border-color:var(--red);text-decoration:line-through;opacity:.6}
.ptwrap{overflow-x:auto;margin-top:14px}
.ptgrid{display:grid;grid-template-columns:repeat(18,minmax(18px,1fr));gap:2px;min-width:340px}
.ptcell{height:24px;display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:700;border:1.5px solid var(--line);border-radius:4px;background:var(--surface);padding:0}
.ptcell.empty{border:none;background:none} .ptcell.good{background:var(--green);border-color:var(--green);color:var(--on-green)} .ptcell.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mtile{min-height:70px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:.92rem;line-height:1.25}
.mtile.front{font-weight:700} .mtile.sel{border-color:var(--ink);background:var(--sunk)} .mtile.bad{border-color:var(--red);background:var(--red-soft)} .mtile.solved{border-color:var(--green);background:var(--green-soft);color:var(--muted)}
/* flashcard com virada 3D */
.fc3d{perspective:1200px;margin-top:14px}
.fc-in{position:relative;display:grid;transition:transform .5s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d}
.fc3d.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;min-height:230px;padding:24px 18px;border:2px solid var(--ink);border-radius:var(--r);background:var(--raised);color:var(--ink);text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--sh2)}
.fc-front{cursor:pointer;font:inherit}
.fc-back{transform:rotateY(180deg);border-color:var(--green)}
.fc-f{font-family:var(--cond);font-weight:700;font-size:1.6rem;line-height:1.15}
.fc-hint{font-size:.85rem;color:var(--muted)}
.fc-q{font-size:.95rem;color:var(--muted)}
.fc-b{font-size:1.2rem;font-weight:700;color:var(--green);padding-top:12px;border-top:1.5px dashed var(--line);width:100%}
.fc-m{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:.9rem;padding:10px 12px;border-radius:var(--r-sm);background:var(--focus-soft);width:100%}
.fc-m svg{width:18px;height:18px;color:var(--focus)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.btn.grade{flex-direction:column;gap:0;padding:6px 4px;min-height:60px}
.grade b{font-size:.92rem} .grade span{font-size:.75rem;color:var(--muted);font-weight:500} .grade kbd{margin:2px 0 0}
.grade.g0{border-color:var(--red);color:var(--red)} .grade.g3{border-color:var(--green);color:var(--green)}
.card-tools{gap:16px;margin-top:4px}
.deck{padding:12px 0}
.deck-hd{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.deck-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;padding-left:50px}
.fc-count{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--sunk);font-family:var(--mono);font-weight:700}
.fc-count.due{background:var(--red);color:var(--on-red)}
.cardrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0}
.cr-acts{display:flex;flex-direction:column;align-items:flex-end}
.chkrow{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chkrow input{margin-top:4px;width:18px;height:18px;flex:none}
/* questões IA, simulado e 80/20 */
.genbox{margin-top:18px;padding:20px 16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);text-align:center;display:flex;flex-direction:column;gap:8px}
.gen-anim{width:56px;height:56px;margin:0 auto;border-radius:16px;background:var(--focus-soft);color:var(--focus);display:grid;place-items:center}
.gen-anim svg{width:30px;height:30px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.3}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.qn{font-weight:600;line-height:1.45;margin:0}
.qnum{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.8rem;margin-right:10px;vertical-align:1px}
.exp{margin-top:10px;font-size:.95rem} .exp.ok b{color:var(--green)} .exp.bad b{color:var(--red)}
.qtimer{display:inline-flex;align-items:center;gap:6px;margin:10px 0 2px;padding:6px 14px;min-height:36px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.qtimer svg{width:15px;height:15px} .qtimer.running{border-color:var(--red);color:var(--red)}
.simnav{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.simchip{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:700;padding:0;font-family:var(--mono)}
.simchip.done{background:var(--sunk)} .simchip.mark{border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)} .simchip.cur{border-color:var(--ink);border-width:2px}
.sim-meta{margin-top:12px;gap:8px}
.simbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.seal{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--green);color:var(--on-green);margin-right:6px;vertical-align:-3px}
.seal svg{width:12px;height:12px}
/* hub */
.hubgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.hubgrid{grid-template-columns:1fr 1fr}}
.hubcard{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1);text-align:left;transition:transform .1s,border-color .15s,box-shadow .15s}
.hc-ic{width:42px;height:42px;border-radius:12px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;transition:background-color .15s,color .15s}
.hc-ic svg{width:22px;height:22px}
.hc-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.hc-txt b{font-family:var(--cond);font-weight:700;font-size:1.12rem}
.hc-txt span{font-size:.82rem;color:var(--muted);line-height:1.3}
.hc-go svg{width:16px;height:16px;color:var(--muted)}
.hc-badge{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--red);color:var(--on-red);font-family:var(--mono);font-weight:700;font-size:.8rem;display:grid;place-items:center}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.modecard{display:flex;flex-direction:column;gap:2px;padding:12px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);text-align:left}
.modecard b{font-size:.95rem} .modecard span{font-size:.76rem;color:var(--muted)}
.modes{margin-bottom:6px}
.recgame{display:grid;gap:4px;padding:14px 16px;background:var(--surface);border-radius:var(--r);border:1.5px solid var(--red);margin:6px 0 14px}
.recgame strong{font-family:var(--cond);font-size:1.3rem}
.recgame .btn{justify-self:start;margin-top:8px}
details.subj{border-bottom:1px solid var(--line)}
details.subj>summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;cursor:pointer;align-items:baseline}
details.subj>summary::-webkit-details-marker{display:none}
details.subj>summary .sn{font-family:var(--cond);font-weight:700;font-size:1.22rem}
details.subj>summary .sn::before{content:"+";display:inline-block;width:18px;color:var(--muted)}
details.subj[open]>summary .sn::before{content:"−"}
details.subj>summary .sq{font-size:.86rem;color:var(--muted);white-space:nowrap}
details.subj .inner{padding:0 0 14px 18px}
details.subj .inner .list{border-top:0}
.gamerow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0}
.nm{font-weight:600}
.mdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px;flex:none}
/* conversa com IA */
.convhead{display:flex;gap:12px;align-items:flex-start;padding-right:36px}
.convhead h2{margin:0}
.conv-ic{width:40px;height:40px;border-radius:12px;background:var(--focus-soft);color:var(--focus);display:grid;place-items:center;flex:none}
.conv-ic svg{width:22px;height:22px}
.exq{margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);background:var(--bg);border-left:3px solid var(--focus);font-size:.95rem}
.exq-q{margin-top:4px}
.chat{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.msg{line-height:1.5;max-width:92%}
.msg.u{align-self:flex-end;padding:10px 12px;background:var(--ink);color:var(--bg);border-radius:14px 14px 3px 14px;white-space:pre-wrap}
.msg.a{align-self:flex-start;padding:10px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px 14px 14px 3px}
.msg.a.pending{color:var(--muted)}
.convbar{margin-top:10px}
.aibox{margin-top:10px;padding:12px 14px;background:var(--surface);border-radius:var(--r-sm);border-left:3px solid var(--focus);line-height:1.55;font-size:.95rem}
details.content-d{margin-top:12px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:0 12px 10px;background:var(--surface)}
details.content-d>summary{cursor:pointer;padding:12px 0 2px;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
details.content-d>summary::-webkit-details-marker{display:none}
details.content-d>summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:1.2rem;line-height:1}
details.content-d[open]>summary::after{content:"−"}
details.content-d>summary svg{width:17px;height:17px;color:var(--focus)}
.content-body{margin:8px 0 0;line-height:1.6}
.links>li{padding:10px 0}
.links a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.links a span{color:var(--red);text-decoration:none}
.wlist{padding-left:18px;margin:8px 0} .wlist li{margin:8px 0}
/* ---------- PAINEL ---------- */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.hero>div{background:var(--surface);padding:14px;border-radius:var(--r);box-shadow:var(--sh1)}
.hero b{display:block;font-family:var(--mono);font-weight:700;font-size:2.4rem;line-height:1;letter-spacing:-.02em}
.hero>div>span{font-size:.84rem;color:var(--muted)}
.projbar{position:relative;height:10px;background:var(--sunk);margin:14px 0 6px;border-radius:999px}
.projbar i{display:block;height:100%;background:var(--green);border-radius:999px}
.projbar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red)}
.rankcard{display:flex;gap:14px;align-items:center;margin-top:14px;padding:14px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--sh1);width:100%;text-align:left}
.rankcard>div{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.rankcard b{font-family:var(--cond);font-size:1.3rem}
.patlist{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:4px}
.patlist li{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;color:var(--muted)}
.patlist li em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:.8rem}
.patlist li.done{color:var(--ink)} .patlist li.cur{background:var(--gold-soft);color:var(--ink);font-weight:700}
.patlist li:not(.done):not(.cur) .insig{opacity:.35;filter:grayscale(1)}
.subjrow{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 0}
.sr-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl{font-family:var(--cond);font-weight:700;white-space:nowrap}
.mbar{display:block;height:9px;background:var(--sunk);margin:6px 0 4px;border-radius:5px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.mbar.sm{height:6px;width:140px;max-width:100%}
.trow{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 0;background:none;border:0;text-align:left}
.trow .meta{font-size:.84rem;color:var(--muted)}
.trow .pill{font-family:var(--cond);font-size:.9rem}
.ladder .rail{stroke:var(--muted);stroke-width:2} .ladder.big .rail{stroke-width:3.5}
.ladder .rung{stroke-linecap:round} .ladder .on{stroke:var(--green)} .ladder .cur{stroke:var(--red)} .ladder .off{stroke:var(--line)}
.topichead{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:12px 0}
.bigladder{display:flex;gap:16px;align-items:center}
.bigladder ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column-reverse;gap:10px}
.bigladder li{font-family:var(--cond);font-weight:700;font-size:1.08rem;color:var(--muted)}
.bigladder li.on{color:var(--green)} .bigladder li.cur{color:var(--red)}
.tm-ring{position:relative;width:96px;height:96px;flex:none}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);text-align:left;min-width:0}
.act svg{width:20px;height:20px;color:var(--red);margin-bottom:4px}
.act b{font-size:.92rem;line-height:1.2} .act span{font-size:.76rem;color:var(--muted)}
.evsrc{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-top:12px}
.evsrc div{background:var(--surface);padding:10px 4px;text-align:center}
.evsrc b{display:block;font-family:var(--mono);font-size:1.1rem}
.evsrc span{font-size:.68rem;color:var(--muted)}
.wbars{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:8px;border-bottom:1px solid var(--line)}
.wbars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:center}
.wbars i{display:block;width:100%;border-radius:4px 4px 0 0}
.wbars span{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
.wchart{margin-top:16px;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1)}
.wc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wc-bars{position:relative;display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:12px}
.wc-goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--gold);pointer-events:none}
.wc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px;position:relative}
.wc-col i{display:block;width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--sunk);transition:height .6s cubic-bezier(.22,1,.36,1)}
.wc-col.has i{background:var(--red);opacity:.5} .wc-col.meta i{background:var(--gold);opacity:.9} .wc-col.today i{opacity:1}
.wc-v{font-family:var(--mono);font-size:.66rem;color:var(--muted);min-height:1em}
.wc-d{font-size:.7rem;font-weight:700;color:var(--muted);min-height:1em} .wc-col.today .wc-d{color:var(--ink)}
.wchart.dense .wc-bars{gap:2px} .wchart.dense .wc-v{display:none}
.bigstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bstat{padding:14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
.bstat b{display:block;font-family:var(--mono);font-size:1.8rem;line-height:1}
.bstat>span{display:block;font-size:.82rem;color:var(--muted);margin-top:4px}
.bstat em{display:block;font-style:normal;font-size:.76rem;color:var(--m4);margin-top:2px;font-weight:700}
.crit{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:10px 0}
.crit .w{color:var(--red);font-weight:700}
.achlist li{display:flex;gap:12px;align-items:center;padding:10px 0}
.achlist .ai{width:34px;height:34px;display:grid;place-items:center;background:var(--sunk);flex:none;color:var(--on-green)}
.achlist li.on .ai{background:var(--gold)}
.achlist li:not(.on){opacity:.55}
.insignia{clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)}
.checkdraw{width:20px;height:20px;flex:none}
.checkdraw path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:checkdraw .32s .05s ease-out forwards}
@keyframes checkdraw{to{stroke-dashoffset:0}}
/* ---------- ERROS e REDAÇÃO ---------- */
.errcta{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;margin-top:14px;padding:16px;border:0;border-radius:var(--r);background:var(--red);color:var(--on-red);text-align:left;box-shadow:var(--sh2)}
.ec-n{font-family:var(--mono);font-weight:700;font-size:2.3rem;line-height:1}
.ec-t b{display:block;font-size:1.03rem;line-height:1.2} .ec-t span{display:block;font-size:.84rem;opacity:.88;margin-top:3px}
.ec-go svg{width:22px;height:22px;display:block}
.errok{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--green-soft);font-size:.92rem}
.errok .checkdraw{color:var(--green)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
